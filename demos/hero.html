<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero</title>
  <link rel="stylesheet" href="../src/styles/themes.css?v=4.0.0">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg-primary, #0b0f14); }
    /* No site.css: its gutters and max-width are what stop a component from
       reaching the browser edges. */
    body, body * { box-sizing: border-box; }
  </style>
</head>
<body>

  <div x-cardhero
    pretitle="Open Source #4"
    title="WB-Starter, the last wave needed!"
    subtitle="Light DOM, no shadow boundaries. No class heirarchy. Bullet-proof."
    height="500px"
    xalign="center"
    variant="minimal"
    cta="Star on GitHub"
    cta-href="https://github.com/CieloVistaSoftware/wb-starter"
    cta-secondary="Read the guide"
    cta-secondary-href="../public/doc-viewer.html?file=docs%2FV3-GUIDE.md"
    background="linear-gradient(135deg, var(--danger-color), var(--warning-color))"
    style="display:block; width:100%;"
    x-fadein>
  </div>

  <script type="module">
    import WB from '../src/core/wb-lazy.js';
    await WB.init({ autoInject: true });
  </script>
</body>
</html>
