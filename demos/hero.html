<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero</title>
  <link rel="stylesheet" href="../src/styles/themes.css?v=1.0.391">
  <style>
    html, body { margin: 0; padding: 0; background: var(--bg-primary, #0b0f14); }
    /* No site.css: its gutters and max-width are what stop a behavior from
       reaching the browser edges. */
    body, body * { box-sizing: border-box; }
  
    /* Moved from style= attributes: no inline styles anywhere (#779). A doubled
       class (.x.x) is one that has to outrank a page rule, as the inline did. */
    .d-block-w-100pct.d-block-w-100pct { display:block; width:100%; }
  </style>
</head>
<body>

  <section x-cardhero
    pretitle="Open Source #4"
    title="WB-Starter, the last wave needed!"
    subtitle="Light DOM, no shadow boundaries. No class heirarchy. Bullet-proof."
    height="500px"
    xalign="center"
    variant="minimal"
    cta="Star on GitHub"
    ctaHref="https://github.com/CieloVistaSoftware/wb-starter"
    ctaSecondary="Read the guide"
    ctaSecondaryHref="https://cielovistasoftware.github.io/wb-starter/public/doc-viewer.html?file=docs%2FV3-GUIDE.md"
    background="linear-gradient(135deg, var(--danger-color), var(--warning-color))"
    class="d-block-w-100pct"
    x-fadein>
  </section>

  <script type="module">
    import WB from '../src/core/wb-lazy.js';
    await WB.init({ autoInject: true });
  </script>
</body>
</html>
