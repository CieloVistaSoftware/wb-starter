<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Now — Summer Collection 2026</title>
  <link rel="stylesheet" href="../../src/styles/themes.css">
  <link rel="stylesheet" href="../../src/styles/site.css">
  <style>
    body > .page { padding: var(--space-xl); }
    @media (max-width: 640px) { body > .page { padding: 1rem; } }
  </style>
</head>

<body>
  <div class="page">
  <nav style="margin-bottom: 1rem;">
    <a href="cards.html" style="color: var(--text-secondary, #aaa); text-decoration: none;">← Back to Card Behaviors</a>
  </nav>
  <h1>🛍️ Shop Now — Summer Collection 2026</h1>
  <p>Fresh styles, bold colors. This is the real page the cardhero "Shop Now" CTA on <a href="cards.html">cards.html</a> links to.</p>

  <div x-demo columns="3">
    <article x-cardproduct image="/images/placeholder-scene.svg" title="Bold Print Tee" description="Lightweight cotton, vivid summer print" price="$34" rating="4.6" reviews="89"></article>
  </div>
  <div x-demo columns="3">
    <article x-cardproduct image="/images/placeholder-scene.svg" title="Linen Shorts" description="Breathable linen blend, relaxed fit" price="$42" rating="4.4" reviews="52"></article>
  </div>
  <div x-demo columns="3">
    <article x-cardproduct image="/images/placeholder-scene.svg" title="Wide Brim Hat" description="UPF 50+ sun protection, packable" price="$28" rating="4.8" reviews="134"></article>
  </div>

  </div>

  <script type="module">
    import WB from '../../src/core/wb-lazy.js';
    window.WB = WB;
    // #970: init() already scans — a second walk races it. One scan, one path.
    await WB.init({ autoInject: true, scan: false });
    // #987: was { eager: true }, which overrode x-demo's IntersectionObserver
    // path and built every demo on the page before it could be interacted with.
    // Measured on the worst case (cards.html, 293 demos): 13,680ms of total
    // main-thread blocking including one unbroken 9,110ms task — frozen, not
    // just slow. Viewport-first lets EAGER_BUILD_COUNT + the observer work.
    await WB.scan(document.body);
  </script>
</body>

</html>
