<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlays & Popups</title>
  <link rel="stylesheet" href="../../src/styles/themes.css">
  <link rel="stylesheet" href="../../src/styles/site.css">
  <link rel="stylesheet" href="../../src/styles/pages/showcase.css">

</head>

<body class="demo-page">
  <nav class="site-demo__nav">
    <a href="index.html" class="site-demo__back">← Back to Index</a>
  </nav>
  <h1>🪟 Overlays & Popups</h1>
  <p>Dialogs, drawers, dropdowns for modal content</p>

  <!-- 1. 🪟 Dialog -->
  <section id="dialog-dialog">
  <h2>🪟 Dialog</h2>
  <figure x-demo columns="1">
    <button x-dialog title="Basic Dialog">
      title=Basic Dialog
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog title="Large" size="lg">
      title=Large, size=lg
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog title="No Close" showClose="false">
      title=No Close, showClose=false
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog title="Centered" variant="centered">
      title=Centered, variant=centered
    </button>
  </figure>
  </section>

  <!-- 2. size variants -->
  <section id="dialog-size-variants">
  <h2>size variants</h2>
  <figure x-demo columns="1">
    <button x-dialog size="sm">
      size=sm
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog size="md">
      size=md
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog size="lg">
      size=lg
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog size="xl">
      size=xl
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog size="full">
      size=full
    </button>
  </figure>
  </section>

  <!-- 3. Variants -->
  <section id="dialog-variant-variants">
  <h2>Variants</h2>
  <figure x-demo columns="1">
    <button x-dialog variant="default">
      variant=default
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog variant="centered">
      variant=centered
    </button>
  </figure>
  <figure x-demo columns="1">
    <button x-dialog variant="fullscreen">
      variant=fullscreen
    </button>
  </figure>
  </section>

  <!-- 4. 📜 Drawer -->
  <section id="drawer-drawer">
  <h2>📜 Drawer</h2>
  <figure x-demo columns="1">
    <aside x-drawer title="Right Drawer" position="right">
      title=Right Drawer, position=right
    </aside>
  </figure>
  <figure x-demo columns="1">
    <aside x-drawer title="Left Drawer" position="left">
      title=Left Drawer, position=left
    </aside>
  </figure>
  <figure x-demo columns="1">
    <aside x-drawer title="Wide" width="400px">
      title=Wide, width=400px
    </aside>
  </figure>
  </section>

  <!-- 5. position variants -->
  <section id="drawer-position-variants">
  <h2>position variants</h2>
  <figure x-demo columns="1">
    <aside x-drawer position="left">
      position=left
    </aside>
  </figure>
  <figure x-demo columns="1">
    <aside x-drawer position="right">
      position=right
    </aside>
  </figure>
  <figure x-demo columns="1">
    <aside x-drawer position="top">
      position=top
    </aside>
  </figure>
  <figure x-demo columns="1">
    <aside x-drawer position="bottom">
      position=bottom
    </aside>
  </figure>
  </section>

  <!-- 6. Variants -->
  <section id="drawer-variant-variants">
  <h2>Variants</h2>
  <figure x-demo columns="1">
    <aside x-drawer variant="default">
      variant=default
    </aside>
  </figure>
  <figure x-demo columns="1">
    <aside x-drawer variant="overlay">
      variant=overlay
    </aside>
  </figure>
  <figure x-demo columns="1">
    <aside x-drawer variant="push">
      variant=push
    </aside>
  </figure>
  </section>

  <!-- 7. 📋 Dropdown -->
  <section id="dropdown-dropdown">
  <h2>📋 Dropdown</h2>
  <figure x-demo columns="1">
    <div x-dropdown items="Profile,Settings,Logout" position="bottom-start">
      position=bottom-start
    </div>
  </figure>
  <figure x-demo columns="1">
    <div x-dropdown items="Profile,Settings,Logout" position="bottom-end">
      position=bottom-end
    </div>
  </figure>
  <figure x-demo columns="1">
    <div x-dropdown items="Profile,Settings,Logout" trigger="hover">
      trigger=hover
    </div>
  </figure>
  </section>

  <!-- 8. position variants -->
  <section id="dropdown-position-variants">
  <h2>position variants</h2>
  <figure x-demo columns="1">
    <div x-dropdown items="Profile,Settings,Logout" position="top-start">
      position=top-start
    </div>
  </figure>
  <figure x-demo columns="1">
    <div x-dropdown items="Profile,Settings,Logout" position="top-end">
      position=top-end
    </div>
  </figure>
  </section>

  <!-- 9. trigger variants -->
  <section id="dropdown-trigger-variants">
  <h2>trigger variants</h2>
  <figure x-demo columns="2">
    <div x-dropdown items="Profile,Settings,Logout" trigger="click">
      trigger=click
    </div>
  </figure>
  </section>

  <script type="module">
    import WB from '../../src/core/wb-lazy.js';
    window.WB = WB;
    await WB.init({ autoInject: true });
    await WB.scan(document.body);
    console.log('Overlays & Popups initialized');
    window.__WB_DEMO_INITIALIZED__ = true;
  </script>
</body>

</html>
