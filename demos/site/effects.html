<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Effects</title>
  <link rel="stylesheet" href="../../src/styles/themes.css">
  <link rel="stylesheet" href="../../src/styles/site.css">
  <link rel="stylesheet" href="../../src/styles/pages/showcase.css">

</head>

<body class="demo-page">
  <nav class="site-demo__nav">
    <a href="index.html" class="site-demo__back">← Back to Index</a>
  </nav>
  <h1>✨ Visual Effects</h1>
  <p>Ripple and toggles. Confetti, fireworks, snow and stage lights are <a href="../../?page=pro">WB Pro</a>.</p>



  <!-- 3. 💧 Ripple -->
  <section id="ripple-ripple">
  <h2>💧 Ripple</h2>
  <figure x-demo columns="1">
    <div x-ripple>
      This is example ripple content.
    </div>
  </figure>
  <figure x-demo columns="1">
    <div x-ripple color="rgba(0,0,0,0.2)">
      This is example ripple content.
    </div>
  </figure>
  <figure x-demo columns="1">
    <div x-ripple duration="300">
      This is example ripple content.
    </div>
  </figure>
  </section>

  <!-- 4. Toggles -->
  <section id="ripple-toggles">
  <h2>Toggles</h2>
  <figure x-demo columns="1">
    <div x-ripple centered>
      This is example ripple content.
    </div>
  </figure>
  </section>




  <script type="module">
    import WB from '../../src/core/wb-lazy.js';
    window.WB = WB;
    await WB.init({ autoInject: true });
    await WB.scan(document.body);
    console.log('Visual Effects initialized');
    window.__WB_DEMO_INITIALIZED__ = true;
  </script>
</body>

</html>
