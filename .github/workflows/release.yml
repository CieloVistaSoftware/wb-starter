name: Release

# Every "release: X.Y.Z" commit on main gets its tag, its GitHub release and its
# npm packages, without a person doing it by hand (#1182). `npm run ship` makes
# the release commit; this finishes the release. Nothing here depends on who
# pushed: it runs on every push to main and fills in whatever is missing, so a
# release the tagging missed (1.0.0, 4.0.6) is completed by the next push.
#
# Every step says what it did or why it did nothing -- never a silent skip.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      npm_version:
        description: 'Release: publish main to npm as this X.Y.Z (both packages). Must be higher than npm has.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write   # start the stamp workflow after a release (#1882)
  # npm Trusted Publishing: npm accepts this run's OIDC identity in place of a
  # token, so 2FA stays on for the account (npm restricts 2FA-bypass tokens).
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, GitHub release, npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history, for the release commits)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1 or later.
      - name: Use npm 11
        run: npm install -g npm@11 && npm --version

      # One tag that cannot be made must not stop the others, the GitHub releases
      # or npm (first run, 2026-09-30: v1.0.0 was tagged, then v4.0.6 was refused
      # and the job ended there). A git push of a tag whose commit carries older
      # workflow files is refused to the Actions token ("without `workflows`
      # permission"), so the tag API is tried next; a tag both refuse is named
      # in a warning and the run goes on.
      - name: Tag every release commit that has no tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          git log --format='%H %s' origin/main | grep -E '^[0-9a-f]+ release: [0-9]+\.[0-9]+\.[0-9]+' | while read -r sha _ version _; do
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "✓ ${tag} already tagged"
            elif git tag "${tag}" "${sha}" && git push origin "refs/tags/${tag}" 2>push.err; then
              echo "➕ tagged ${tag} at ${sha:0:8}"
            elif gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" >/dev/null 2>api.err; then
              echo "➕ tagged ${tag} at ${sha:0:8} (tag API; git push was refused: $(tr '\n' ' ' < push.err))"
            else
              git tag -d "${tag}" >/dev/null 2>&1 || true
              echo "::warning::${tag} could not be tagged at ${sha:0:8}. git push: $(tr '\n' ' ' < push.err) | tag API: $(tr '\n' ' ' < api.err)"
            fi
          done
          git fetch --tags --force

      - name: GitHub release for every version in data/releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in $(node -p "require('./data/releases.json').releases.map(r => r.version).join(' ')"); do
            tag="v${version}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "… ${tag}: no release commit on main yet, no GitHub release"
            elif gh release view "${tag}" >/dev/null 2>&1; then
              echo "✓ ${tag} GitHub release exists"
            else
              node scripts/release-notes.mjs "${version}" > notes.md
              latest=$([ "${version}" = "$(node -p "require('./package.json').version")" ] && echo --latest || echo --latest=false)
              gh release create "${tag}" --title "${version}" --notes-file notes.md --verify-tag ${latest}
              echo "➕ GitHub release ${tag}"
            fi
          done

      # #1882 -- John, 2026-10-13: "all i want is npm.js to drive our release
      # numbering ... in sync forever" (both packages). A release is a hand-started run with npm_version: both
      # packages are published from main under that one number, which must be
      # higher than what npm has for either. Nothing is committed or tagged;
      # the site badge reads npm's number (scripts/stamp-version.js), and the
      # stamp workflow is started at the end so the badge shows it at once.
      - name: Publish both packages to npm under npm_version
        if: ${{ inputs.npm_version != '' && inputs.npm_version != null }}
        env:
          NPM_VERSION: ${{ inputs.npm_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "${NPM_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm_version must be X.Y.Z, got '${NPM_VERSION}'"; exit 1
          fi
          for name in wb-starter create-wb-starter; do
            current=$(npm view "${name}" version 2>/dev/null || echo 0.0.0)
            highest=$(printf '%s\n%s\n' "${current}" "${NPM_VERSION}" | sort -V | tail -1)
            if [ "${NPM_VERSION}" = "${current}" ] || [ "${highest}" != "${NPM_VERSION}" ]; then
              echo "::error::npm_version ${NPM_VERSION} must be higher than ${name}'s ${current} on npm"; exit 1
            fi
          done
          echo "Publishing main ($(git rev-parse --short HEAD)) as ${NPM_VERSION}, both packages"
          for dir in . packages/create-wb-starter; do
            (cd "${dir}" && npm version "${NPM_VERSION}" --no-git-tag-version --allow-same-version >/dev/null \
              && npm publish --ignore-scripts --access public)
            echo "➕ published $(node -p "require('./${dir}/package.json').name")@${NPM_VERSION}"
          done
          gh workflow run stamp-version-on-main.yml --ref main \
            && echo "Started the stamp workflow, so the site badge shows ${NPM_VERSION}" \
            || echo "::warning::could not start the stamp workflow; the badge updates on the next push to main"

      # A push to main never publishes to npm (#1882): npm's number only moves
      # when someone runs Release with npm_version.
      - name: npm
        if: ${{ inputs.npm_version == '' || inputs.npm_version == null }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::warning::npm_version was empty, so nothing was published. Run Release again and type the next version in npm_version."
          else
            echo "… a push to main does not publish to npm; run Release with npm_version to release"
          fi
