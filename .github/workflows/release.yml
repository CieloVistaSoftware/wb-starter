name: Release

# Every "release: X.Y.Z" commit on main gets its tag, its GitHub release and its
# npm packages, without a person doing it by hand (#1182). `ship.mjs` makes the
# release commit; this finishes the release, filling in whatever is missing, so
# a release the tagging missed (1.0.0, 4.0.6) is completed by the next run.
#
# Since 2026-10-02 releases are nightly (John: "no full test run until the end
# of the day when i say park, then when I get up the next morning we have a new
# release"). nightly.yml calls this right after it pushes the release commit; it
# no longer runs on every push to main, because a push to main is no longer a
# release. workflow_dispatch stays for finishing a release by hand.
#
# Every step says what it did or why it did nothing -- never a silent skip.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, GitHub release, npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref: main, not the triggering commit: when nightly.yml calls this, the
      # run started on the commit BEFORE the release commit it just pushed, and
      # the npm step reads the version from package.json in this checkout.
      - name: Checkout (full history, for the release commits)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # One tag that cannot be made must not stop the others, the GitHub releases
      # or npm (first run, 2026-09-30: v1.0.0 was tagged, then v4.0.6 was refused
      # and the job ended there). A git push of a tag whose commit carries older
      # workflow files is refused to the Actions token ("without `workflows`
      # permission"), so the tag API is tried next; a tag both refuse is named
      # in a warning and the run goes on.
      - name: Tag every release commit that has no tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          git log --format='%H %s' origin/main | grep -E '^[0-9a-f]+ release: [0-9]+\.[0-9]+\.[0-9]+' | while read -r sha _ version _; do
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "✓ ${tag} already tagged"
            elif git tag "${tag}" "${sha}" && git push origin "refs/tags/${tag}" 2>push.err; then
              echo "➕ tagged ${tag} at ${sha:0:8}"
            elif gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${tag}" -f sha="${sha}" >/dev/null 2>api.err; then
              echo "➕ tagged ${tag} at ${sha:0:8} (tag API; git push was refused: $(tr '\n' ' ' < push.err))"
            else
              git tag -d "${tag}" >/dev/null 2>&1 || true
              echo "::warning::${tag} could not be tagged at ${sha:0:8}. git push: $(tr '\n' ' ' < push.err) | tag API: $(tr '\n' ' ' < api.err)"
            fi
          done
          git fetch --tags --force

      - name: GitHub release for every version in data/releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in $(node -p "require('./data/releases.json').releases.map(r => r.version).join(' ')"); do
            tag="v${version}"
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "… ${tag}: no release commit on main yet, no GitHub release"
            elif gh release view "${tag}" >/dev/null 2>&1; then
              echo "✓ ${tag} GitHub release exists"
            else
              node scripts/release-notes.mjs "${version}" > notes.md
              latest=$([ "${version}" = "$(node -p "require('./package.json').version")" ] && echo --latest || echo --latest=false)
              gh release create "${tag}" --title "${version}" --notes-file notes.md --verify-tag ${latest}
              echo "➕ GitHub release ${tag}"
            fi
          done

      - name: Publish to npm (wb-starter, create-wb-starter)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "… ${version} has no release commit yet: nothing to publish"; exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not set in the repository secrets, so npm was not published."; exit 0
          fi
          # Publish the code the tag names, not whatever main holds now: main
          # moves on after a release and still says the same version until the
          # next one is cut.
          pub="${RUNNER_TEMP}/publish-v${version}"
          git worktree add --detach "${pub}" "v${version}"
          echo "Publishing from v${version} ($(git rev-parse --short "v${version}^{commit}"))"
          for dir in . packages/create-wb-starter; do
            name=$(node -p "require('${pub}/${dir}/package.json').name")
            ver=$(node -p "require('${pub}/${dir}/package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "✓ ${name}@${ver} already on npm"
            else
              (cd "${pub}/${dir}" && npm publish --ignore-scripts --access public)
              echo "➕ published ${name}@${ver}"
            fi
          done
