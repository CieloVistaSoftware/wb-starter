name: Release (OIDC probe, branch only)

# Diagnostic on branch claude/oidc-probe only (2026-10-13), never merged: asks
# npm whether it accepts this workflow's OIDC identity for each package. Prints
# npm's HTTP status and error text, never a token. Nothing is published.

on:
  push:
    branches: [ claude/oidc-probe ]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange the OIDC token with npm, per package
        run: |
          id=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0)).value")
          for pkg in wb-starter create-wb-starter; do
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${id}" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${pkg}")
            echo "${pkg}: HTTP ${code} $(node -e "try{const j=require('/tmp/r.json');console.log(j.token?'token issued (not shown)':JSON.stringify(j))}catch(e){console.log('(no JSON)')}")"
          done
