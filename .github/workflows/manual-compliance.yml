name: Manual Compliance (dispatch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to run the workflow on'
        required: false
        default: 'main'
      tests:
        description: 'Playwright test path or pattern (optional)'
        required: false
        default: ''
      trace:
        description: 'Enable Playwright traces'
        required: false
        default: 'true'

permissions:
  contents: read
  actions: read

jobs:
  run-compliance:
    name: Run focused compliance (with artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Disable recursive fs.watch during CI runs to avoid platform-specific
      # ERR_FEATURE_UNAVAILABLE_ON_PLATFORM in GitHub-hosted runners.
      DISABLE_WATCH: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (ensure dev deps)
        run: |
          # Ensure devDependencies (like @playwright/test) are installed even if
          # runner sets NODE_ENV=production. Try a normal CI install, then force
          # dev deps if missing.
          npm ci --no-audit || true
          if [ ! -d node_modules/@playwright/test ]; then
            echo "@playwright/test missing — installing @playwright/test transiently"
            npm install --no-audit --no-fund --no-package-lock --save-dev @playwright/test
          fi

          # Ensure Playwright browsers are available
          npx playwright install --with-deps

      # Same two paths as every other workflow (#1163): named specs through
      # scripts/locked-spec-run.mjs, a whole project through the ratchet. Both
      # keep playwright.config.ts's own reporters — a `--reporter=` flag REPLACES
      # them, which is how data/errors.json stopped being created and
      # "error log should exist" came to pass only when the site was broken.
      # Tracing is asked for with WB_TRACE, not a flag, for the same reason.
      - name: Run Playwright (focused)
        id: run
        env:
          WB_TRACE: ${{ github.event.inputs.trace == 'true' && 'on' || 'off' }}
        run: |
          set -e
          REF="${{ github.event.inputs.ref || github.ref }}"
          echo "Running tests on ref: ${REF}"
          if [ -n "${{ github.event.inputs.tests }}" ]; then
            node scripts/locked-spec-run.mjs ${{ github.event.inputs.tests }}
          else
            WB_GATE_PROJECTS=compliance node .husky/test-ratchet.mjs
          fi
        shell: bash

      - name: Collect artifacts (trace + logs)
        if: always()
        run: |
          mkdir -p artifacts || true
          # copy common Playwright outputs
          cp -v data/playwright-output/**/*.zip artifacts/ 2>/dev/null || true
          cp -v data/test-results/**/*.log artifacts/ 2>/dev/null || true
          cp -v data/playwright-output/.last-run.json artifacts/ 2>/dev/null || true
          ls -la artifacts || true

      - name: Upload Playwright traces & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: artifacts/**

      - name: Summary
        if: always()
        run: |
          echo "CI: Playwright focused run complete. Artifacts uploaded as 'playwright-traces' if present."