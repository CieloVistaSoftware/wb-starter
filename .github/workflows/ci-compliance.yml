name: CI — Full Compliance

on:
  push:
    branches: [ main ]
  # The old `tests` input appended a pattern to a hand-written playwright
  # command. That command is gone (#1163), and the ratchet takes no pattern: it
  # compares a whole project against the register, which is the only way its
  # verdict means anything. An input nothing reads is worse than no input.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-compliance:
    name: Run full compliance (with traces)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (ensure dev deps)
        run: |
          npm ci --no-audit || true
          if [ ! -d node_modules/@playwright/test ]; then
            npm install --no-audit --no-fund --no-package-lock --save-dev @playwright/test
          fi
          npx playwright install --with-deps

      # THE GATE'S QUESTION, NOT A SECOND ONE (#1163).
      #
      # This step used to be a hand-written
      #   npx playwright test --project=compliance --reporter=list --trace=on
      # from January, which #1044 never reached. It differed from the gate three
      # ways, each red on its own:
      #   - no register: 66 of its 79 failures on 7e67e08b were entries in
      #     data/test-baseline-failures.json, which every other gate calls debt
      #   - --reporter=list REPLACES the configured reporters, so
      #     scripts/tools/test-reporter.ts never ran and never created
      #     data/errors.json — "error log should exist" then failed unless some
      #     page happened to log an error, i.e. it passed only when broken
      #   - --trace=on at 8 workers made long specs 3-10x slower on a 4-vCPU
      #     runner: 9 timeouts, and live-examples went 30s -> 3.5m
      # Every one of the last 30 runs failed, so its colour said nothing.
      #
      # The ratchet brings the register, the project's own reporters and the
      # gate's worker count with it. WB_GATE_PROJECTS narrows it to compliance;
      # WB_TRACE keeps evidence for failures only (#1112).
      - name: Run the gate (compliance project)
        id: run
        env:
          WB_GATE_PROJECTS: compliance
          WB_TRACE: retain-on-failure
        run: node .husky/test-ratchet.mjs
        shell: bash

      - name: Collect artifacts (trace + logs)
        if: always()
        run: |
          mkdir -p artifacts || true
          cp -v data/playwright-output/**/*.zip artifacts/ 2>/dev/null || true
          cp -v data/test-results/**/*.log artifacts/ 2>/dev/null || true
          cp -v data/playwright-output/.last-run.json artifacts/ 2>/dev/null || true
          ls -la artifacts || true

      - name: Upload Playwright traces & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: artifacts/**
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "CI: full compliance run complete. Artifacts uploaded as 'playwright-traces' if present."