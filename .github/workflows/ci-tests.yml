name: CI — Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  # nightly.yml calls this same workflow for the overnight full run, so the
  # suite it runs is the one PRs see -- one definition, not two.
  workflow_call:

permissions:
  contents: read

# #341, second cause — a run cancelled by the next push is a run with no verdict.
#
# Raising the timeout (below) was necessary and not sufficient. The gate takes
# ~38 minutes; pushes to main during a working session arrive every 6-15:
#
#   17:22:01  b7aa38d3      17:13:30  6df88b04      16:58:48  cc5593e1
#   16:46:57  8c161965      16:41:31  fcda73ee      15:30:41  855afef1
#
# With cancel-in-progress on a push, each run is killed by the next one long
# before it finishes. Run 34284925939 — the FIRST run carrying the 60-minute
# budget, the one that was finally going to answer #341 — died at 3m12s that
# way. Of the twelve most recent main runs, nine were cancelled and the only
# two that reached a conclusion both predate #1044. So the workflow has still
# never produced a verdict, for a completely different reason than the clock.
#
# Cancelling is right for a pull request: an outdated head commit's result is
# worthless and the next push will re-answer it. It is wrong for main, where
# every commit is permanent and the whole point is knowing whether THAT commit
# was green. #341 asks for "a real, reproducible green baseline" — unreachable
# while every run is killed at 8% for the crime of not being the newest.
#
# This does not queue runs without bound. GitHub keeps at most one PENDING run
# per concurrency group and cancels the previously pending one, so a burst of
# six pushes costs one in-flight run plus one waiting — never six.
# github.workflow is the CALLER's name when nightly.yml calls this, so the
# nightly run gets its own group and is never queued behind (or cancelled as a
# pending duplicate of) a push run on main.
concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job definition, one check per test category, run side by side.
  #
  # John, 2026-10-01: "I want to see more granularity on these tests ... many
  # categories of test, not just one big test." One 33-minute "Playwright
  # Tests" check said only red or green; which category broke was in the log.
  # Each project now runs on its own runner as its own check, so a red one
  # names its category on the PR, and the wall clock is the slowest category
  # rather than the sum of all of them.
  #
  # The gated projects run the SAME ratchet as before, narrowed to one project
  # with WB_GATE_PROJECTS (#1163): same register, same reporters, same worker
  # count. integration and base are still reported, not enforced (#1044).
  # fail-fast: false, or the first red category would cancel the rest and
  # leave them unmeasured, which is the #1044 skipped-steps defect again.
  test:
    name: Playwright (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: compliance, gated: true }
          - { project: regression, gated: true }
          - { project: behaviors, gated: true }
          - { project: schema-viewer, gated: true }
          - { project: integration, gated: false }
          - { project: base, gated: false }
    # #1218 -- John: "the only reason Linux is a part is that it's what you
    # use internally." The site is built, served and shipped from Windows, so
    # the gate that decides whether a commit is good runs there too. On Linux
    # a Windows-only failure could never block a push; it only surfaced later
    # on John's machine, as a twin the register carried and CI could not clear
    # (#1217).
    runs-on: windows-latest
    # The start/stop-server steps below are bash (&, $!, curl, kill). Windows
    # runners ship Git Bash, so the scripts stay as they are rather than being
    # rewritten in PowerShell.
    defaults:
      run:
        shell: bash
    # #341 — the budget has to be bigger than the thing it is timing.
    #
    # #1044 made CI run the same ratchet the pre-commit hook runs. It did not
    # change this number, and the ratchet is a 7,500-test run at 4 workers. It
    # does not fit in 30 minutes, so CI has not failed on a test since — it has
    # failed on the clock, and the clock kills it BEFORE the ratchet prints a
    # verdict. Two runs prove it, the only two allowed to end naturally rather
    # than being cancelled by the next push:
    #
    #   34071440575  "The job has exceeded the maximum execution time of 30m0s"
    #   34074191440  same, and the log shows exactly where it died:
    #                gate step 01:51:06 → killed 02:20:40 = 29m34s,
    #                at test 7020 of 7504 — 93.5% done, no verdict printed.
    #
    # So "CI is red" currently carries no information at all. Nobody has ever
    # seen this gate's answer. Budget: install ~1min + gate ~32min (extrapolated
    # from 7020 tests in 29m34s) + the integration/base report ~5min ≈ 38min.
    # 60 leaves headroom for a slow runner without letting a genuine hang run
    # all afternoon.
    timeout-minutes: 60
    env:
      CI: 'true'
      DISABLE_WATCH: 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # --with-deps installs Linux system packages; Windows needs none.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start server
        run: |
          # Runtime files live in the ignored data/test-results/, never the repo
          # root (docs/standards/REPO-LAYOUT.md; repo-layout.spec.ts failed on
          # a root server.pid).
          mkdir -p data/test-results
          node server.js > data/test-results/server.log 2>&1 &
          echo $! > data/test-results/server.pid
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health -m 2 >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      # #1044 — CI asks the SAME question the local gate asks.
      #
      # John: "if I can compile/run a site it means it's working at a particular
      # release level ... i don't expect any failures when it does push. after
      # all it's live on my local."
      #
      # That could not hold. The pre-commit hook runs .husky/test-ratchet.mjs,
      # which fails only on failures NOT in data/test-baseline-failures.json
      # (530 entries). CI ran raw `npx playwright test` with no baseline at all,
      # so it re-failed on all 530 every run — main has failed CI on every push
      # since 2026-09-03. Identical code, opposite verdicts, and the author of a
      # locally-verified change learns that CI red means nothing.
      #
      # Worse, these were four SEQUENTIAL steps with continue-on-error: false.
      # Compliance failed first, so integration/base/behaviors were reported as
      # `skipped` and never measured at all. The verdict was "compliance had at
      # least one of its 530 known failures", nothing more.
      #
      # This is #959's argument, already accepted for the local gate and never
      # applied here: "blocked and blind is worse than unblocked with real
      # detection." A regression pushed today arrives as failure 531 of 531 and
      # is invisible. The register only ever shrinks, so this does not entrench
      # the debt — it makes NEW debt visible, which is currently impossible.
      #
      # #341: a per-step budget, so an overrun names itself. When the JOB timed
      # out, the log said only "The operation was canceled." on a step that was
      # 93.5% through a passing run — indistinguishable from a cancel by the
      # next push, which is why this went unnoticed for days. A step timeout
      # says which step ran out of time, and leaves the report + artifact steps
      # enough of the job budget to still upload the evidence.
      - name: Gate — no NEW failures vs the register (${{ matrix.project }})
        if: matrix.gated
        timeout-minutes: 45
        env:
          WB_GATE_PROJECTS: ${{ matrix.project }}
        run: node .husky/test-ratchet.mjs
        continue-on-error: false

      # integration and base are NOT in the ratchet's project list, so no
      # baseline exists for them and neither gate has ever measured them — the
      # steps above were skipped on every run. Reported, not enforced, until
      # they have a register of their own: enforcing an unmeasured project would
      # just recreate the permanent red this change is removing.
      #
      # #341: `if: always()` also fires on CANCELLED, so when the job timed out
      # this reporting step started anyway and ran a further 4m45s past the
      # deadline (34074191440: 02:20:40 → 02:25:25) before the runner force-
      # killed it. A step that enforces nothing must never extend a job that is
      # already over. success() || failure() runs it on a normal red or green
      # and skips it on a cancel or timeout.
      - name: "Report — ${{ matrix.project }} (not yet ratcheted, see #1044)"
        if: (success() || failure()) && !matrix.gated
        timeout-minutes: 12
        continue-on-error: true
        run: |
          npx playwright test --project=${{ matrix.project }} --reporter=github || true

      # #341: this used to upload `playwright-report/`, which this repo does not
      # produce — playwright.config.ts's reporters are the project's own
      # test-reporter.ts plus `list`, no `html`. So the one step whose job was
      # to preserve the evidence from a red run has been uploading an empty
      # artifact (upload-artifact only WARNS on no files, it does not fail), and
      # a failed run left nothing behind to read. The reporter writes
      # data/test-results/ — failures.json and the per-project JSON that
      # issue-state.mjs already treats as the record. Upload what actually
      # exists.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}-${{ matrix.project }}
          path: data/test-results/
          retention-days: 14

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_number }}-${{ matrix.project }}
          path: data/playwright-output/**/*.zip
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f data/test-results/server.pid ]; then
            kill "$(cat data/test-results/server.pid)" 2>/dev/null || true
          fi

      - name: Show server log on failure
        if: failure()
        run: |
          echo "=== Server Log ==="
          cat data/test-results/server.log || true

  # The one check that answers "did every category pass?", under the name the
  # single job used to have, so anything that waits on "Playwright Tests"
  # (branch protection, a person) still finds it. Skipped on a cancel: a
  # cancelled run has no verdict to report.
  # The gate scripts' own guards. They used to run in the commit hook on every
  # commit; since 2026-10-02 the hook runs fast checks only (John: "no ci
  # duplication at all"), so they run here, once per PR and once per nightly.
  # No Playwright run, no server: throwaway repos and fake CLIs, ~1 minute.
  gate-self-test:
    name: Gate scripts self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # test-ship-rollback and test-suite-env commit inside throwaway repos.
      - name: Git identity for throwaway repos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Lock, gate, suite-env, ship-rollback and control-byte guards
        run: |
          npm run test:lock-guards
          npm run test:gate-guards
          npm run test:suite-env
          npm run test:free-port
          npm run test:ship-rollback
          npm run test:staged-control-bytes

  playwright:
    name: Playwright Tests
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every category passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::A Playwright category failed (${{ needs.test.result }}). Its own check above names it."
            exit 1
          fi
          echo "All Playwright categories passed."
