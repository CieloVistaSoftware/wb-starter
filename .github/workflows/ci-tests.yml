name: CI — Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      DISABLE_WATCH: 'true'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health -m 2 >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

      # #1044 — CI asks the SAME question the local gate asks.
      #
      # John: "if I can compile/run a site it means it's working at a particular
      # release level ... i don't expect any failures when it does push. after
      # all it's live on my local."
      #
      # That could not hold. The pre-commit hook runs .husky/test-ratchet.mjs,
      # which fails only on failures NOT in data/test-baseline-failures.json
      # (530 entries). CI ran raw `npx playwright test` with no baseline at all,
      # so it re-failed on all 530 every run — main has failed CI on every push
      # since 2026-09-03. Identical code, opposite verdicts, and the author of a
      # locally-verified change learns that CI red means nothing.
      #
      # Worse, these were four SEQUENTIAL steps with continue-on-error: false.
      # Compliance failed first, so integration/base/behaviors were reported as
      # `skipped` and never measured at all. The verdict was "compliance had at
      # least one of its 530 known failures", nothing more.
      #
      # This is #959's argument, already accepted for the local gate and never
      # applied here: "blocked and blind is worse than unblocked with real
      # detection." A regression pushed today arrives as failure 531 of 531 and
      # is invisible. The register only ever shrinks, so this does not entrench
      # the debt — it makes NEW debt visible, which is currently impossible.
      - name: Gate — no NEW failures vs the register (compliance, regression, behaviors)
        run: node .husky/test-ratchet.mjs
        continue-on-error: false

      # integration and base are NOT in the ratchet's project list, so no
      # baseline exists for them and neither gate has ever measured them — the
      # steps above were skipped on every run. Reported, not enforced, until
      # they have a register of their own: enforcing an unmeasured project would
      # just recreate the permanent red this change is removing.
      - name: Report — integration and base (not yet ratcheted, see #1044)
        if: always()
        continue-on-error: true
        run: |
          npx playwright test --project=integration --reporter=github || true
          npx playwright test --project=base --reporter=github || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_number }}
          path: data/playwright-output/**/*.zip
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Show server log on failure
        if: failure()
        run: |
          echo "=== Server Log ==="
          cat server.log || true
