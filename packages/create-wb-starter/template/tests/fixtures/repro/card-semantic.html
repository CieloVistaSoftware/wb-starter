<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Card Test</title>
    <script type="module">
        import WB from '../../../src/core/wb.js';
        WB.init({ debug: true, autoInject: true });
    </script>
    <style>
        /* Basic styles to see the card */
        body { font-family: sans-serif; padding: 2rem; background: #111; color: #eee; }
    </style>
</head>
<body>
    <h1>Semantic Card Test</h1>

    <h2>1. Semantic Article (Should be a Card)</h2>
    <article id="semantic-card">
        <header>
            <h3>Semantic Title</h3>
            <p>Semantic Subtitle</p>
        </header>
        <main>
            <p>This is the main content of an article</p>
        </main>
        <footer>
            <button>Action</button>
        </footer>
    </article>
    <article id="semantic-card-2">
      <header><h3>Second Card</h3></header>
      <main><p>Second semantic card</p></main>
    </article>

    <h2>2. Standard Div Card (Control)</h2>
    <article id="div-card" title="Div Title" content="Div Content" footer="Div Footer"></article>

    <script>
        // The card contract no longer injects classes onto an <article> or its
        // <header> (card.js #478 / "specificity, not class injection"):
        // card.css matches `article` and `article > header` by tag. So "became
        // a card" means: the card behavior ran (x-ready), the authored header
        // survived in place with its heading, and card.css's header rule
        // (display:grid) applies.
        //
        // Polled, not read once at a fixed 1s: the behavior and its JIT
        // stylesheet land whenever the page gets to them, and a one-shot timer
        // reported FAIL on a busy machine for a card that was fine 200ms later.
        const semantic = document.getElementById('semantic-card');
        const semanticHeader = semantic.querySelector('header');
        const becameCard = () => semantic.hasAttribute('x-ready')
            && semanticHeader.parentElement === semantic
            && !!semanticHeader.querySelector('h3')
            && getComputedStyle(semanticHeader).display === 'grid';
        const deadline = Date.now() + 10000;
        (function check() {
            if (becameCard()) {
                console.log('PASS: Semantic Article became a Card and preserved structure');
            } else if (Date.now() < deadline) {
                setTimeout(check, 100);
            } else {
                console.log('Semantic Classes:', semantic.className);
                console.log('Semantic Header Classes:', semanticHeader.className);
                console.error('FAIL: Semantic Article did not become a proper Card');
            }
        })();
    </script>
</body>
</html>
