<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Audit 365 fixture</title>
  <link rel="stylesheet" href="/src/styles/themes.css">
</head>
<body>
  <!-- Bare custom tags -->
  <wb-autocomplete id="t-autocomplete"></wb-autocomplete>
  <wb-behavior id="t-behavior"></wb-behavior>
  <wb-colorpicker id="t-colorpicker"></wb-colorpicker>
  <wb-counter id="t-counter"></wb-counter>
  <wb-error id="t-error"></wb-error>
  <wb-fieldset id="t-fieldset"></wb-fieldset>
  <wb-file id="t-file"></wb-file>
  <wb-fix-card id="t-fix-card"></wb-fix-card>
  <wb-floatinglabel id="t-floatinglabel"></wb-floatinglabel>
  <wb-formrow id="t-formrow"></wb-formrow>
  <wb-help id="t-help"></wb-help>
  <wb-inputgroup id="t-inputgroup"></wb-inputgroup>
  <wb-label id="t-label"></wb-label>
  <wb-masked id="t-masked"></wb-masked>
  <wb-tags id="t-tags"></wb-tags>

  <!-- x-* attribute usage on native elements, per issue's claim these are the real usage pattern -->
  <input id="x-autocomplete" x-autocomplete list="opts">
  <input id="x-colorpicker" x-colorpicker>
  <input id="x-counter" x-counter maxlength="10">
  <input id="x-error" x-error="This field is required">
  <fieldset id="x-fieldset" x-fieldset><legend>Group</legend></fieldset>
  <input id="x-file" x-file type="file">
  <input id="x-floatinglabel" x-floatinglabel placeholder="Name">
  <div id="x-formrow" x-formrow></div>
  <input id="x-help" x-help="Some help text">
  <div id="x-inputgroup" x-inputgroup></div>
  <input id="x-label" x-label="Email">
  <input id="x-masked" x-masked="000-000-0000">
  <input id="x-tags" x-tags>

  <script type="module">
    import WB from '/src/core/wb.js';
    window.__wbDone = false;
    WB.init({ autoInject: true }).then(() => WB.scan(document.body)).then(() => { window.__wbDone = true; });
  </script>
</body>
</html>
