<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Explicit Card Test</title>
    <script type="module">
        import WB from '../src/core/wb.js';
        // This page verifies the NON-auto-inject path: a plain <article> stays
        // plain, while an explicit <article> custom tag still upgrades.
        WB.init({ debug: true, autoInject: false });
    </script>
</head>

<body>
    <!-- 1. Plain Article (Should NOT be a card anymore) -->
    <article id="plain">
        <header>
            <h3>Plain Article</h3>
        </header>
        <p>Just text.</p>
    </article>

    <!-- 2. Explicit Card (Should BE a card). It carries the behavior by name:
         this page runs with autoInject:false, so the tag alone does nothing.
         It was data-wb="card" originally; the data-wb migration dropped the
         attribute and left this article indistinguishable from #plain. -->
    <article id="explicit" x-card>
        <header>
            <h3>Explicit Card</h3>
        </header>
        <p>I have the behavior.</p>
    </article>
</body>

</html>
