<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧩 Multi-Behavior Demo</title>
  <link rel="stylesheet" href="../src/styles/themes.css?v=3.0.91">
  <link rel="stylesheet" href="../src/styles/site.css?v=3.0.91">
  <style>
    body {
      padding: 2rem;
      background: var(--bg-color);
      color: var(--text-primary);
      font-family: system-ui, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.5rem;
    }
    h1 { margin: 0; border: none; padding: 0; }
    h2 {
      margin: 3rem 0 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
    }
    .demo-section {
      background: var(--bg-secondary);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }
  </style>

</head>

<body>
  <header>
    <h1>🧩 Multi-Behavior Demo</h1>
    <div x-themecontrol></div>
  </header>
  <p>Composed from multiple sources using $extends, $generate, $ref, and $include</p>

  <!-- 1. Badges — From Matrix -->
  <h2>Badges — From Matrix</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <span x-badge label="New">
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="Done" variant="success">
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="Warning" variant="warning">
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="Error" variant="error">
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="5" variant="primary" pill>
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="Badge" variant="success" dot>
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="Tag" variant="info" removable>
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="Outline" variant="primary" outline>
      </span>
    </div>
  </div>

  <!-- 2. Notifications — Matrix Combos -->
  <h2>Notifications — Matrix Combos</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <div x-cardnotification message="Info message">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardnotification message="Done!" variant="success" title="Success">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardnotification message="Warning!" variant="warning">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardnotification message="Error!" variant="error">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardnotification message="Info" variant="info" title="Notice" icon="🔔">
      </div>
    </div>
  </div>

  <!-- 3. Progress — All Enum Variants -->
  <h2>Progress — All Enum Variants</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <progress variant="default" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress variant="primary" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress variant="success" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress variant="warning" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress variant="error" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress variant="info" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress size="xs" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress size="sm" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress size="md" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress size="lg" value="60">
      </progress>
    </div>
    <div x-demo columns="1">
      <progress size="xl" value="60">
      </progress>
    </div>
  </div>

  <!-- 4. availability variants -->
  <h2>availability variants</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <div x-cardportfolio availability="available" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio availability="busy" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio availability="not-available" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio availability="open-to-opportunities" name="Sample name">
      </div>
    </div>
  </div>

  <!-- 5. Variants -->
  <h2>Variants</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <div x-cardportfolio variant="default" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio variant="compact" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio variant="horizontal" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio variant="full" name="Sample name">
      </div>
    </div>
  </div>

  <!-- 6. size variants -->
  <h2>size variants</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <div x-cardportfolio size="sm" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio size="md" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio size="lg" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio size="xl" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio size="full" name="Sample name">
      </div>
    </div>
    <div x-demo columns="1">
      <div x-cardportfolio size="auto" name="Sample name">
      </div>
    </div>
  </div>

  <!-- 7. cardportfolio — Defaults -->
  <h2>cardportfolio — Defaults</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <div x-cardportfolio name="Sample name" availability="available" variant="default" size="auto">
      </div>
    </div>
  </div>

  <!-- 8. Custom Hand-Authored Section -->
  <h2>Custom Hand-Authored Section</h2>
  <div class="demo-section">
    <div x-demo columns="1">
      <span x-badge label="Hand-crafted" variant="primary" pill>
      </span>
    </div>
    <div x-demo columns="1">
      <span x-badge label="Also custom" variant="success" size="lg">
      </span>
    </div>
  </div>

  <!-- Load wb-starter -->
  <script type="module">
    import WB from '../src/core/wb-lazy.js';
    window.WB = WB;
    await WB.init({ autoInject: true });
    console.log('🧩 Multi-Behavior Demo initialized');
  </script>
</body>

</html>
