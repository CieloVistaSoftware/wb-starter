<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IntelliSense Check</title>
    <link rel="stylesheet" href="../src/styles/themes.css?v=3.0.91" />
    <link rel="stylesheet" href="../src/styles/site.css?v=3.0.91" />
    <script type="module" src="../src/index.js?v=3.0.91"></script>

      import WB from "../src/core/wb-lazy.js";
      WB.init();

  <body>
    <h1>IntelliSense Check</h1>
    <p>Use this file to test the VS Code autocomplete.</p>

    <!-- 
        TRY IT HERE:
        1. Type "<wb-" below to see the list of components.
        2. Select "x-container".
        3. Inside the tag, type a space to see attributes like "size".
    -->
    <div x-tabs x->
      <div title="Tab 1">
        <p>This is the content of Tab 1.</p>
      </div>
      <div title="Tab 2">
        <p>This is the content of Tab 2.</p>
      </div>
    </div>
    <div x-container size="large" color="secondary">
      <p>This is a container inside the grid.</p>
    </div>
  </body>
