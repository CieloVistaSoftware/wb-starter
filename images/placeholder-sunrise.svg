<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="sunrise placeholder">
  <!-- Local placeholder "sunrise" (#946). Replaces a remote picsum.photos fetch.
       The art carries a SUBJECT: a card titled "Mountain Vista" should not show
       water. Cards are matched to art by their own title, not by a hash.
       Composed in the lower band so a short cover crop keeps the subject, and
       kept muted so it sits behind the text rather than competing with it.
       Colours are baked in because an img src renders in its own document and
       cannot read the page theme tokens. -->
  <defs>
    <linearGradient id="w-sunrise" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#5a4a38"/><stop offset="100%" stop-color="#2f2720"/>
    </linearGradient>
    <pattern id="h-sunrise" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#d8bd93" stroke-width="1" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#w-sunrise)"/>
  <rect width="800" height="500" fill="url(#h-sunrise)"/>
  <circle cx="400" cy="330" r="90" fill="#d8bd93" opacity="0.45"/><path d="M0 400 h800 M0 440 h800 M0 480 h800" stroke="#d8bd93" stroke-width="14" opacity="0.35"/>
</svg>
