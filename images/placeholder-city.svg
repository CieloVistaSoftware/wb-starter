<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="city placeholder">
  <!-- Local placeholder "city" (#946). Replaces a remote picsum.photos fetch.
       The art carries a SUBJECT: a card titled "Mountain Vista" should not show
       water. Cards are matched to art by their own title, not by a hash.
       Composed in the lower band so a short cover crop keeps the subject, and
       kept muted so it sits behind the text rather than competing with it.
       Colours are baked in because an img src renders in its own document and
       cannot read the page theme tokens. -->
  <defs>
    <linearGradient id="w-city" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3d4460"/><stop offset="100%" stop-color="#232739"/>
    </linearGradient>
    <pattern id="h-city" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#96a0c4" stroke-width="1" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#w-city)"/>
  <rect width="800" height="500" fill="url(#h-city)"/>
  <path d="M0 500 V330 h60 V270 h50 V330 h70 V230 h70 V330 h60 V290 h60 V330 h70 V200 h80 V330 h60 V270 h60 V330 h60 V300 h100 V500 Z" fill="#96a0c4" opacity="0.6"/><circle cx="670" cy="120" r="34" fill="#96a0c4" opacity="0.3"/>
</svg>
