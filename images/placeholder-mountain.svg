<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="mountain placeholder">
  <!-- Local placeholder "mountain" (#946). Replaces a remote picsum.photos fetch.
       The art carries a SUBJECT: a card titled "Mountain Vista" should not show
       water. Cards are matched to art by their own title, not by a hash.
       Composed in the lower band so a short cover crop keeps the subject, and
       kept muted so it sits behind the text rather than competing with it.
       Colours are baked in because an img src renders in its own document and
       cannot read the page theme tokens. -->
  <defs>
    <linearGradient id="w-mountain" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3b4657"/><stop offset="100%" stop-color="#222a36"/>
    </linearGradient>
    <pattern id="h-mountain" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#8fa0ba" stroke-width="1" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#w-mountain)"/>
  <rect width="800" height="500" fill="url(#h-mountain)"/>
  <path d="M0 500 L150 300 L250 380 L400 210 L560 380 L660 310 L800 500 Z" fill="#8fa0ba" opacity="0.55"/><path d="M400 210 L340 275 L400 300 L460 275 Z" fill="#8fa0ba" opacity="0.75"/><circle cx="640" cy="130" r="40" fill="#8fa0ba" opacity="0.35"/>
</svg>
