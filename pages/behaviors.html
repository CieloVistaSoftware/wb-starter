<script>
  /* A page fragment opened on its own resolves its CSS and modules relative to
     /pages/ instead of the site root, so it renders unstyled and never
     finishes loading. These files are fetched and injected by index.html;
     opened directly they are simply the wrong URL. Redirect to the route that
     works. server.js wraps them automatically, so this only fires on a static
     host. */
  (function () {
    var m = location.pathname.match(/\/pages\/([a-z0-9-]+)\.html$/i);
    if (!m) return;                       // injected by the SPA: nothing to do
    var root = location.pathname.slice(0, m.index + 1);
    location.replace(root + '?page=' + m[1] + location.search.replace(/^\?/, '&') + location.hash);
  })();
</script>

  // finding all of our behaviors. e.g. x-tooltiop, x-this, x-that etc.
  // typing in just x- will show all of them". Matches each <div x-demo>'s own

  // connectedCallback -- see x-demo.js -- available immediately, no need
  // to wait for lazy behaviors to finish applying) against the query, then
  // hides the h3/section around any group with nothing left visible so the
  // filtered page never shows an orphaned empty heading.
  (function () {
    const input = document.getElementById('behaviors-search');
    const countEl = document.getElementById('behaviors-search-count');
    const resultsEl = document.getElementById('behaviors-search-results');
    if (!input || !countEl || !resultsEl) return;

    const demos = Array.from(document.querySelectorAll('x-demo'));
    const total = demos.length;

    // John: "prefill this dropdown box with all known x- attributes" --
    // browsing before typing anything needs the CANONICAL list (every
    // registered behavior, "x-" + name), not just whatever happens to
    // appear in this page's own demo markup -- a behavior with zero demos
    // on THIS page would otherwise never show up at all. Sourced from
    // tag-map.js's elementMap (the same single source of truth the #631
    // audit/registration work this session already established), via
    // dynamic import() so this stays a classic <script> (matches every
    // other inline script on this page) instead of needing type="module".
    // siteRoot() mirrors demo.js's own helper -- this page can be loaded
    // both through the SPA (root '/') and under a GitHub Pages sub-path
    // ('/wb-starter/'), and a bare leading '/' import would 404 on the
    // latter.
    function siteRoot() {
      const stripped = location.pathname.replace(/(?:public|demos|pages|articles|tests\/fixtures)\/.*$/, '');
      return stripped.replace(/[^/]*$/, '');
    }
    let allEntries = [];
    let extensionMap = {};
    let nativeMap = {};
    const schemaByName = new Map();
    let exampleCatalogue = {};

    // #666: one row per VARIANT, not one per behavior -- John: "add one entry
    // for each variant too... show the behavior name and all possible variants
    // (one per row so user can see them all)". A behavior with no declared
    // variant enum still gets exactly one row, with an empty variant cell.
    // #666 — John: "isn't the language type a variant" / "so shouldn't we
    // include those?". Yes. `variant` is not the only axis a control varies on:
    // size, position, icon, aspect, inputType and others are declared the same
    // way, and a reader wanting to see every option needs all of them. Every
    // enum-valued property now produces rows, SUMMED per axis (not a cartesian
    // product -- that would explode 143 entries into thousands).
    //   variant-only: 272 rows.  all enum properties: 484.
    function variantsFor(attr) {
      const sc = schemaByName.get(extensionMap[attr]);
      const props = (sc && sc.properties) || {};
      const out = [];
      for (const [name, def] of Object.entries(props)) {
        if (!def) continue;
        if (Array.isArray(def.enum) && def.enum.length) {
          for (const value of def.enum) out.push({ prop: name, value });
        } else if (def.type === 'boolean') {
          // #666 — John: "<audio showplaybutton> no different than when not
          // used". Correct: showDisplay and showPlayButton both DEFAULT to
          // true, so setting them true is a guaranteed no-op. Demonstrate the
          // value that actually differs from the default -- for a default-true
          // flag that means emitting flag="false".
          // John asked for showDisplay specifically to demo as "true" -- seeing
          // the display present is the useful demonstration there, whereas for
          // showPlayButton seeing it ABSENT is what shows the flag working.
          // Explicit override beats a blanket rule for either.
          const DEMO_AS_TRUE = new Set(['showDisplay']);
          const demoValue = (def.default === true && !DEMO_AS_TRUE.has(name)) ? 'false' : 'true';
          out.push({ prop: name, value: demoValue, boolean: true, defaultsTo: def.default === true });
          continue;
        }
      }
      // Sorted so `variant` leads -- it is the axis most readers look for --
      // and the rest follow alphabetically rather than in schema-key order.
      out.sort((a, b) =>
        (a.prop === 'variant' ? -1 : b.prop === 'variant' ? 1 : a.prop.localeCompare(b.prop)) ||

    /** How an option reads in the variant column: bare for variant, prop=value otherwise. */

      // has to say so -- a bare `showPlayButton` would imply the opposite.
      if (opt.boolean) return opt.value === 'false' ? `${opt.prop}=false` : opt.prop;

    import(siteRoot() + 'src/core/tag-map.js')
      .then(async (mod) => {
        // #665: extensionMap, NOT elementMap. elementMap maps wb-* BEHAVIOR

        // prefixing its values with "x-" produced a list of behaviors wearing
        // behavior names -- x-card, x-button, x-cardbutton -- on a page titled
        // "WB Behaviors Showcase", while the ~105 real behaviors never
        // appeared at all. extensionMap is the actual x-* behavior registry:
        // "Extensions are effects, utilities, and morphing behaviors".

        // they are used directly rather than rebuilt from the values -- several
        // attributes share one behavior function, and mapping through the
        // values would silently collapse them.

        // extensionMap and wb-lazy's WB_LAZY_ONLY_ATTRIBUTES. 34 attributes

            // `dialog` reads as `dialog` -- correct when the example IS a bare

            // bare <dialog> is invisible until something opens it, so its
            // example is `<button x-dialog>`. The row then claimed `dialog`
            // while the code beside it said `x-dialog` -- the list and the
            // source disagreeing about what the reader should type.

            // So label by what the example ACTUALLY writes. The host label is
            // kept only when the example uses that host; otherwise the row
            // says the attribute, because that is what the reader would copy.
            // #764: one row PER AUTHORING FORM, not per behavior. A single row
            // labelled by its host made "Both" and "Semantic" render the same
            // list, so the filter could not show what it claimed to filter.
            //
            // A behavior with a native host offers two genuinely different
            // things to write, and each gets its own row:

            //   attribute  <div x-progress value="72">  — any host carries it

          .then((r) => (r.ok ? r.json() : null))

    // that search but there is no content. I want an element that has 69
    // rows of information for the end user." -- the count was always
    // correct and scrollIntoView (the earlier #634 follow-up fix) does

    // no scrolling required to see it exists.

      return Array.from(seen);

    // attribute name, e.g. "x-ripple" under "Ripple Effect".

      if (form === 'both') return true;
      return entry.form === form;

          // the underlying x-* attribute (still searchable even when the row is
          // labelled by its semantic element), and the option.

          btn.className = 'behaviors-search-results__row';

          btn.dataset.label = entry.label;
          btn.dataset.form = entry.form || 'attribute';
          if (entry.native) btn.dataset.native = '1';
          if (variant) {
            btn.dataset.variant = variant;
            btn.dataset.prop = opt.prop;
            if (opt.boolean) btn.dataset.boolean = '1';
          }

          // John: "change the variant to be in col. two" -- name first, variant
          // second, matching the panel header (behavior · variant). The variant
          // cell is rendered even when empty so the two columns stay aligned
          // down the list.
          const t = document.createElement('span');
          t.className = 'behaviors-search-results__token';
          t.textContent = entry.label;
          // #699: the token never wraps, so a long one (input[type="checkbox"])
          // truncates with an ellipsis. Keep the full value reachable.
          t.title = entry.label;
          const v = document.createElement('span');
          v.className = 'behaviors-search-results__variant';
          v.textContent = shownOption;
          btn.append(t, v);
          li.appendChild(btn);
          frag.appendChild(li);
        });
      });
      if (!q) totalRowCount = rendered;
      resultsEl.appendChild(frag);
    }

    // Which hit does the reader actually mean? Typing "button" matched
    // `audio · showPlayButton` first -- "showPlayButton" contains "button", and
    // audio sorts earlier. A match on the BEHAVIOR NAME beats a match buried in
    // an option name, and an exact name beats a prefix.
    function bestMatch(rows, q) {
      const score = (row) => {
        const label = (row.dataset.label || '').toLowerCase();
        const attr = (row.dataset.browseToken || '').toLowerCase();
        if (label === q || attr === q) return 0;
        if (label.startsWith(q) || attr.startsWith(q)) return 1;
        if (label.includes(q) || attr.includes(q)) return 2;
        return 3;                       // matched only on the option name
      };
      let best = rows[0];
      let bestScore = score(rows[0]);
      for (const row of rows) {
        const sc = score(row);
        if (sc < bestScore) { best = row; bestScore = sc; }
        if (bestScore === 0) break;
      }
      return best;
    }

    function applyFilter(rawQuery) {
      // #666: filters the SELECTOR, not on-page demos. The per-category demo
      // sections are gone -- their examples live in data/behavior-examples.json
      // and render in the panel -- so there is nothing left to show/hide in the
      // document, and the search now narrows the one list that reaches
      // everything.
      const q = rawQuery.trim().toLowerCase();
      renderBrowseAll(q);

      const rows = resultsEl.querySelectorAll('.behaviors-search-results__row');
      const shown = rows.length;
      countEl.textContent = q === ''
        ? `${allEntries.length} behaviors`
        : `Showing ${shown} of ${totalRowCount}`;

      // #666 — John: "why does search not fill the first thing it finds with
      // the search item e.g. button". Typing narrowed the list but rendered
      // nothing, so a search told you a match EXISTS without showing it. Select
      // the first hit as you type.
      //
      // focus:false is essential -- selectRow() focuses the row so arrow keys
      // work after a click, but stealing focus mid-keystroke would eject the
      // reader from the input they are still typing into.
      if (q !== '' && shown) selectRow(bestMatch(rows, q), { focus: false });
    }

    // ─── #664: live preview ────────────────────────────────────────────
    // John: "Make [the list] do the same thing playground does, inject code and
    // immediately show the run time of each. put the demo window right next to
    // this dropdown." Clicking a behavior injects its markup into the panel
    // beside the list and upgrades it in place -- no scrolling a 13,000px page
    // to find the example.
    const liveEl = document.getElementById('behaviors-live');
    // #686 -- must stay in sync with the `@media (max-width: 60rem)` rule in
    // src/styles/pages/behaviors.css that collapses .behaviors-browse to one
    // column. Below that width the panel stacks BELOW the results list rather
    // than beside it, which is the only case where revealing it is correct.
    const STACKED = matchMedia('(max-width: 60rem)');
    const liveToken = document.getElementById('behaviors-live-token');
    const liveNote = document.getElementById('behaviors-live-note');
    const liveStage = document.getElementById('behaviors-live-stage');
    const liveExample = document.getElementById('behaviors-live-example');
    const liveCode = document.getElementById('behaviors-live-code');
    const liveDoc = document.getElementById('behaviors-live-doc');
    const liveApi = document.getElementById('behaviors-live-api');
    let liveApiBody = document.getElementById('behaviors-live-api-body');

    /**
     * #774 -- John: "Should be toggles, show/hide only one at a time."
     *
     * Both panels open at once pushed the running example far down the panel,
     * which is the problem that moved them into the header in the first place.
     * Opening one now closes the other.
     *
     * Driven by the 'toggle' event rather than by a click handler, so it holds
     * however the panel was opened -- keyboard, find-in-page revealing a closed
     * <details>, or code setting .open directly.
     *
     * The guard matters: closing the sibling fires ITS toggle event, which
     * would re-enter this handler. Without `panel.open` gating the work, the
     * two would ping-pong.
     */
    function exclusivePanels(panels) {
      /**
       * John: "When clicking api or docs, this panel should fill to the bottom."
       *
       * The open body is absolutely positioned against #behaviors-live so it
       * can escape the header strip it is anchored in. Its `top` has to clear
       * the real header -- a constant breaks the moment the control row wraps
       * to two lines, which it does on a narrow panel -- so publish the header's
       * measured height and let CSS position against that.
       */
      const publishHeadHeight = () => {
        const panelEl = document.getElementById('behaviors-live');
        const head = panelEl && panelEl.querySelector('.behaviors-live__head');
        if (!panelEl || !head) return;
        // The open body is absolute at top:100% of the HEADER, so the space
        // left for it is the panel minus that header. Measured, not assumed:
        // the control row wraps to two lines on a narrow panel.
        const avail = Math.max(0, Math.round(panelEl.getBoundingClientRect().height - head.getBoundingClientRect().height));
        panelEl.style.setProperty('--x-live-body-h', avail + 'px');
      };

      panels.forEach((panel) => {
        if (!panel) return;
        panel.addEventListener('toggle', () => {
          if (!panel.open) return;
          panels.forEach((other) => { if (other && other !== panel) other.open = false; });
          // Measure AFTER the exclusive close, so a closing sibling is not
          // still contributing its own height to the row.
          requestAnimationFrame(publishHeadHeight);
        });
      });

      // The row wraps at narrow widths, which changes the header height with
      // no toggle involved.
      window.addEventListener('resize', publishHeadHeight);
    }
    exclusivePanels([liveApi, liveDoc]);

    // #762 -- John: "Allow the document element to be dragged all the way to
    // the top."
    //
    // The doc sits last, below the example, its source, the events log and the
    // handler snippet. Reading the docs while looking at the example means
    // scrolling past all of it, every time. Let the reader put it where they
    // want it -- including first.
    //
    // The <summary> is the handle, not the whole <details>: making the entire
    // panel draggable swallows text selection inside the docs, which is most
    // of what the panel is for. draggable is switched on only while the
    // pointer is down on the summary, and off again immediately after.
    (function enableDocReorder() {
      if (!liveDoc || !liveEl) return;
      const handle = liveDoc.querySelector('.behaviors-live__doc-summary');
      if (!handle) return;

      handle.style.cursor = 'grab';
      handle.title = 'Drag to reorder — drop above any section';

      handle.addEventListener('mousedown', () => { liveDoc.draggable = true; });
      document.addEventListener('mouseup', () => { liveDoc.draggable = false; });

      liveDoc.addEventListener('dragstart', (e) => {
        liveDoc.classList.add('is-dragging');
        // Firefox refuses to start a drag without payload.
        try { e.dataTransfer.setData('text/plain', 'behaviors-live-doc'); } catch { /* not required */ }
        e.dataTransfer.effectAllowed = 'move';
      });

      liveDoc.addEventListener('dragend', () => {
        liveDoc.classList.remove('is-dragging');
        liveDoc.draggable = false;
      });

      liveEl.addEventListener('dragover', (e) => {
        if (!liveDoc.draggable) return;
        e.preventDefault();               // without this, drop never fires
        e.dataTransfer.dropEffect = 'move';
      });

      liveEl.addEventListener('drop', (e) => {
        if (!liveDoc.draggable) return;
        e.preventDefault();
        // Insert before the first sibling whose midpoint is below the pointer;
        // dropping past everything puts it last. The header stays put -- it
        // names what is being shown, so it is not part of the ordering.
        const head = liveEl.querySelector('.behaviors-live__head');
        const siblings = [...liveEl.children]
          .filter((c) => c !== liveDoc && c !== head);
        const target = siblings.find((c) => {
          const r = c.getBoundingClientRect();
          return e.clientY < r.top + r.height / 2;
        });
        if (target) liveEl.insertBefore(liveDoc, target);
        else liveEl.appendChild(liveDoc);
      });
    })();
    let liveDocBody = document.getElementById('behaviors-live-doc-body');

    // #703 -- John: "Make sure when dropped down the height is right." An
    // example that opens a floating layer (dropdown menu, tooltip, popover)
    // positions it ABSOLUTELY, so it adds nothing to the stage's layout height:
    // measured at 375x812 the open x-dropdown menu ran to 549px while the stage
    // ended at 321px and the code panel started there, so the menu rendered
    // straight over the code. Standard 15: an overlay must not overflow its
    // parent. Grow the stage to whatever the example actually put on screen.
    const STAGE_MIN_PX = 96;   // 6rem, matching .behaviors-live__stage in behaviors.css
    let fitQueued = false;
    function fitStageToOverlays() {
      if (fitQueued) return;
      fitQueued = true;
      requestAnimationFrame(() => {
        fitQueued = false;
        const stageTop = liveStage.getBoundingClientRect().top;
        let deepest = 0;
        for (const el of liveStage.querySelectorAll('*')) {
          const r = el.getBoundingClientRect();
          if (r.width === 0 && r.height === 0) continue;   // display:none, not open
          deepest = Math.max(deepest, r.bottom - stageTop);
        }
        const padding = parseFloat(getComputedStyle(liveStage).paddingBottom) || 0;
        const wanted = Math.max(STAGE_MIN_PX, Math.ceil(deepest + padding));
        // #760 -- John, on a collapsed <details>: "Why blank space?"
        //
        // This used to only ever GROW. Opening the details grew the stage to
        // fit it; collapsing it left the height behind, so the example sat in
        // a screen of nothing it no longer needed.
        //
        // The no-shrink rule was right for the case it was written for -- a
        // dropdown or popover opens on hover, and pulling the floor up while
        // the pointer is over it makes the panel jump. But that only applies
        // to OVERLAYS. Content that collapses in place should give the space
        // back; that is what collapsing means.
        //
        // So: if anything in the stage is taken out of flow, keep the grown
        // box (the overlay needs somewhere to live). Otherwise track the
        // content, up or down.
        const hasOverlay = [...liveStage.querySelectorAll('*')].some((el) => {
          const pos = getComputedStyle(el).position;
          return pos === 'absolute' || pos === 'fixed';
        });
        const current = parseFloat(liveStage.style.minHeight) || 0;
        if (wanted > current) liveStage.style.minHeight = wanted + 'px';
        else if (!hasOverlay && wanted < current) liveStage.style.minHeight = wanted + 'px';
      });
    }

    // A menu opens on click and, for trigger="hover", on pointer entry.
    liveStage.addEventListener('click', fitStageToOverlays);
    liveStage.addEventListener('mouseover', fitStageToOverlays);
    liveStage.addEventListener('focusin', fitStageToOverlays);

    // #710 -- John: "Make the height of the left element same as right element."
    // CSS alone cannot express it: with align-items:stretch the LIST's own 585
    // rows also feed the row's intrinsic height, so lifting its max-height grew
    // both columns to 32,787px (measured) -- the 13,000px page #664 removed.
    // So the panel is measured and the list is capped to it; the list keeps
    // scrolling inside itself. Stacked, the cap is dropped and behaviors.css's
    // fixed max-height applies again -- there is no second column to match.
    const TWO_COL = matchMedia('(min-width: 60.0625rem)');
    let syncQueued = false;
    function syncListHeight() {
      // Write on the next frame, never inside the observer callback: mutating
      // layout during delivery is what produces "ResizeObserver loop completed
      // with undelivered notifications".
      if (syncQueued) return;
      syncQueued = true;
      requestAnimationFrame(() => {
        syncQueued = false;
        if (!TWO_COL.matches) {
          if (resultsEl.style.maxHeight) resultsEl.style.maxHeight = '';
          return;
        }
        const h = liveEl.getBoundingClientRect().height;
        // Panel hidden (nothing picked yet) -> fall back to the stylesheet.
        const next = h > 0 ? Math.round(h) + 'px' : '';
        // Only write on a real change -- an unconditional write re-triggers the
        // observer every frame for no reason.
        if (resultsEl.style.maxHeight !== next) resultsEl.style.maxHeight = next;
        keepSelectionVisible();
      });
    }
    // #717 -- John: "When using the down or up button the current selection must
    // be the first one." selectRow() sets scrollTop = rowTop and the browser
    // clamps at scrollHeight - clientHeight, so for the LAST screenful of rows
    // there is nothing below them to scroll into view: measured, row 48 of 49
    // sat 1134px down instead of 0, drifting further the closer to the end.
    // Trailing space equal to (viewport - last row) puts every row within reach
    // of the top. Only while the list actually scrolls -- a short list gains
    // nothing from it and would just grow a scrollbar.
    // #728 -- every arrow press renders a different example, which resizes the
    // panel, which resizes the list (#710) -- AFTER selectRow() has already
    // scrolled. Measured: End selected the last row and then the resize left it
    // out of view. This re-asserts VISIBILITY only, by the same minimum-scroll
    // rule; it does not pin the row anywhere, which is what John asked to be
    // rid of.
    // Keyboard only. #664's contract is that a CLICK leaves the list exactly
    // where the reader put it -- re-asserting visibility after a click broke
    // that, because the panel resize that follows every render would drag the
    // list to a row the reader had deliberately scrolled away from.
    let selectedByKeyboard = false;

    function keepSelectionVisible() {
      if (!selectedByKeyboard) return;
      const cur = resultsEl.querySelector('[aria-current="true"]');
      if (!cur) return;
      const top = cur.offsetTop - resultsEl.offsetTop;
      const bottom = top + cur.offsetHeight;
      if (top < resultsEl.scrollTop) resultsEl.scrollTop = top;
      else if (bottom > resultsEl.scrollTop + resultsEl.clientHeight) {
        resultsEl.scrollTop = bottom - resultsEl.clientHeight;
      }
    }

    // The panel's height drives the list's; the list never drives the panel's,
    // so this cannot feed back on itself.
    new ResizeObserver(syncListHeight).observe(liveEl);
    TWO_COL.addEventListener('change', syncListHeight);

    // Cache: the same doc is re-requested every time a reader arrows back over
    // a behavior, and a 404 is worth remembering too (49 docs, 143 entries --
    // most misses are permanent).
    const docCache = new Map();

    /**
     * #679 -- render a behavior's attributes: type, allowed values, default.
     *
     * The data was already here. The page loads data/schema-index.json to build
     * its variant rows, so every property, enum and default was in memory and
     * simply never shown: a reader could see THAT variant=primary exists,
     * because it is a row in the list, but not that variant is a string with a
     * fixed set of values, or that pageSize is a number defaulting to 10.
     *
     * Not async and not fetched -- schemaByName is populated at load.
     */
    /**
     * #679 -- John: "each attribute should be shown to help users."
     *
     * The doc pages carry a Usage block, but most show the bare element
     * (`<article> ... </article>`) with none of its attributes -- and only 27
     * of 143 behaviors have a doc page at all. A reader could see a table of
     * attributes and still have nothing to copy.
     *
     * This builds the snippet from the schema instead, so it exists for every
     * behavior and cannot drift from the attribute list directly above it.
     *
     * Values are REPRESENTATIVE, not invented: the declared default where
     * there is one, otherwise the first allowed enum value, otherwise a
     * type-named placeholder. Nothing here implies a value the schema does
     * not actually permit.
     */
    function buildUsageSnippet(behavior, props) {
      const names = Object.keys(props);

      // Prefer the semantic host: <article> auto-injects card, so that is what
      // a reader should copy. Only fall back to the x- attribute form when no
      // tag carries the behavior on its own.
      let host = null;
      for (const [selector, beh] of Object.entries(nativeMap || {})) {
        if (beh === behavior && !selector.includes('[')) { host = selector; break; }
      }
      const tag = host || 'div';
      const marker = host ? '' : ' x-' + behavior;

      const attrs = names.map((n) => {
        const d = props[n] || {};
        // Booleans FIRST. A boolean with `default: false` was being caught by
        // the default branch below and printed as elevated="false" — which in
        // HTML is TRUE, because a boolean attribute is true by its presence.
        // The snippet was teaching the exact opposite of what it said.
        //
        // Shown bare, which is the form a reader would actually copy; the
        // table underneath states the default.
        let value;
        if (d.type === 'boolean') value = null;
        else if (d.default !== undefined && d.default !== '') value = d.default;
        else if (Array.isArray(d.enum) && d.enum.length) value = d.enum[0];
        else if (d.type === 'number') value = '0';
        else value = d.type || 'value';
        // A boolean attribute is written bare; `muted="true"` is not how HTML
        // booleans work and would teach the wrong thing.
        return value === null ? '  ' + n : '  ' + n + '="' + value + '"';
      });

      const open = attrs.length
        ? '<' + tag + marker + '\n' + attrs.join('\n') + '>'
        : '<' + tag + marker + '>';
      return open + '\n  ...' + '\n</' + tag + '>';
    }

    function showApi(behavior) {
      liveApi.hidden = false;
      const summary = liveApi.querySelector('.behaviors-live__api-summary');
      if (summary) {
        summary.textContent =
          'API';
      }

      const sc = schemaByName.get(behavior);
      const props = (sc && sc.properties) || {};
      const names = Object.keys(props);

      if (!names.length) {
        // Same reasoning as the doc panel (#673): say the thing is absent
        // rather than vanishing, so "no schema" cannot be mistaken for
        // "the panel is broken".
        liveApiBody.className = 'behaviors-live__api-body behaviors-live__api-body--empty';
        liveApiBody.textContent = 'No schema for ' + behavior + ' yet.';
        return;
      }

      liveApiBody.className = 'behaviors-live__api-body';

      const esc = (v) => String(v).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));

      const rows = names.map((name) => {
        const d = props[name] || {};
        // An enum IS the allowed-values list; without one, the type is all we
        // can honestly say. Long enums are shown in full rather than truncated
        // -- a cut-off list of allowed values is worse than none, because the
        // reader cannot tell it is cut off.
        const values = Array.isArray(d.enum) && d.enum.length
          ? d.enum.map((v) => '<code>' + esc(v) + '</code>').join(' ')
          : '<span class="behaviors-live__api-any">any ' + esc(d.type || 'value') + '</span>';
        // Distinguish "defaults to empty string" from "has no default": both
        // would otherwise render as an empty cell and mean different things.
        const dflt = d.default === undefined
          ? '<span class="behaviors-live__api-none">—</span>'
          : '<code>' + esc(d.default === '' ? '""' : d.default) + '</code>';
        const req = d.required ? ' <span class="behaviors-live__api-req">required</span>' : '';
        return '<tr id="behaviors-api-row-' + esc(name) + '">' +
          '<td class="behaviors-live__api-name"><code>' + esc(name) + '</code>' + req + '</td>' +
          '<td class="behaviors-live__api-type">' + esc(d.type || '') + '</td>' +
          '<td class="behaviors-live__api-values">' + values + '</td>' +
          '<td class="behaviors-live__api-default">' + dflt + '</td>' +
          '<td class="behaviors-live__api-desc">' + esc(d.description || '') + '</td>' +
        '</tr>';
      }).join('');

      const usage = buildUsageSnippet(behavior, props);

      liveApiBody.innerHTML =
        '<pre class="behaviors-live__api-usage"><code>' + esc(usage) + '</code></pre>' +
        '<div class="behaviors-live__api-scroll">' +
        '<table id="behaviors-live-api-table" class="behaviors-live__api-table">' +
        '<thead><tr>' +
          '<th scope="col">Attribute</th><th scope="col">Type</th>' +
          '<th scope="col">Values</th><th scope="col">Default</th>' +
          '<th scope="col">Description</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="behaviors-live__api-note">' + names.length +
        ' attribute' + (names.length === 1 ? '' : 's') +
        ' · from <code>src/wb-models/' + esc(behavior) + '.schema.json</code></p>';
    }

    async function showDoc(behavior) {
      liveDoc.hidden = true;
      if (!behavior) return;

      // A FRESH host element per behavior. WB.inject() will not re-apply a
      // behavior to an element that already carries it, so reusing one div
      // rendered the first doc and then left every subsequent one as raw
      // markdown text (confirmed: x-accordion rendered, x-chip and x-ripple
      // did not). Replacing the node sidesteps that entirely.
      const fresh = document.createElement('div');
      fresh.id = 'behaviors-live-doc-body';
      fresh.className = 'behaviors-live__doc-body';
      liveDocBody.replaceWith(fresh);
      liveDocBody = fresh;

      let md = docCache.get(behavior);
      if (md === undefined) {
        try {
          const res = await fetch(`${siteRoot()}docs/behaviors/${behavior}.md`);
          md = res.ok ? await res.text() : null;
        } catch (err) {
          md = null;
        }
        docCache.set(behavior, md);
      }
      liveDoc.hidden = false;
      // #774: the qualified label ("Button Documentation") was right when
      // this panel sat alone at the BOTTOM of the column, far from anything
      // naming the behavior. It now sits in the header, immediately beside
      // the token that already says `x-accordion` -- so the long form only
      // repeated it, and at that width the control row overflowed and wrapped
      // Fullscreen onto a second line. Short label, same information.
      // #746 -- John: "Don't just say Documentation say Button Documentation."
      // The panel sits under a rendered example that changes with the
      // selection; an unqualified "Documentation" gives the reader nothing to
      // tie it to. There is one <summary> reused across every behavior, so it
      // is set here rather than in the static markup.
      const docSummary = liveDoc.querySelector('.behaviors-live__doc-summary');
      if (docSummary) {
        docSummary.textContent =
          'Docs';
      }
      if (!md) {
        // #673 -- John, on `article`: "Where is the docs element below this?"
        // This used to `return` while the panel was still hidden, so for the
        // 116 of 143 behaviors with no .md the whole panel silently vanished --
        // indistinguishable from the feature being broken. Say so instead,
        // matching how the Events panel states its own empty case.
        liveDocBody.className = 'behaviors-live__doc-body behaviors-live__doc-body--empty';
        liveDocBody.textContent = 'No doc yet for ' + behavior + '.';
        return;
      }

      // Open by default: John asked for an element that SHOWS the doc, and a
      // collapsed 40px strip below the fold reads as "there is no doc". Still a
      // <details> so it can be folded away once read.
      // textContent, not innerHTML: mdhtml.js decodes-then-parses and expects
      // the browser to have HTML-escaped the raw markdown first. Assigning raw
      // markdown via innerHTML double-escapes it (the pattern pages/issues.html
      // documents for the same reason).
      liveDocBody.textContent = md;
      try {
        const mod = await import(siteRoot() + 'src/core/wb-lazy.js');
        const WB = mod.default || mod.WB || window.WB;
        // autoLiveRender:false -- a doc that ILLUSTRATES a <wb-*> example must
        // not have that example promoted into a live, fetching element inside
        // this panel; the running example above is the live one.
        if (WB && WB.inject) await WB.inject(liveDocBody, 'mdhtml', { autoLiveRender: false });
      } catch (err) {
        console.warn('[behaviors] could not render doc for ' + behavior, err);
      }
    }

    // The markup for most behaviors is already on this page, inside the
    // <div x-demo> blocks. Prefer a demo whose source ACTUALLY uses the token as
    // an attribute/tag rather than merely mentioning it in prose, so clicking
    // "x-card" does not land on a demo that happens to say "x-card" in a
    // sentence.
    function sourceFor(token, form) {
      // Catalogue first (data/behavior-examples.json), DOM second. The DOM path
      // is kept so the panel still works on a page that has its own demos --
      // and so removing the sections from this one changes nothing here.
      const fromCatalogue = exampleCatalogue[token];
      if (fromCatalogue && fromCatalogue.source) {
        // #764: a semantic row must render the semantic example and an
        // attribute row the x- one. `source` leads with the semantic form
        // where a native host exists, and the x- counterpart lives in
        // alternates -- so an attribute row picks the alternate that actually
        // carries x-{behavior}. Falling back to source keeps behaviors with
        // only one form working unchanged.
        if (form === 'attribute') {
          const bare = token.replace(/^x-/, '');

          if (!out || !e.lengthComputable) return;

        });
        xhr.addEventListener('load', () => {
          if (!out) return;
          if (xhr.status < 200 || xhr.status >= 300) {
            out.textContent = `${f.name} (${kb} KB) — upload failed (HTTP ${xhr.status})`;
            return;
          }
          let body = null;
          try { body = JSON.parse(xhr.responseText); } catch (err) { body = null; }
          out.textContent = body && body.ok
            // The server's OWN count, not the local one -- that is what makes
            // this evidence of a completed round trip rather than a claim.
            ? `${body.name} — server received ${Math.ceil(body.bytes / 1024)} KB (${body.type}), not stored`
            : `${f.name} (${kb} KB) — upload failed (bad response)`;
        });
        xhr.addEventListener('error', () => {
          if (out) out.textContent = `${f.name} (${kb} KB) — upload failed (network error)`;
        });
        if (out) out.textContent = `${f.name} (${kb} KB) — uploading…`;
        xhr.send(f);
      });
    }

    // Shared by the real-demo and generated-example paths: pretty-print the
    // source and hand it to the project's own pre/code highlighting pair.
    async function renderSource(src) {
      let pretty = src;
      try {
        const demoMod = await import(siteRoot() + 'src/wb-viewmodels/demo.js');
        if (demoMod.formatHtml) pretty = demoMod.formatHtml(src) || src;
      } catch (err) {
        console.warn('[behaviors] could not format source', err);
      }
      liveCode.innerHTML = '';

      // Copy button. It copies `pretty` -- the exact source we just formatted --
      // rather than reading text back out of the rendered <pre>, which carries
      // x-pre's line-number gutter and would paste "1 <button" instead of
      // "<button".
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'behaviors-live__copy';
      copy.textContent = 'Copy';
      copy.title = 'Copy this example to the clipboard';
      copy.addEventListener('click', async () => {
        // #776 -- John: "Copy code in this example does not work."
        //
        // navigator.clipboard.writeText() throws for reasons that have nothing
        // to do with the page being wrong: the document not being focused, a
        // permissions policy, an embedded context. Verified live -- secure
        // context, API present, and it still threw, so the button reported
        // "Press Ctrl+C".
        //
        // Which was worse than failing: there is no selection, so Ctrl+C
        // copies nothing. The advice was impossible to follow.
        //
        // execCommand('copy') is deprecated but works where the async API is
        // refused, so it is the FALLBACK, not the primary. Only if both fail
        // does the reader get told -- and then told something true.
        const viaExecCommand = (text) => {
          const ta = document.createElement('textarea');
          ta.value = text;
          // Off-screen but focusable: display:none or visibility:hidden cannot
          // be selected, and the copy silently does nothing.
          ta.setAttribute('readonly', '');
          ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try { ok = document.execCommand('copy'); } catch { ok = false; }
          ta.remove();
          return ok;
        };

        let ok = false;
        try {
          await navigator.clipboard.writeText(pretty);
          ok = true;
        } catch (err) {
          console.warn('[behaviors] clipboard API refused, falling back', err);
          ok = viaExecCommand(pretty);
        }
        copy.textContent = ok ? 'Copied' : 'Copy failed';
        setTimeout(() => { copy.textContent = 'Copy'; }, 1600);
      });
      liveCode.appendChild(copy);

      const pre = document.createElement('pre');
      pre.setAttribute('x-behavior', 'pre');
      const code = document.createElement('code');
      code.setAttribute('x-behavior', 'code');
      code.dataset.language = 'html';
      code.textContent = pretty;
      pre.appendChild(code);
      liveCode.appendChild(pre);

      try {
        const mod = await import(siteRoot() + 'src/core/wb-lazy.js');
        const WB = mod.default || mod.WB || window.WB;
        if (WB && WB.scan) {
          await WB.scan(liveStage, { eager: true });
          await WB.scan(liveCode, { eager: true });
          wireExample();
        }
      } catch (err) {
        liveNote.textContent = 'could not run this example';
        console.warn('[behaviors] live preview failed', err);
      }
    }

    // #666 — John: 'then add a summary. In this case "shows a red background"'.
    // Derived from what actually rendered, not hand-authored: 42 schemas x their
    // variants is ~200 strings that would rot the moment a theme or variant
    // changed, and a summary that disagrees with the pixels is worse than none.
    // Reads the real computed style of the upgraded element and names the
    // dominant visual difference.
    const HUES = [
      ['red', 0], ['orange', 30], ['yellow', 55], ['green', 100], ['teal', 165],
      ['blue', 210], ['indigo', 250], ['purple', 280], ['pink', 320], ['red', 350],
    ];
    function colourName(r, g, b) {
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2 / 255;
      // Lightness first: a near-black surface with a slight blue cast is "dark"
      // to a reader, not "blue". rgb(41,48,61) -- the default card background --
      // has just enough spread to compute a blue hue, and calling that blue is
      // simply wrong to anyone looking at it.
      if (l < 0.22) return 'dark';
      if (l > 0.9) return 'near-white';
      if (max - min < 18) return l > 0.75 ? 'light grey' : 'grey';
      let h = 0;
      const d = max - min;
      if (max === r) h = 60 * (((g - b) / d) % 6);
      else if (max === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
      if (h < 0) h += 360;
      let best = HUES[0];
      for (const entry of HUES) {
        if (Math.abs(h - entry[1]) < Math.abs(h - best[1])) best = entry;
      }
      return best[0];
    }
    function parseRgb(v) {
      const str = String(v);
      // Modern syntax: color(srgb 0.94 0.94 0.95 / 0.08). Chrome returns this
      // for theme colours defined with color-mix/relative colour, so an
      // rgba()-only parser silently returned null and every translucent
      // surface (glass) fell through to the border branch.
      const c = str.match(/color\(srgb\s+([^)]+)\)/i);
      if (c) {
        const parts = c[1].split('/');
        const rgb = parts[0].trim().split(/\s+/).map(Number);
        return {
          r: rgb[0] * 255, g: rgb[1] * 255, b: rgb[2] * 255,
          a: parts[1] === undefined ? 1 : parseFloat(parts[1]),
        };
      }
      const m = str.match(/rgba?\(([^)]+)\)/);
      if (!m) return null;
      const p = m[1].split(',').map((n) => parseFloat(n));
      return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
    }
    /** The schema's own description of this option -- what to expect to see. */
    function optionDescription(attr, prop) {
      if (!prop) return '';
      const sc = schemaByName.get(extensionMap[attr]);
      const def = sc && sc.properties && sc.properties[prop];
      return (def && def.description) ? def.description : '';
    }

    function summarise(el) {
      if (!el) return '';
      const cs = getComputedStyle(el);
      const bg = parseRgb(cs.backgroundColor);
      if (cs.backgroundImage && cs.backgroundImage !== 'none') return 'shows a gradient background';
      if (bg && bg.a > 0.85) return `shows a ${colourName(bg.r, bg.g, bg.b)} background`;
      if (bg && bg.a > 0.05) return `shows a translucent ${colourName(bg.r, bg.g, bg.b)} background`;
      const bw = parseFloat(cs.borderTopWidth) || 0;
      if (bw > 0) {
        const bc = parseRgb(cs.borderTopColor);
        return bc ? `shows a ${colourName(bc.r, bc.g, bc.b)} border` : 'shows a border';
      }
      if (cs.boxShadow && cs.boxShadow !== 'none') return 'shows a raised shadow';
      return 'no background or border — plain';
    }

    const eventsLog = document.getElementById('behaviors-live-events-log');
    const eventsHint = document.getElementById('behaviors-live-events-hint');

    // Events a behavior is likely to dispatch, plus the raw interaction that
    // triggered it. Captured on the STAGE so a listener is never attached to
    // the example itself -- attaching to the element could change what the
    // behavior sees (stopPropagation, once-handlers) and the panel must observe,
    // not participate.
    const WATCHED = ['click', 'change', 'input', 'submit', 'toggle'];
    let eventCount = 0;

    // #677 -- John: "this is an ambiguous event handler, don't we need a from
    // location?". Entries used to read `button.x-button` for every element
    // sharing a tag and a class, which is most of them, so two events from two
    // different elements were indistinguishable. #675 gave every element in the
    // stage a stable id, so an entry can now name its actual source.
    /**
     * #755 -- John: "where's the element id ... all we need is the id not all
     * that bullshit."
     *
     * Every element in the stage carries a stable id (#675), so the id alone
     * identifies the source exactly. Tag and class added nothing an id does
     * not already say, and buried the one token worth reading. They remain as
     * the fallback for the rare element with no id.
     */
    function describeElement(el) {
      if (!(el instanceof Element)) return '?';
      if (el.id) return el.id;
      const cls = typeof el.className === 'string' && el.className.trim()
        ? '.' + el.className.trim().split(/\s+/)[0] : '';
      return el.tagName.toLowerCase() + cls;
    }

    function logEvent(e) {
      const target = e.target instanceof Element ? e.target : null;
      // #755: the listener is on the STAGE, so a click on the stage's own
      // padding logged `div#behaviors-live-stage` -- page chrome reported as
      // if the example had fired it. The panel documents the EXAMPLE; an
      // event that never reached it is not the example's event.
      if (!target || !liveExample.contains(target)) return;
      const from = describeElement(target);
      // An event that started on a descendant is a different story from one on
      // the example root, and that difference is exactly what was missing.
      const root = liveExample.firstElementChild;
      const origin = target && root && target !== root && root.contains(target)
        ? ` <span class="behaviors-live__events-from">from ${describeElement(root)}</span>` : '';
      const li = document.createElement('li');
      li.className = 'behaviors-live__events-item';
      li.innerHTML =
        `<code class="behaviors-live__events-type">${e.type}</code>` +
        `<span class="behaviors-live__events-target">${from}</span>${origin}`;
      eventsLog.prepend(li);
      eventsEmpty.hidden = true;
      eventCount++;
      eventsHint.textContent = `${eventCount} event${eventCount === 1 ? '' : 's'}`;
      // Keep the last 12: a drag or a repeated toggle would otherwise grow the
      // panel without bound.
      while (eventsLog.children.length > 12) eventsLog.lastElementChild.remove();
    }

    // Attached ONCE, in the capture phase, on the stage container -- never on
    // the example itself. A listener on the element could change what the
    // behavior observes (a stopPropagation or a once-handler), and this panel
    // must watch without participating. Capture also means it still sees events
    // a behavior stops from bubbling.
    WATCHED.forEach((type) => liveStage.addEventListener(type, logEvent, true));

    // #705 -- John: "leave it there but log the event via handler". WATCHED only
    // covers native types, so a behavior's OWN event -- wb:dropdown:select,
    // wb:autocomplete:select, wb:cardexpandable:toggle, dozens more -- bubbled
    // out unlogged, and the panel showed nothing for the one interaction the
    // example exists to demonstrate (while the handler snippet below it told the
    // reader to listen for exactly that event).
    //
    // There is no registry of behavior event names to subscribe to, and
    // addEventListener has no wildcard. Wrapping dispatchEvent is the one place
    // every custom event must pass through. The wrapper only OBSERVES: it always
    // calls through, never swallows, and it ignores anything dispatched outside
    // the stage, so nothing about how the page or the behaviors run changes.
    const CUSTOM_EVENT_RE = /^(wb|x):/;
    const nativeDispatch = EventTarget.prototype.dispatchEvent;
    EventTarget.prototype.dispatchEvent = function (event) {
      const result = nativeDispatch.call(this, event);
      try {
        if (event && CUSTOM_EVENT_RE.test(event.type) && this instanceof Node && liveStage.contains(this)) {
          logEvent({ type: event.type, target: this });
        }
      } catch { /* logging must never break the event it is watching */ }
      return result;
    };

    let eventsSnippet = document.getElementById('behaviors-live-events-snippet');

    /** The wiring a reader would copy to handle this example's events. */
    function handlerSnippet(hostTag, token, rootId) {
      if (liveStage.querySelector('#x-demo-file')) {
        return [
          `const btn = document.querySelector('button[aria-controls="x-demo-file"]');`,
          `const input = document.querySelector('#x-demo-file');`,
          ``,
          `btn.addEventListener('click', () => input.click());`,
          ``,
          `input.addEventListener('change', () => {`,
          `  const file = input.files[0];`,
          `  if (!file) return;`,
          ``,
          `  const xhr = new XMLHttpRequest();`,
          `  xhr.open('POST', '/api/upload');`,
          `  xhr.setRequestHeader('Content-Type', file.type);`,
          `  xhr.setRequestHeader('X-File-Name', file.name);`,
          ``,
          `  // fetch() has no upload-progress event; XHR does.`,
          `  xhr.upload.addEventListener('progress', (e) => {`,
          `    if (e.lengthComputable) console.log(Math.round(e.loaded / e.total * 100) + '%');`,
          `  });`,
          `  xhr.addEventListener('load', () => console.log(xhr.responseText));`,
          `  xhr.addEventListener('error', () => console.error('upload failed'));`,
          ``,
          `  xhr.send(file);`,
          `});`,
        ].join('\n');
      }
      // #675: an id beats a tag selector -- `document.querySelector('button')`
      // grabs the first button on the READER's page, not this example.
      const sel = rootId ? '#' + rootId : (hostTag ? hostTag : '[' + token + ']');

      // #708 / Standard 27 -- a control that fires its own event should teach
      // THAT event and the payload it actually carries, not a generic click.
      // A generic click handler tells a reader nothing about how to know WHICH
      // option was picked. Same precedent as the file-upload snippet above.
      const CUSTOM_EVENT_SNIPPETS = {
        'x-dropdown': [
          `el.addEventListener('wb:dropdown:select', (e) => {`,
          `  const { id, index, value, href } = e.detail;`,
          `  console.log('picked', { id, index, value, href });`,
          `});`,
        ],
      };
      const custom = CUSTOM_EVENT_SNIPPETS[token];
      if (custom) {
        return [`const el = document.querySelector('${sel}');`, ``, ...custom].join('\n');
      }

      return [
        `const el = document.querySelector('${sel}');`,
        ``,
        `el.addEventListener('click', (e) => {`,
        `  console.log('clicked', e.target);`,
        `});`,
      ].join('\n');
    }

    const eventsEmpty = document.getElementById('behaviors-live-events-empty');

    async function resetEvents(hostTag, token, rootId) {
      eventsLog.innerHTML = '';
      eventCount = 0;
      eventsHint.textContent = 'interact with the example above';
      eventsEmpty.hidden = false;

      // Highlighted like the source panel, via the same x-behavior pre/code
      // pair -- a plain <pre> rendered the handler as unstyled text, and it
      // overflowed its box rather than wrapping. A FRESH host each time:
      // WB.inject() will not re-apply a behavior to an element that already
      // carries it (the same trap the doc panel hit).
      const fresh = document.createElement('div');
      fresh.id = 'behaviors-live-events-snippet';
      fresh.className = 'behaviors-live__events-code';
      eventsSnippet.replaceWith(fresh);
      eventsSnippet = fresh;

      const pre = document.createElement('pre');
      pre.setAttribute('x-behavior', 'pre');
      const code = document.createElement('code');
      code.setAttribute('x-behavior', 'code');
      code.dataset.language = 'javascript';
      code.textContent = handlerSnippet(hostTag, token, rootId);
      pre.appendChild(code);
      eventsSnippet.appendChild(pre);

      try {
        const mod = await import(siteRoot() + 'src/core/wb-lazy.js');
        const WB = mod.default || mod.WB || window.WB;
        if (WB && WB.scan) await WB.scan(eventsSnippet, { eager: true });
      } catch (err) {
        console.warn('[behaviors] could not highlight the handler snippet', err);
      }
    }

    async function showLive(token, variant, label, prop, isBool, form) {
      // #769 -- John, 4th report: "get rid of all this dead space!"
      //
      // fitStageToOverlays() grows the stage so an open dropdown or a
      // fullscreen dialog has somewhere to live. That growth has to be dropped
      // when a DIFFERENT example is shown, or the next one inherits a box
      // sized for the last one -- a two-line <details> centred in 400px of
      // nothing.
      //
      // The reset existed, on ONE of the two render paths. Generated examples
      // took the other one and kept the previous height. Same shape as the
      // dev-server notice in 3.0.73: a fix applied to one branch of a two-
      // branch render. Reset here instead, before either branch runs, so a
      // path cannot be missed again.
      liveStage.style.minHeight = '';
      const raw = sourceFor(token, form);
      const src = raw ? withOption(raw, token, prop, variant, isBool) : raw;
      liveEl.hidden = false;
      // John: "Switch these two, behaivor first, variant 2nd".
      const shown = label || token;
      const behaviorName = extensionMap[token] || token.replace(/^x-/, '');
      showApi(behaviorName);
      showDoc(behaviorName);
      const optionText = variant
        ? (isBool ? prop : (prop && prop !== 'variant' ? `${prop}=${variant}` : variant))
        : '';
      liveToken.textContent = optionText ? `${shown} · ${optionText}` : shown;

      if (!src) {
        // John: "x-article shows nothing shouldn't it at least show a semantic
        // article?" -- yes. Rather than an empty box, synthesise a minimal
        // example and run it. The whole point of an x-* behavior is that ANY
        // element can carry it, so the only real question is which host to
        // demonstrate it on.
        const generated = generatedExample(token, variant, label, prop, isBool);
        liveNote.textContent = 'generated example — no demo on this page';
        liveCode.innerHTML = '';
        // #777: the DOM is built from the REFRESHED markup, not the raw
        // catalogue string. Refreshing only the displayed source left the
        // rendered element still carrying the canned example's label, so the
        // button read "icon: download" while its own source said heart.
        const generatedShown = refreshDescriptorLine(generated);
        liveExample.innerHTML = generatedShown;
        maybeWarnServerRequired(generated);
        const genRootId = assignExampleIds(token, optionText);
        resetEvents(liveExample.firstElementChild && liveExample.firstElementChild.tagName.toLowerCase(), token, genRootId);
        await renderSource(withRootId(generatedShown, genRootId));
        assignExampleIds(token, optionText); // #675: catch behavior-injected children
        const genDescribed = optionDescription(token, prop);
        const genSummary = genDescribed || summarise(liveExample.firstElementChild);
        liveNote.textContent = genSummary
          ? `generated — ${genSummary}`
          : 'generated example — no demo on this page';
        return;
      }

      // #752 -- John: "this warning should be shown to the user using the
      // static site reminding them to download this repo first."
      //
      // Some examples post to /api/... which only server.js serves. On the
      // published static site that route cannot exist, so the demo fails and
      // the reader has no way to know the example is fine and the HOST is the
      // limitation. Say so, where they are looking, and tell them what to do.
      function maybeWarnServerRequired(source) {
        const prev = liveExample.parentNode.querySelector('.behaviors-live__server-note');
        if (prev) prev.remove();
        if (!/action=("|')\/api\//.test(source)) return;
        // A static host serves files, not routes. Probing would cost a request
        // per example and still race the render, so key off the one thing that
        // is knowable synchronously: server.js is what serves this page during
        // development, and it always runs on localhost.
        const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
        if (isLocal) return;
        const note = document.createElement('p');
        note.className = 'behaviors-live__server-note';
        note.innerHTML =
          '⚠️ <strong>This example needs the local dev server.</strong> ' +
          'It posts to <code>/api/…</code>, a route this static site cannot serve, ' +
          'so submitting it here will fail. Clone the repo and run ' +
          '<code>npm start</code> to see it work: ' +
          '<a href="https://github.com/CieloVistaSoftware/wb-starter" target="_blank" rel="noopener">' +
          'github.com/CieloVistaSoftware/wb-starter</a>';
        liveExample.parentNode.insertBefore(note, liveExample.nextSibling);
      }

      liveNote.textContent = optionDescription(token, prop) || 'running live';
      // #703: drop the previous example's grown height before measuring this one.
      liveStage.style.minHeight = '';
      // #777: DOM built from the refreshed markup — see the generated path.
      const srcShown = refreshDescriptorLine(src);
      liveExample.innerHTML = srcShown;
      maybeWarnServerRequired(src);
      const rootId = assignExampleIds(token, optionText);
      resetEvents(liveExample.firstElementChild && liveExample.firstElementChild.tagName.toLowerCase(), token, rootId);
      await renderSource(withRootId(srcShown, rootId));
      assignExampleIds(token, optionText); // #675: catch behavior-injected children
      // After the upgrade, so the summary describes the UPGRADED element rather
      // than the bare markup it was built from.
      // Prefer the AUTHORED description of the option over a derived visual
      // guess -- John: "add description on what to expect to see". The schema
      // already says exactly that ("Show 15-band equalizer", "Start muted"),
      // and it is accurate for options with no visible surface change, where
      // summarise() can only ever report the host's background.
      const described = optionDescription(token, prop);
      const summary = described || summarise(liveExample.firstElementChild);
      if (summary) liveNote.textContent = summary;
      // #703: an example can render something taller than the stage's 6rem
      // floor even before anything is opened.
      fitStageToOverlays();
    }

    // #666 — John: "allow the user to use the down arrow for each item shown in
    // list to render". Arrow keys walk the list and render each row as it is
    // reached, so a reader can hold Down and watch every variant in turn
    // without reaching for the mouse.
    //
    // aria-current marks the rendered row: clicking now SELECTS rather than
    // navigates, and without it a screen-reader user has no way to tell which
    // of 228 rows the panel is showing.
    function rowsInOrder() {
      return [...resultsEl.querySelectorAll('.behaviors-search-results__row')];
    }

    function selectRow(row, { focus = true, reveal = false } = {}) {
      if (!row) return;
      rowsInOrder().forEach((r) => r.removeAttribute('aria-current'));
      row.setAttribute('aria-current', 'true');
      // Scroll the LIST only, by hand. scrollIntoView({block:'nearest'}) still
      // scrolls ancestor scrollers when the row is off-screen at page level --
      // measured moving the page from 5541 to 341 while arrowing. The panel
      // exists so the page does not move (John: "don't scroll down"), so the
      // list's own scrollTop is adjusted directly and nothing else is touched.
      // #728 -- John, having used the align-to-top version: "set it to normal
      // action on key up and or down. I don't like the always at top stuff."
      // So: move the selection, and scroll ONLY when the row would otherwise be
      // out of view, by the minimum needed. A row already on screen leaves the
      // list where it is. This replaces #687/#717.
      const listTop = resultsEl.scrollTop;
      const rowTop = row.offsetTop - resultsEl.offsetTop;
      const rowBottom = rowTop + row.offsetHeight;
      if (rowTop < listTop) resultsEl.scrollTop = rowTop;
      else if (rowBottom > listTop + resultsEl.clientHeight) {
        resultsEl.scrollTop = rowBottom - resultsEl.clientHeight;
      }
      if (focus) row.focus({ preventScroll: true });
      showLive(row.dataset.browseToken, row.dataset.variant || '', row.dataset.label || '',
               row.dataset.prop || '', row.dataset.boolean === '1', row.dataset.form || 'attribute');
      // #686 -- John, on a phone: "doesn't show the sample code and result".
      // Stacked, the panel starts ~300px past the bottom of #siteBody (measured
      // at 375x812: list ends at 841, panel stage at 920, scroller is 627 tall),
      // so a tap rendered the demo somewhere the reader could not see with no
      // cue anything had happened. Two columns keep the no-scroll rule above --
      // there the panel is already beside the list. `reveal` is opt-in per call
      // so the best-match selectRow() that applyFilter() runs on EVERY keystroke
      // never yanks the page away from the search box.
      // Instant, not smooth: showLive() injects the demo, fetches its doc and
      // re-lays out the panel while the animation would still be running, and
      // the browser cancels a smooth scroll on that churn -- measured landing
      // back at scrollTop 0 every time.
      if (reveal && STACKED.matches) {
        liveEl.scrollIntoView({ block: 'start' });
      }
    }

    function moveSelection(delta) {
      const rows = rowsInOrder();
      if (!rows.length) return;
      const current = resultsEl.querySelector('[aria-current="true"]');
      let i = current ? rows.indexOf(current) : -1;
      i = i < 0 ? (delta > 0 ? 0 : rows.length - 1) : i + delta;
      if (i < 0) i = 0;
      if (i > rows.length - 1) i = rows.length - 1;
      selectRow(rows[i]);
    }

    resultsEl.addEventListener('keydown', (e) => {
      if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) selectedByKeyboard = true;
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
      else if (e.key === 'Home') { e.preventDefault(); selectRow(rowsInOrder()[0]); }
      else if (e.key === 'End') { e.preventDefault(); const r = rowsInOrder(); selectRow(r[r.length - 1]); }
    });

    // Down from the search box drops into the list, so the keyboard path works
    // straight from typing without an intervening Tab.
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        selectedByKeyboard = true;
        e.preventDefault();
        const rows = rowsInOrder();
        if (rows.length) selectRow(rows[0]);
      }
    });

    // #759 -- John: "When clicking the button resync the left side to show
    // which one it was (at the top)."
    //
    // The list is browsable while the panel stays put (#664), so scrolling it
    // away from the current selection is normal and expected. The cost is that
    // the panel then shows `button . iconOnly` while the list shows `article`
    // rows, and nothing on screen connects the two.
    //
    // Clicking the rendered example resyncs: the row that produced it goes to
    // the TOP of the list, which is where John asked for it. Aligning to top
    // here does NOT conflict with #728 -- that was about arrow keys, where
    // always-to-top was disorienting because the selection moves one row at a
    // time. This is a deliberate "where am I?" gesture, and the answer is only
    // useful if you can see it without hunting.
    // Capture phase, and on the STAGE rather than the example: a behavior that
    // calls stopPropagation on its own click -- dropdown, dialog, drawer,
    // popover all do -- would otherwise never let this run, so the resync would
    // work for a plain button and silently not for the examples most likely to
    // leave you lost. Capture also means it fires before the example handles
    // the click, so the behavior still does everything it normally does; this
    // only reads the list and scrolls it.
    liveStage.addEventListener('click', () => {
      const current = resultsEl.querySelector('[aria-current="true"]');
      if (!current) return;
      resultsEl.scrollTop = current.offsetTop - resultsEl.offsetTop;
    }, true);

    resultsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.behaviors-search-results__row');
      if (!btn) return;
      selectedByKeyboard = false;
      if (btn.dataset.browseToken) {
        // #664: render it, and LEAVE THE LIST ALONE. Filling the input would
        // re-run applyFilter and collapse the browse list to just this one
        // behavior, so picking the next one meant clearing the box first --
        // the list has to stay browsable while the panel changes beside it.
        selectRow(btn, { focus: false, reveal: true });
        return;
      }
      // #664: render it in the panel beside the list. Deliberately NO
      // scrollIntoView -- John: "don't scroll down to existing samples, just
      // show the code render in element next to dropdown". Jumping the page
      // away from the search box is the behaviour this panel replaces.
      const rowToken = btn.querySelector('.behaviors-search-results__token');
      if (rowToken) {
        showLive(rowToken.textContent.trim().split(/\s+/)[0], btn.dataset.variant || '');
        // #686: same reveal as the branch above -- stacked, the panel is below
        // the fold and the render is invisible without it.
        if (STACKED.matches) liveEl.scrollIntoView({ block: 'start' });
      }
    });

    input.addEventListener('input', () => applyFilter(input.value));

    /**
     * Type-to-search.
     *
     * John, pointing at the browse list: "typing keys here should filter eg
     * prog should show all with that string etc."
     *
     * Making the bar sticky keeps it on screen, but a reader scrolling the
     * list still has focus nowhere, so the first keystrokes were dropped until
     * they thought to click the box first. Route a printable key straight to
     * the search input, the way a file browser or a long <select> does.
     *
     * Deliberately narrow, so it cannot hijack anything:
     *   - only printable single characters, so Tab/Escape/arrows still work
     *   - no Ctrl/Meta/Alt, so Ctrl+F, Cmd+R and friends are untouched
     *   - never while the reader is already in a field, which is what would
     *     otherwise make the theme picker and every future input untypable
     */
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length !== 1) return;
      if (document.activeElement === input) return;

      const el = document.activeElement;
      const tag = el && el.tagName ? el.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || (el && el.isContentEditable)) return;

      // Focus AND append the character: letting the keystroke through on its
      // own is unreliable across browsers, and swallowing it loses the first
      // letter the reader typed, which is its own small bug.
      e.preventDefault();
      input.focus();
      input.value += e.key;
      applyFilter(input.value);
    });

    // #766: changing the filter re-runs the same query, so the search text and
    // the form choice compose instead of overriding each other.
    //
    // DELEGATED, not bound per radio. Binding with querySelectorAll at setup
    // captured whatever existed at that instant -- and this script runs while
    // the fragment is still being wired, so the NodeList came back empty and
    // clicking a radio did nothing at all. The list simply stayed on "Both",
    // which reads exactly like a filter that does not filter.
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t && t.name === 'authoring-form') applyFilter(input ? input.value : '');
    });
    applyFilter('');

    // #771 -- John: "always pick the first element on the left when this page
    // is shown for the first time."
    //
    // The panel opened empty, so the first thing a reader saw was a list and a
    // blank space with nothing explaining what to do. Select the first row so
    // the page arrives showing something running.
    //
    // Deferred until the list has rows: allEntries is filled by two fetches
    // (tag-map, then the schema index), so applyFilter('') above can render
    // nothing on the first pass and fill in a tick later.
    (function selectFirstOnLoad() {
      let tries = 0;
      const pick = () => {
        if (resultsEl.querySelector('[aria-current="true"]')) return;   // reader got there first
        const first = resultsEl.querySelector('.behaviors-search-results__row');
        if (first) {
          // focus:false -- stealing focus on load would move the caret out of
          // the search box before the reader has typed anything.
          selectRow(first, { focus: false, reveal: false });
          return;
        }
        if (++tries < 40) setTimeout(pick, 100);
      };
      pick();
    })();
  })();
  </script>
