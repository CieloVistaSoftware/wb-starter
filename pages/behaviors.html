<!-- #666: the per-category demo sections and their jump-nav were removed here.
     Every one of those 88 <wb-demo> blocks now lives in
     data/behavior-examples.json (scripts/build-behavior-examples.mjs) and is
     rendered on demand by the live-preview panel above -- so the examples are
     still here, they are just no longer 13,000px of markup you have to scroll

     jump to, and the selector reaches every behavior directly. -->

  <!-- FOOTER -->
  <footer id="footer">
    <!-- x-release, not {{WB_VERSION}}: that token is substituted only by
         site-engine.js for SPA page fragments, so a direct visit to
         /pages/behaviors.html rendered the literal "v{{WB_VERSION}}".
         release.js exists to replace exactly that -- it "works identically
         everywhere -- SPA fragment or standalone page". The behavior count is
         filled in from the same registry the selector uses, so it cannot drift
         the way the hardcoded 71 did. -->
    <p>wb-starter <span x-release></span> • <span id="footer-behavior-count">…</span> behaviors • 50 themes</p>
    <p><a href="?page=docs">Documentation</a> • <a href="?page=themes">Themes</a> • <a href="?page=home">Home</a></p>
  </footer>

  <script>
  // #635: John, screenshot on this page: "Add a search here that allows
  // finding all of our behaviors. e.g. x-tooltiop, x-this, x-that etc.
  // typing in just x- will show all of them". Matches each <wb-demo>'s own
  // `_rawSource` (the exact authored markup, captured synchronously at
  // connectedCallback -- see wb-demo.js -- available immediately, no need
  // to wait for lazy behaviors to finish applying) against the query, then
  // hides the h3/section around any group with nothing left visible so the
  // filtered page never shows an orphaned empty heading.
  (function () {
    const input = document.getElementById('behaviors-search');
    const countEl = document.getElementById('behaviors-search-count');
    const resultsEl = document.getElementById('behaviors-search-results');
    if (!input || !countEl || !resultsEl) return;

    const demos = Array.from(document.querySelectorAll('wb-demo'));
    const total = demos.length;

    // John: "prefill this dropdown box with all known x- attributes" --
    // browsing before typing anything needs the CANONICAL list (every
    // registered behavior, "x-" + name), not just whatever happens to
    // appear in this page's own demo markup -- a behavior with zero demos
    // on THIS page would otherwise never show up at all. Sourced from
    // tag-map.js's elementMap (the same single source of truth the #631
    // audit/registration work this session already established), via
    // dynamic import() so this stays a classic <script> (matches every
    // other inline script on this page) instead of needing type="module".
    // siteRoot() mirrors demo.js's own helper -- this page can be loaded
    // both through the SPA (root '/') and under a GitHub Pages sub-path
    // ('/wb-starter/'), and a bare leading '/' import would 404 on the
    // latter.
    function siteRoot() {
      const stripped = location.pathname.replace(/(?:public|demos|pages|articles|tests\/fixtures)\/.*$/, '');
      return stripped.replace(/[^/]*$/, '');
    }
    let allEntries = [];
    let extensionMap = {};
    let nativeMap = {};
    const schemaByName = new Map();
    let exampleCatalogue = {};

    // #666: one row per VARIANT, not one per behavior -- John: "add one entry
    // for each variant too... show the behavior name and all possible variants
    // (one per row so user can see them all)". A behavior with no declared
    // variant enum still gets exactly one row, with an empty variant cell.
    // #666 — John: "isn't the language type a variant" / "so shouldn't we
    // include those?". Yes. `variant` is not the only axis a control varies on:
    // size, position, icon, aspect, inputType and others are declared the same
    // way, and a reader wanting to see every option needs all of them. Every
    // enum-valued property now produces rows, SUMMED per axis (not a cartesian
    // product -- that would explode 143 entries into thousands).
    //   variant-only: 272 rows.  all enum properties: 484.
    function variantsFor(attr) {
      const sc = schemaByName.get(extensionMap[attr]);
      const props = (sc && sc.properties) || {};
      const out = [];
      for (const [name, def] of Object.entries(props)) {
        if (!def) continue;
        if (Array.isArray(def.enum) && def.enum.length) {
          for (const value of def.enum) out.push({ prop: name, value });
        } else if (def.type === 'boolean') {
          // #666 — John: "we need many permutations of table". table declares
          // NO enums; every axis it has is a boolean (sortable, filterable,
          // paginated, striped, hoverable, compact, bordered), so it showed a
          // single blank row while having seven real options. A boolean flag is
          // an axis like any other -- one row per flag, showing it enabled.
          // 114 flags across 50 entries; NOT combined, since 7 booleans would
          // be 128 permutations for table alone.
          out.push({ prop: name, value: 'true', boolean: true });
        }
      }
      // Sorted so `variant` leads -- it is the axis most readers look for --
      // and the rest follow alphabetically rather than in schema-key order.
      out.sort((a, b) =>
        (a.prop === 'variant' ? -1 : b.prop === 'variant' ? 1 : a.prop.localeCompare(b.prop)) ||
        0
      );
      return out.length ? out : [{ prop: '', value: '' }];
    }

    /** How an option reads in the variant column: bare for variant, prop=value otherwise. */
    function optionLabel(opt) {
      if (!opt || !opt.value) return '';
      if (opt.boolean) return opt.prop;              // `striped`, not `striped=true`
      return opt.prop === 'variant' ? opt.value : `${opt.prop}=${opt.value}`;
    }
    import(siteRoot() + 'src/core/tag-map.js')
      .then(async (mod) => {
        // #665: extensionMap, NOT elementMap. elementMap maps wb-* COMPONENT
        // TAGS to behavior names (wb-card, wb-button, wb-badge, ...), so
        // prefixing its values with "x-" produced a list of components wearing
        // behavior names -- x-card, x-button, x-cardbutton -- on a page titled
        // "WB Behaviors Showcase", while the ~105 real behaviors never
        // appeared at all. extensionMap is the actual x-* behavior registry:
        // "Extensions are effects, utilities, and morphing behaviors".
        //
        // Its KEYS are already the authored attribute names (x-ripple), so
        // they are used directly rather than rebuilt from the values -- several
        // attributes share one behavior function, and mapping through the
        // values would silently collapse them.
        extensionMap = mod.extensionMap;
        nativeMap = mod.nativeMap || {};
        // John: "do not include any as- behaviors" -- x-as-{name} is the
        // MORPHING form (x-as-card), which re-renders an element AS another
        // component rather than adding behavior to it.
        //
        // And: "in cases where we fully inject into a semantic element like
        // audio we do not need to list the x-audio as it's autoinjected" --
        // writing <audio> already applies the behavior, so x-audio is pure
        // duplication. Those 19 entries are listed under their SEMANTIC
        // ELEMENT instead of dropped outright, because the element is the
        // real authoring form (<button variant="primary">) and its variants
        // still need to be visible.
        const autoHost = {};
        for (const [selector, beh] of Object.entries(mod.nativeMap)) {
          if (!autoHost[beh]) autoHost[beh] = selector;
        }
        // #666: the x-* surface is split across TWO registries -- tag-map's
        // extensionMap and wb-lazy's WB_LAZY_ONLY_ATTRIBUTES. 34 attributes
        // used by real demos on this very page (x-fadein, x-lightbox,
        // x-confirm, x-bounce, ...) live ONLY in the second one, so reading
        // tag-map alone under-reported the behavior list by a third.
        let lazyOnly = {};
        try {
          const lazy = await import(siteRoot() + 'src/core/wb-lazy.js');
          lazyOnly = lazy.WB_LAZY_ONLY_ATTRIBUTES || {};
        } catch (err) {
          console.warn('[behaviors] could not read wb-lazy attribute table', err);
        }
        extensionMap = { ...lazyOnly, ...mod.extensionMap };

        const seen = new Set();
        allEntries = [];
        Object.keys(extensionMap)
          .filter((a) => !a.startsWith('x-as-'))
          .forEach((attr) => {
            const beh = extensionMap[attr];
            const host = autoHost[beh];
            // Key on the BEHAVIOR for auto-injected ones, so x-progress and
            // x-progressbar (same behavior) collapse to a single <progress> row
            // instead of duplicating it.
            const key = host ? 'native:' + beh : attr;
            if (seen.has(key)) return;
            seen.add(key);
            allEntries.push({ label: host || attr, attr, behavior: beh, native: !!host });
          });
        allEntries.sort((a, b) => a.label.localeCompare(b.label));
        // Variants come from the schema index (one fetch, not 105). Failure is
        // non-fatal: the list still renders, just without variant rows.
        // #666: curated examples now come from a data file, so the demo
        // sections no longer have to stay on the page purely as a data source.
        fetch(siteRoot() + 'data/behavior-examples.json')
          .then((r) => (r.ok ? r.json() : null))
          .then((cat) => { if (cat && cat.examples) exampleCatalogue = cat.examples; })
          .catch(() => {});

        return fetch(siteRoot() + 'data/schema-index.json')
          .then((r) => (r.ok ? r.json() : null))
          .then((idx) => {
            if (idx && Array.isArray(idx.schemas)) {
              idx.schemas.forEach((sc) => schemaByName.set(sc.name, sc));
            }
          })
          .catch(() => {})
          .then(() => {
            // Through applyFilter, not renderBrowseAll directly: the count is
            // rendered from allEntries, which is empty until this async load
            // resolves. Calling the renderer alone left "0 behaviors" on screen
            // next to a full list.
            applyFilter(input.value);
            const footerCount = document.getElementById('footer-behavior-count');
            if (footerCount) footerCount.textContent = String(allEntries.length);
          });
      })
      .catch(() => {}); // browse-all list just stays empty; typed search still works

    // #642: John, "the search box says there are 69 items from
    // that search but there is no content. I want an element that has 69
    // rows of information for the end user." -- the count was always
    // correct and scrollIntoView (the earlier #634 follow-up fix) does
    // work, but "scroll a 13,000px page and hope you land near a
    // highlighted item" isn't the same thing as SEEING the 69 results.
    // This builds an actual results list, directly under the search box,
    // no scrolling required to see it exists.
    //
    // Each row's label is every distinct x-*/wb-* token found in that
    // demo's own raw source -- not just the query itself, which for a
    // broad query like "x-" would otherwise put an identical, useless
    // "x-" label on all 69 rows.
    const TOKEN_RE = /(?:<|\s)((?:wb|x)-[a-z0-9-]+)/gi;
    function tokensFor(source) {
      const seen = new Set();
      let m;
      TOKEN_RE.lastIndex = 0;
      while ((m = TOKEN_RE.exec(source))) seen.add(m[1].toLowerCase());
      return Array.from(seen);
    }

    // The heading a demo visually sits under (its nearest preceding h3,
    // falling back to h2) -- gives each row context beyond the bare
    // attribute name, e.g. "x-ripple" under "Ripple Effect".
    function headingFor(demo) {
      let el = demo.previousElementSibling;
      while (el) {
        if (el.tagName === 'H3' || el.tagName === 'H2') return el.textContent.trim();
        el = el.previousElementSibling;
      }
      return '';
    }

    // Empty-query "browse all" state: the canonical list fetched above,
    // not scoped to this page's demos -- lets a reader discover a behavior
    // that has no example here at all. Clicking a row fills the input with
    // that exact token and runs the normal typed-search path (matchedDemos
    // above), rather than trying to scroll anywhere itself -- a behavior
    // with zero demos on this page has nothing to scroll to, and this way
    // that's an honest "Showing 0 of 88", not a silent no-op click.
    let totalRowCount = 0;
    function renderBrowseAll(query) {
      const q = (query || '').trim().toLowerCase();
      if (!allEntries.length) {
        resultsEl.hidden = true;
        return;
      }
      resultsEl.hidden = false;
      resultsEl.innerHTML = '';
      const frag = document.createDocumentFragment();
      let rendered = 0;
      allEntries.forEach((entry) => {
        variantsFor(entry.attr).forEach((opt) => {
          const variant = opt.value;
          const shownOption = optionLabel(opt);
          // Match on everything the reader can see or type: the displayed name,
          // the underlying x-* attribute (still searchable even when the row is
          // labelled by its semantic element), and the option.
          if (q && ![entry.label, entry.attr, shownOption].join(' ').toLowerCase().includes(q)) return;
          rendered++;
          const li = document.createElement('li');
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'behaviors-search-results__row';
          btn.dataset.browseToken = entry.attr;
          btn.dataset.label = entry.label;
          if (entry.native) btn.dataset.native = '1';
          if (variant) {
            btn.dataset.variant = variant;
            btn.dataset.prop = opt.prop;
            if (opt.boolean) btn.dataset.boolean = '1';
          }

          // John: "change the variant to be in col. two" -- name first, variant
          // second, matching the panel header (behavior · variant). The variant
          // cell is rendered even when empty so the two columns stay aligned
          // down the list.
          const t = document.createElement('span');
          t.className = 'behaviors-search-results__token';
          t.textContent = entry.label;
          const v = document.createElement('span');
          v.className = 'behaviors-search-results__variant';
          v.textContent = shownOption;
          btn.append(t, v);
          li.appendChild(btn);
          frag.appendChild(li);
        });
      });
      if (!q) totalRowCount = rendered;
      resultsEl.appendChild(frag);
    }

    function applyFilter(rawQuery) {
      // #666: filters the SELECTOR, not on-page demos. The per-category demo
      // sections are gone -- their examples live in data/behavior-examples.json
      // and render in the panel -- so there is nothing left to show/hide in the
      // document, and the search now narrows the one list that reaches
      // everything.
      const q = rawQuery.trim().toLowerCase();
      renderBrowseAll(q);

      const shown = resultsEl.querySelectorAll('.behaviors-search-results__row').length;
      countEl.textContent = q === ''
        ? `${allEntries.length} behaviors`
        : `Showing ${shown} of ${totalRowCount}`;
    }

    // ─── #664: live preview ────────────────────────────────────────────
    // John: "Make [the list] do the same thing playground does, inject code and
    // immediately show the run time of each. put the demo window right next to
    // this dropdown." Clicking a behavior injects its markup into the panel
    // beside the list and upgrades it in place -- no scrolling a 13,000px page
    // to find the example.
    const liveEl = document.getElementById('behaviors-live');
    const liveToken = document.getElementById('behaviors-live-token');
    const liveNote = document.getElementById('behaviors-live-note');
    const liveStage = document.getElementById('behaviors-live-stage');
    const liveCode = document.getElementById('behaviors-live-code');
    const liveDoc = document.getElementById('behaviors-live-doc');
    let liveDocBody = document.getElementById('behaviors-live-doc-body');

    // Cache: the same doc is re-requested every time a reader arrows back over
    // a behavior, and a 404 is worth remembering too (49 docs, 143 entries --
    // most misses are permanent).
    const docCache = new Map();

    async function showDoc(behavior) {
      liveDoc.hidden = true;
      if (!behavior) return;

      // A FRESH host element per behavior. WB.inject() will not re-apply a
      // behavior to an element that already carries it, so reusing one div
      // rendered the first doc and then left every subsequent one as raw
      // markdown text (confirmed: x-accordion rendered, x-chip and x-ripple
      // did not). Replacing the node sidesteps that entirely.
      const fresh = document.createElement('div');
      fresh.id = 'behaviors-live-doc-body';
      fresh.className = 'behaviors-live__doc-body';
      liveDocBody.replaceWith(fresh);
      liveDocBody = fresh;

      let md = docCache.get(behavior);
      if (md === undefined) {
        try {
          const res = await fetch(`${siteRoot()}docs/behaviors/${behavior}.md`);
          md = res.ok ? await res.text() : null;
        } catch (err) {
          md = null;
        }
        docCache.set(behavior, md);
      }
      if (!md) return; // no doc for this behavior -- show nothing rather than an empty panel

      liveDoc.hidden = false;
      // Open by default: John asked for an element that SHOWS the doc, and a
      // collapsed 40px strip below the fold reads as "there is no doc". Still a
      // <details> so it can be folded away once read.
      liveDoc.open = true;
      // textContent, not innerHTML: mdhtml.js decodes-then-parses and expects
      // the browser to have HTML-escaped the raw markdown first. Assigning raw
      // markdown via innerHTML double-escapes it (the pattern pages/issues.html
      // documents for the same reason).
      liveDocBody.textContent = md;
      try {
        const mod = await import(siteRoot() + 'src/core/wb-lazy.js');
        const WB = mod.default || mod.WB || window.WB;
        // autoLiveRender:false -- a doc that ILLUSTRATES a <wb-*> example must
        // not have that example promoted into a live, fetching element inside
        // this panel; the running example above is the live one.
        if (WB && WB.inject) await WB.inject(liveDocBody, 'mdhtml', { autoLiveRender: false });
      } catch (err) {
        console.warn('[behaviors] could not render doc for ' + behavior, err);
      }
    }

    // The markup for most behaviors is already on this page, inside the
    // <wb-demo> blocks. Prefer a demo whose source ACTUALLY uses the token as
    // an attribute/tag rather than merely mentioning it in prose, so clicking
    // "x-card" does not land on a demo that happens to say "x-card" in a
    // sentence.
    function sourceFor(token) {
      // Catalogue first (data/behavior-examples.json), DOM second. The DOM path
      // is kept so the panel still works on a page that has its own demos --
      // and so removing the sections from this one changes nothing here.
      const fromCatalogue = exampleCatalogue[token];
      if (fromCatalogue && fromCatalogue.source) return fromCatalogue.source;

      const bare = token.replace(/^x-/, '');
      // Doubled backslashes: inside a template literal a lone `\s` collapses
      // to a bare "s", silently producing a regex that matches the wrong thing.
      const asAttr = new RegExp(`[<\\s](?:${token}|wb-${bare})(?=[\\s>=/])`, 'i');
      for (const demo of demos) {
        const src = demo._rawSource || demo.innerHTML || '';
        if (asAttr.test(src)) return src.trim();
      }
      return null;
    }

    // Apply the row's variant to the example, so clicking "error / x-alert"
    // shows the ERROR alert rather than whatever variant the page's demo
    // happened to hardcode. Rewrites an existing variant=, or adds one to the
    // first tag when absent.
    // Some options are only observable in the presence of ANOTHER property.
    // John: `<button iconposition="end">` "doesn't show an icon to use" -- of
    // course it does not, there is no icon to position. Rather than hardcode
    // pairs, the companion is taken from the schema itself: iconPosition needs
    // `icon`, so seed `icon` with its first enum value.
    const COMPANIONS = { iconPosition: 'icon', iconposition: 'icon' };

    // TRIGGER-mode behaviors. dialog() decides its mode by ATTRIBUTE PRESENCE,
    // not tag: with modal-title/modal-content it becomes a visible button that
    // opens a dialog on click; WITHOUT them it takes DEFINITION mode and sets
    // element.style.display = 'none'. So a generated `<dialog variant="...">`
    // is not broken -- it is deliberately invisible, and there is nothing to
    // click. John: "What triggers a dialog?" / "<dialog variant='fullscreen'>
    // doesn't work". Emit the trigger form instead.
    const TRIGGERS = {
      dialog: {
        tag: 'button',
        label: 'Open dialog',
        attrs: { 'modal-title': 'Dialog title', 'modal-content': 'Dialog content goes here.' },
      },
      modal: {
        tag: 'button',
        label: 'Open modal',
        attrs: { 'modal-title': 'Modal title', 'modal-content': 'Modal content goes here.' },
      },
    };

    function companionFor(attr, prop) {
      const partner = COMPANIONS[prop];
      if (!partner) return '';
      const sc = schemaByName.get(extensionMap[attr]);
      const def = sc && sc.properties && sc.properties[partner];
      if (!def) return '';
      const value = Array.isArray(def.enum) && def.enum.length ? def.enum[0] : def.default;
      return value ? ` ${partner}="${value}"` : '';
    }

    function withOption(src, attr, prop, value, isBoolean) {
      if (!value) return src;

      // Standard §20: booleans are authored as BARE attributes. Writing
      // striped="true" would both misrepresent the API and, for flags the
      // behavior reads with `!== 'false'`, be indistinguishable from default.
      if (isBoolean) {
        const bare = new RegExp('\s' + prop + '(?=[\s>=/])', 'i');
        if (bare.test(src)) return src;
        return src.replace(/^(\s*<[a-zA-Z][\w-]*)/, `$1 ${prop}`);
      }

      // Rewrite whichever attribute the example actually used. Several schemas
      // declare ALIASES for variant -- alert's is `type` -- and the behavior
      // reads the alias, so blindly adding `variant=` left the demo's own
      // `type="warning"` winning and the wrong variant rendering. Aliases come
      // from the schema rather than a hardcoded list, so this stays correct as
      // schemas change.
      const sc = schemaByName.get(extensionMap[attr]);
      const target = prop || 'variant';
      // Aliases are declared per-property, so read them for whichever axis this
      // row represents -- alert's variant aliases to `type`, and the same
      // mechanism applies to any other property that declares one.
      const propDef = (sc && sc.properties && sc.properties[target]) || {};
      const aliases = propDef.aliases || [];
      // Ensure the companion is present on a curated example too.
      const partner = COMPANIONS[prop];
      if (partner && !new RegExp('\s' + partner + '\s*=').test(src)) {
        const add = companionFor(attr, prop);
        if (add) src = src.replace(/^(\s*<[a-zA-Z][\w-]*)/, `$1${add}`);
      }

      for (const name of [target, ...aliases]) {
        const re = new RegExp('\\s' + name + '\\s*=\\s*"[^"]*"', 'i');
        if (re.test(src)) return src.replace(re, ` ${name}="${value}"`);
      }
      return src.replace(/^(\s*<[a-zA-Z][\w-]*)/, `$1 ${target}="${value}"`);
    }

    // Which element should host a generated example? An x-* behavior can sit on
    // ANY element, so the honest choice is the most semantic host available:
    //   1. the native element the framework already injects this behavior into
    //      (tag-map's nativeMap -- e.g. button -> button, article -> card)
    //   2. failing that, the behavior's own name IF it is a real HTML element,
    //      which is what makes x-article render a real <article>
    //   3. otherwise <div>, the neutral fallback
    let nativeByBehavior = null;
    function semanticHostFor(behavior) {
      if (!nativeByBehavior) {
        nativeByBehavior = {};
        for (const [selector, beh] of Object.entries(nativeMap || {})) {
          // nativeMap keys are selectors ('input[type="checkbox"]'); only the
          // bare-tag ones are usable as a host element name.
          if (/^[a-z][a-z0-9-]*$/.test(selector) && !nativeByBehavior[beh]) {
            nativeByBehavior[beh] = selector;
          }
        }
      }
      if (nativeByBehavior[behavior]) return nativeByBehavior[behavior];
      // A real HTML element with this name? createElement returns
      // HTMLUnknownElement for anything the parser does not recognise.
      const probe = document.createElement(behavior);
      const known = !(probe instanceof HTMLUnknownElement) && behavior.indexOf('-') === -1;
      return known ? behavior : 'div';
    }

    const VOID = new Set(['img', 'input', 'br', 'hr', 'source', 'track', 'embed', 'col']);

    // A generated example must satisfy what the behavior actually requires.
    // audio.js throws outright ("wb-audio: no src provided -- nothing to play")
    // and logs to the error viewer, so an <audio> with no src is not a harmless
    // stub, it is a real error on every page load. Seeded from the schema's own
    // default where there is one, falling back to a checked-in asset so the
    // example never depends on the network.
    const LOCAL_MEDIA = { audio: 'demos/sample.wav' };
    function seedAttributes(behavior) {
      const sc = schemaByName.get(behavior);
      const props = (sc && sc.properties) || {};
      const out = [];
      if (props.src) {
        const fallback = LOCAL_MEDIA[behavior];
        let src = typeof props.src.default === 'string' ? props.src.default : '';
        // A schema default like "../audio.mp3" is written relative to a demo
        // page, not to this one -- prefer the known-good asset when we have it.
        if (fallback) src = fallback;
        if (src && !/^(https?:)?\/\//.test(src)) src = siteRoot() + src.replace(/^\.{1,2}\//, '');
        if (src) out.push(` src="${src}"`);
      }
      return out.join('');
    }
    function generatedExample(attr, variant, label, prop, isBool) {
      const behavior = extensionMap[attr] || attr.replace(/^x-/, '');

      const trigger = TRIGGERS[behavior];
      if (trigger) {
        const opt = variant ? (isBool ? ` ${prop}` : ` ${prop || 'variant'}="${variant}"`) : '';
        const seeded = Object.entries(trigger.attrs)
          .map(([k, v]) => ` ${k}="${v}"`)
          .join('');
        // The behavior is named explicitly here: on a <button> host the
        // auto-injected behavior is `button`, not `dialog`.
        return `<${trigger.tag} ${attr}${seeded}${opt}>
  ${trigger.label}
</${trigger.tag}>`;
      }
      const host = semanticHostFor(behavior);
      const v = variant ? (isBool ? ` ${prop}` : ` ${prop || 'variant'}="${variant}"`) : '';
      const companion = companionFor(attr, prop);

      // Auto-injected behaviors need NO attribute -- writing the semantic
      // element is the whole authoring form (John: "<button variant='primary'>
      // ... this is because we created a module for the semantic button").
      // Emitting `<button x-button>` here would demonstrate exactly the
      // duplication we are removing.
      const isNative = label && label !== attr;
      if (isNative) {
        // Selector form: input[type="checkbox"] -> <input type="checkbox">
        const sel = label.match(/^([a-z][a-z0-9-]*)(?:\[([^=]+)="([^"]+)"\])?$/i);
        const tag = sel ? sel[1] : host;
        const extra = sel && sel[2] ? ` ${sel[2]}="${sel[3]}"` : '';
        const seed = seedAttributes(behavior);
        if (VOID.has(tag)) return `<${tag}${extra}${seed}${companion}${v}>`;
        return `<${tag}${extra}${seed}${companion}${v}>
  Example ${tag} content
</${tag}>`;
      }

      const seed = seedAttributes(behavior);
      if (VOID.has(host)) return `<${host} ${attr}${seed}${companion}${v}>`;
      return `<${host} ${attr}${seed}${companion}${v}>
  Example ${attr} content
</${host}>`;
    }

    // Shared by the real-demo and generated-example paths: pretty-print the
    // source and hand it to the project's own pre/code highlighting pair.
    async function renderSource(src) {
      let pretty = src;
      try {
        const demoMod = await import(siteRoot() + 'src/wb-viewmodels/demo.js');
        if (demoMod.formatHtml) pretty = demoMod.formatHtml(src) || src;
      } catch (err) {
        console.warn('[behaviors] could not format source', err);
      }
      liveCode.innerHTML = '';

      // Copy button. It copies `pretty` -- the exact source we just formatted --
      // rather than reading text back out of the rendered <pre>, which carries
      // x-pre's line-number gutter and would paste "1 <button" instead of
      // "<button".
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'behaviors-live__copy';
      copy.textContent = 'Copy';
      copy.title = 'Copy this example to the clipboard';
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(pretty);
          copy.textContent = 'Copied';
        } catch (err) {
          // Clipboard access can be denied (permissions, insecure origin).
          // Say so rather than silently appearing to succeed.
          copy.textContent = 'Press Ctrl+C';
          console.warn('[behaviors] clipboard write failed', err);
        }
        setTimeout(() => { copy.textContent = 'Copy'; }, 1600);
      });
      liveCode.appendChild(copy);

      const pre = document.createElement('pre');
      pre.setAttribute('x-behavior', 'pre');
      const code = document.createElement('code');
      code.setAttribute('x-behavior', 'code');
      code.dataset.language = 'html';
      code.textContent = pretty;
      pre.appendChild(code);
      liveCode.appendChild(pre);

      try {
        const mod = await import(siteRoot() + 'src/core/wb-lazy.js');
        const WB = mod.default || mod.WB || window.WB;
        if (WB && WB.scan) {
          await WB.scan(liveStage, { eager: true });
          await WB.scan(liveCode, { eager: true });
        }
      } catch (err) {
        liveNote.textContent = 'could not run this example';
        console.warn('[behaviors] live preview failed', err);
      }
    }

    // #666 — John: 'then add a summary. In this case "shows a red background"'.
    // Derived from what actually rendered, not hand-authored: 42 schemas x their
    // variants is ~200 strings that would rot the moment a theme or variant
    // changed, and a summary that disagrees with the pixels is worse than none.
    // Reads the real computed style of the upgraded element and names the
    // dominant visual difference.
    const HUES = [
      ['red', 0], ['orange', 30], ['yellow', 55], ['green', 100], ['teal', 165],
      ['blue', 210], ['indigo', 250], ['purple', 280], ['pink', 320], ['red', 350],
    ];
    function colourName(r, g, b) {
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const l = (max + min) / 2 / 255;
      // Lightness first: a near-black surface with a slight blue cast is "dark"
      // to a reader, not "blue". rgb(41,48,61) -- the default card background --
      // has just enough spread to compute a blue hue, and calling that blue is
      // simply wrong to anyone looking at it.
      if (l < 0.22) return 'dark';
      if (l > 0.9) return 'near-white';
      if (max - min < 18) return l > 0.75 ? 'light grey' : 'grey';
      let h = 0;
      const d = max - min;
      if (max === r) h = 60 * (((g - b) / d) % 6);
      else if (max === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
      if (h < 0) h += 360;
      let best = HUES[0];
      for (const entry of HUES) {
        if (Math.abs(h - entry[1]) < Math.abs(h - best[1])) best = entry;
      }
      return best[0];
    }
    function parseRgb(v) {
      const str = String(v);
      // Modern syntax: color(srgb 0.94 0.94 0.95 / 0.08). Chrome returns this
      // for theme colours defined with color-mix/relative colour, so an
      // rgba()-only parser silently returned null and every translucent
      // surface (glass) fell through to the border branch.
      const c = str.match(/color\(srgb\s+([^)]+)\)/i);
      if (c) {
        const parts = c[1].split('/');
        const rgb = parts[0].trim().split(/\s+/).map(Number);
        return {
          r: rgb[0] * 255, g: rgb[1] * 255, b: rgb[2] * 255,
          a: parts[1] === undefined ? 1 : parseFloat(parts[1]),
        };
      }
      const m = str.match(/rgba?\(([^)]+)\)/);
      if (!m) return null;
      const p = m[1].split(',').map((n) => parseFloat(n));
      return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
    }
    /** The schema's own description of this option -- what to expect to see. */
    function optionDescription(attr, prop) {
      if (!prop) return '';
      const sc = schemaByName.get(extensionMap[attr]);
      const def = sc && sc.properties && sc.properties[prop];
      return (def && def.description) ? def.description : '';
    }

    function summarise(el) {
      if (!el) return '';
      const cs = getComputedStyle(el);
      const bg = parseRgb(cs.backgroundColor);
      if (cs.backgroundImage && cs.backgroundImage !== 'none') return 'shows a gradient background';
      if (bg && bg.a > 0.85) return `shows a ${colourName(bg.r, bg.g, bg.b)} background`;
      if (bg && bg.a > 0.05) return `shows a translucent ${colourName(bg.r, bg.g, bg.b)} background`;
      const bw = parseFloat(cs.borderTopWidth) || 0;
      if (bw > 0) {
        const bc = parseRgb(cs.borderTopColor);
        return bc ? `shows a ${colourName(bc.r, bc.g, bc.b)} border` : 'shows a border';
      }
      if (cs.boxShadow && cs.boxShadow !== 'none') return 'shows a raised shadow';
      return 'no background or border — plain';
    }

    const eventsLog = document.getElementById('behaviors-live-events-log');
    const eventsHint = document.getElementById('behaviors-live-events-hint');

    // Events a behavior is likely to dispatch, plus the raw interaction that
    // triggered it. Captured on the STAGE so a listener is never attached to
    // the example itself -- attaching to the element could change what the
    // behavior sees (stopPropagation, once-handlers) and the panel must observe,
    // not participate.
    const WATCHED = ['click', 'change', 'input', 'submit', 'toggle'];
    let eventCount = 0;

    function logEvent(e) {
      const target = e.target instanceof Element ? e.target : null;
      const name = target ? target.tagName.toLowerCase() : '?';
      const cls = target && target.className && typeof target.className === 'string'
        ? '.' + target.className.trim().split(/\s+/)[0] : '';
      const li = document.createElement('li');
      li.className = 'behaviors-live__events-item';
      li.innerHTML =
        `<code class="behaviors-live__events-type">${e.type}</code>` +
        `<span class="behaviors-live__events-target">${name}${cls}</span>`;
      eventsLog.prepend(li);
      eventsEmpty.hidden = true;
      eventCount++;
      eventsHint.textContent = `${eventCount} event${eventCount === 1 ? '' : 's'}`;
      // Keep the last 12: a drag or a repeated toggle would otherwise grow the
      // panel without bound.
      while (eventsLog.children.length > 12) eventsLog.lastElementChild.remove();
    }

    // Attached ONCE, in the capture phase, on the stage container -- never on
    // the example itself. A listener on the element could change what the
    // behavior observes (a stopPropagation or a once-handler), and this panel
    // must watch without participating. Capture also means it still sees events
    // a behavior stops from bubbling.
    WATCHED.forEach((type) => liveStage.addEventListener(type, logEvent, true));

    let eventsSnippet = document.getElementById('behaviors-live-events-snippet');

    /** The wiring a reader would copy to handle this example's events. */
    function handlerSnippet(hostTag, token) {
      const sel = hostTag ? hostTag : '[' + token + ']';
      return [
        `const el = document.querySelector('${sel}');`,
        ``,
        `el.addEventListener('click', (e) => {`,
        `  console.log('clicked', e.target);`,
        `});`,
      ].join('\n');
    }

    const eventsEmpty = document.getElementById('behaviors-live-events-empty');

    async function resetEvents(hostTag, token) {
      eventsLog.innerHTML = '';
      eventCount = 0;
      eventsHint.textContent = 'interact with the example above';
      eventsEmpty.hidden = false;

      // Highlighted like the source panel, via the same x-behavior pre/code
      // pair -- a plain <pre> rendered the handler as unstyled text, and it
      // overflowed its box rather than wrapping. A FRESH host each time:
      // WB.inject() will not re-apply a behavior to an element that already
      // carries it (the same trap the doc panel hit).
      const fresh = document.createElement('div');
      fresh.id = 'behaviors-live-events-snippet';
      fresh.className = 'behaviors-live__events-code';
      eventsSnippet.replaceWith(fresh);
      eventsSnippet = fresh;

      const pre = document.createElement('pre');
      pre.setAttribute('x-behavior', 'pre');
      const code = document.createElement('code');
      code.setAttribute('x-behavior', 'code');
      code.dataset.language = 'javascript';
      code.textContent = handlerSnippet(hostTag, token);
      pre.appendChild(code);
      eventsSnippet.appendChild(pre);

      try {
        const mod = await import(siteRoot() + 'src/core/wb-lazy.js');
        const WB = mod.default || mod.WB || window.WB;
        if (WB && WB.scan) await WB.scan(eventsSnippet, { eager: true });
      } catch (err) {
        console.warn('[behaviors] could not highlight the handler snippet', err);
      }
    }

    async function showLive(token, variant, label, prop, isBool) {
      const raw = sourceFor(token);
      const src = raw ? withOption(raw, token, prop, variant, isBool) : raw;
      liveEl.hidden = false;
      // John: "Switch these two, behaivor first, variant 2nd".
      const shown = label || token;
      showDoc(extensionMap[token] || token.replace(/^x-/, ''));
      const optionText = variant
        ? (isBool ? prop : (prop && prop !== 'variant' ? `${prop}=${variant}` : variant))
        : '';
      liveToken.textContent = optionText ? `${shown} · ${optionText}` : shown;

      if (!src) {
        // John: "x-article shows nothing shouldn't it at least show a semantic
        // article?" -- yes. Rather than an empty box, synthesise a minimal
        // example and run it. The whole point of an x-* behavior is that ANY
        // element can carry it, so the only real question is which host to
        // demonstrate it on.
        const generated = generatedExample(token, variant, label, prop, isBool);
        liveNote.textContent = 'generated example — no demo on this page';
        liveCode.innerHTML = '';
        liveStage.innerHTML = generated;
        resetEvents(liveStage.firstElementChild && liveStage.firstElementChild.tagName.toLowerCase(), token);
        await renderSource(generated);
        const genDescribed = optionDescription(token, prop);
        const genSummary = genDescribed || summarise(liveStage.firstElementChild);
        liveNote.textContent = genSummary
          ? `generated — ${genSummary}`
          : 'generated example — no demo on this page';
        return;
      }

      liveNote.textContent = optionDescription(token, prop) || 'running live';
      liveStage.innerHTML = src;
      resetEvents(liveStage.firstElementChild && liveStage.firstElementChild.tagName.toLowerCase(), token);
      await renderSource(src);
      // After the upgrade, so the summary describes the UPGRADED element rather
      // than the bare markup it was built from.
      // Prefer the AUTHORED description of the option over a derived visual
      // guess -- John: "add description on what to expect to see". The schema
      // already says exactly that ("Show 15-band equalizer", "Start muted"),
      // and it is accurate for options with no visible surface change, where
      // summarise() can only ever report the host's background.
      const described = optionDescription(token, prop);
      const summary = described || summarise(liveStage.firstElementChild);
      if (summary) liveNote.textContent = summary;
    }

    // #666 — John: "allow the user to use the down arrow for each item shown in
    // list to render". Arrow keys walk the list and render each row as it is
    // reached, so a reader can hold Down and watch every variant in turn
    // without reaching for the mouse.
    //
    // aria-current marks the rendered row: clicking now SELECTS rather than
    // navigates, and without it a screen-reader user has no way to tell which
    // of 228 rows the panel is showing.
    function rowsInOrder() {
      return [...resultsEl.querySelectorAll('.behaviors-search-results__row')];
    }

    function selectRow(row, { focus = true } = {}) {
      if (!row) return;
      rowsInOrder().forEach((r) => r.removeAttribute('aria-current'));
      row.setAttribute('aria-current', 'true');
      // Scroll the LIST only, by hand. scrollIntoView({block:'nearest'}) still
      // scrolls ancestor scrollers when the row is off-screen at page level --
      // measured moving the page from 5541 to 341 while arrowing. The panel
      // exists so the page does not move (John: "don't scroll down"), so the
      // list's own scrollTop is adjusted directly and nothing else is touched.
      const listTop = resultsEl.scrollTop;
      const rowTop = row.offsetTop - resultsEl.offsetTop;
      const rowBottom = rowTop + row.offsetHeight;
      if (rowTop < listTop) resultsEl.scrollTop = rowTop;
      else if (rowBottom > listTop + resultsEl.clientHeight) {
        resultsEl.scrollTop = rowBottom - resultsEl.clientHeight;
      }
      if (focus) row.focus({ preventScroll: true });
      showLive(row.dataset.browseToken, row.dataset.variant || '', row.dataset.label || '',
               row.dataset.prop || '', row.dataset.boolean === '1');
    }

    function moveSelection(delta) {
      const rows = rowsInOrder();
      if (!rows.length) return;
      const current = resultsEl.querySelector('[aria-current="true"]');
      let i = current ? rows.indexOf(current) : -1;
      i = i < 0 ? (delta > 0 ? 0 : rows.length - 1) : i + delta;
      if (i < 0) i = 0;
      if (i > rows.length - 1) i = rows.length - 1;
      selectRow(rows[i]);
    }

    resultsEl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
      else if (e.key === 'Home') { e.preventDefault(); selectRow(rowsInOrder()[0]); }
      else if (e.key === 'End') { e.preventDefault(); const r = rowsInOrder(); selectRow(r[r.length - 1]); }
    });

    // Down from the search box drops into the list, so the keyboard path works
    // straight from typing without an intervening Tab.
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const rows = rowsInOrder();
        if (rows.length) selectRow(rows[0]);
      }
    });

    resultsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.behaviors-search-results__row');
      if (!btn) return;
      if (btn.dataset.browseToken) {
        // #664: render it, and LEAVE THE LIST ALONE. Filling the input would
        // re-run applyFilter and collapse the browse list to just this one
        // behavior, so picking the next one meant clearing the box first --
        // the list has to stay browsable while the panel changes beside it.
        selectRow(btn, { focus: false });
        return;
      }
      // #664: render it in the panel beside the list. Deliberately NO
      // scrollIntoView -- John: "don't scroll down to existing samples, just
      // show the code render in element next to dropdown". Jumping the page
      // away from the search box is the behaviour this panel replaces.
      const rowToken = btn.querySelector('.behaviors-search-results__token');
      if (rowToken) showLive(rowToken.textContent.trim().split(/\s+/)[0], btn.dataset.variant || '');
    });

    input.addEventListener('input', () => applyFilter(input.value));
    applyFilter('');
  })();
  </script>
