<!-- #766 -- this stylesheet used to be a plain relative href, which resolves
     against /pages/ when the fragment is opened directly and 404s. Injected
     from siteRoot() below instead, so one helper decides every path on this
     page rather than three of them agreeing by luck. -->

<div id="docs-hero" class="page__hero">
  <h1>📖 Documentation</h1>
  <p>Browse all documentation, guides, and research papers.</p>
  <!-- Owner decision: the docs hero carries a theme control, so a reader can
       compare themes without leaving the text. It is the SAME behavior as the
       header's #headerThemeControl, not a second implementation (#1018: no
       duplicate controls) -- both read and write the one stored theme, and
       themecontrol.js keeps every instance in sync live via wb:theme:change. -->
  <div x-themecontrol id="docsThemeControl"></div>
  <div class="docs-search-wrapper">
    <input type="search" id="docs-search" placeholder="Search documentation...">
    <span class="docs-search-icon">🔍</span>
  </div>
  <!-- The option marked `selected` is the order the list opens in. To change
       the site default, move `selected` to the other option. A reader's own
       pick is remembered (and kept in ?sort=) and wins over the default. -->
  <div class="docs-sort">
    <label for="docs-sort">Sort documents</label>
    <select id="docs-sort">
      <option value="newest" selected>Newest first</option>
      <option value="category">By category</option>
    </select>
  </div>
</div>

<!-- #1098: every behavior, in two sections. Rendered from tag-map union
     wb-lazy -- the same union pages/behaviors.html reads since #1056, because
     tag-map ALONE omits 39 working behaviours (breadcrumb, notify, copybutton,
     every animation effect). Neither the cross-reference (50 of 185) nor
     docs/behaviors/*.md (6 missing, 14 phantoms) can be the source. -->
<section id="behaviors-sections" class="page__section" hidden>
  <div id="behaviors-semantic" class="behaviors-section"></div>
  <div id="behaviors-extension" class="behaviors-section"></div>
</section>

<div id="docs-container" class="page__section">
  <div id="docs-loading" class="docs-loading">
    <span x-spinner label="Loading documentation"></span>
    <p>Loading documentation...</p>
  </div>
</div>

<script>
  /**
   * #766 -- John, opening /pages/docs.html directly: "Could not load
   * documentation index. Error: Failed to fetch manifest".
   *
   * This file is a FRAGMENT. Loaded through the SPA shell (/?page=docs) its
   * relative paths resolve against / and everything works, which is why this
   * went unnoticed. Opened on its own they resolve against /pages/ and all
   * four break -- the manifest fetch loudly, the stylesheet and every
   * generated link silently.
   *
   * Same helper pages/behaviors.html and pages/behaviors.html already use.
   * A bare /docs/... would fix localhost and break GitHub Pages, where the
   * site lives under /wb-starter/ -- this strips the fragment directory
   * instead of assuming the site sits at the domain root.
   */
  function siteRoot() {
    const stripped = location.pathname.replace(/(?:public|demos|pages|articles|tests\/fixtures)\/.*$/, '');
    return stripped.replace(/[^/]*$/, '');
  }

  (function loadDocsStylesheet() {
    const base = siteRoot() + 'src/styles/pages/docs.css';
    if (document.querySelector('link[href^="' + base + '"]')) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = base + '?v=3.0.91';
    document.head.appendChild(link);
  })();

  // Self-executing function (no module needed)
  (async function loadDocs() {
    const container = document.getElementById('docs-container');
    const searchInput = document.getElementById('docs-search');
    if (!container) return;
    
    let fullManifest = null;

    // Manifest titles and descriptions are TEXT that often names a tag
    // ("A bare <audio> gets a styled player"). Concatenated raw into
    // innerHTML, that became a real, src-less <audio> the audio behavior
    // then rejected with a runtime error -- and "<article> renders a card"
    // rendered an actual card. Escape them; they are never markup.
    const escapeText = (value) => String(value ?? '')
      .replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Sort order: ?sort= (so Back to Docs returns to it), then the reader's
    // last pick, then the <option selected> in the markup -- the site default.
    const sortSelect = document.getElementById('docs-sort');
    const SORT_KEY = 'x-docs-sort';
    const SORTS = ['newest', 'category'];
    function initialSort() {
      const fromUrl = new URLSearchParams(window.location.search).get('sort');
      if (SORTS.includes(fromUrl)) return fromUrl;
      let stored = null;
      try { stored = localStorage.getItem(SORT_KEY); } catch { /* blocked storage: use the default */ }
      if (SORTS.includes(stored)) return stored;
      const marked = sortSelect && [...sortSelect.options].find((o) => o.defaultSelected);
      return marked ? marked.value : 'newest';
    }
    if (sortSelect) sortSelect.value = initialSort();
    const currentSort = () => (sortSelect ? sortSelect.value : 'newest');

    // One card. `modified` (YYYY-MM-DD) is kept current in docs/manifest.json
    // by scripts/update-docs-manifest.js on every `npm start`.
    function cardHtml(entry, categoryName) {
      let href, target = '';
      if (entry.page) {
        // Page links (like research papers)
        href = siteRoot() + 'pages/' + entry.page + '.html';
        target = ' target="_blank"';
      } else {
        // Site-root-relative path (no leading slash) so it survives the
        // GitHub Pages sub-path base (/wb-starter/). doc-viewer resolves it
        // against its own computed site root. (#226)
        let filePath = entry.file;
        if (!/^https?:/i.test(filePath)) {
          filePath = filePath.replace(/^\/+/, '');
          if (!/^docs\//.test(filePath)) filePath = 'docs/' + filePath;
        }
        // Same tab (#1184): a new tab left the filtered, scrolled list
        // behind, so the viewer's Back to Docs could only open a fresh one.
        // Ctrl/middle-click still opens a tab for anyone who wants one.
        href = siteRoot() + 'public/doc-viewer.html?file=' + encodeURIComponent(filePath);
      }
      const meta = [categoryName, entry.modified ? 'Updated ' + entry.modified : '']
        .filter(Boolean).map(escapeText).join(' \u00b7 ');
      return '<a href="' + href + '" class="docs-card"' + target + '>' +
        '<h3 class="docs-card__title">' + escapeText(entry.title) + '</h3>' +
        '<p class="docs-card__desc">' + escapeText(entry.description) + '</p>' +
        (meta ? '<p class="docs-card__meta">' + meta + '</p>' : '') +
        '</a>';
    }

    function sectionHtml(icon, name, cards) {
      return '<div class="docs-category">' +
        '<h2 class="docs-category__title"><span>' + icon + '</span><span>' + name + '</span></h2>' +
        '<div class="docs-grid">' + cards + '</div>' +
        '</div>';
    }

    function renderDocs(manifestData) {
      if (!manifestData || !manifestData.categories) {
        container.innerHTML = '<p class="docs-empty">No documentation found.</p>';
        return;
      }

      // Skip empty categories after filtering
      const categories = manifestData.categories.filter((category) =>
        (category.docs && category.docs.length > 0) || (category.pages && category.pages.length > 0));

      let html = '';
      if (currentSort() === 'newest') {
        // One list across every category, most recently updated first; an
        // entry with no date sorts last. Each card names its category.
        const entries = [];
        for (const category of categories) {
          for (const entry of [...(category.docs || []), ...(category.pages || [])]) {
            entries.push({ entry, category });
          }
        }
        entries.sort((a, b) =>
          (b.entry.modified || '').localeCompare(a.entry.modified || '') ||
          String(a.entry.title).localeCompare(String(b.entry.title)));
        if (entries.length) {
          html = sectionHtml('🕐', 'Newest first',
            entries.map(({ entry, category }) => cardHtml(entry, category.name)).join(''));
        }
      } else {
        for (const category of categories) {
          const cards = [...(category.docs || []), ...(category.pages || [])]
            .map((entry) => cardHtml(entry, '')).join('');
          html += sectionHtml(category.icon, category.name, cards);
        }
      }

      if (!html) {
        container.innerHTML = '<div class="docs-empty docs-empty--search">' +
          '<p class="docs-empty__icon">🔍</p>' +
          '<p>No results found matching your search.</p>' +
          '</div>';
      } else {
        // Hover lift is `.docs-card:hover` in docs.css -- it used to be
        // mouseenter/mouseleave handlers writing card.style (#779).
        container.innerHTML = html;
      }
    }

    function filterManifest(query) {
      if (!query) return fullManifest;
      
      const lowerQuery = query.toLowerCase();
      const filteredCategories = fullManifest.categories.map(cat => {
        const filteredDocs = (cat.docs || []).filter(doc => 
          doc.title.toLowerCase().includes(lowerQuery) || 
          doc.description.toLowerCase().includes(lowerQuery)
        );
        
        const filteredPages = (cat.pages || []).filter(page => 
          page.title.toLowerCase().includes(lowerQuery) || 
          page.description.toLowerCase().includes(lowerQuery)
        );
        
        return {
          ...cat,
          docs: filteredDocs,
          pages: filteredPages
        };
      }).filter(cat => 
        (cat.docs && cat.docs.length > 0) || 
        (cat.pages && cat.pages.length > 0)
      );
      
      return { ...fullManifest, categories: filteredCategories };
    }
    
    try {
      const res = await fetch(siteRoot() + 'docs/manifest.json');
      if (!res.ok) throw new Error('Failed to fetch manifest');
      fullManifest = await res.json();
      
      // Check for query param
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q');
      
      if (query && searchInput) {
        searchInput.value = query;
        const filtered = filterManifest(query);
        renderDocs(filtered);
      } else {
        renderDocs(fullManifest);
      }

      // #1184: the reader's place in this list survives opening a doc. The
      // filter lives in the URL (?q=, which the block above already reads), and
      // the scroll offset of the panel that scrolls -- #siteBody, not the
      // window -- is saved as a doc is opened and put back when the list is
      // rebuilt with the same filter.
      const STATE_KEY = 'x-docs-list-state';
      const scroller = () => document.getElementById('siteBody') || document.scrollingElement;
      let saved = null;
      try { saved = JSON.parse(sessionStorage.getItem(STATE_KEY) || 'null'); } catch { /* blocked storage: nothing to restore */ }
      if (saved && (saved.q || '') === (query || '') && (saved.sort || currentSort()) === currentSort()) {
        // Put the card the reader opened back where it sat on screen, not a
        // raw offset: content above the list settles after this render, and
        // the browser's scroll anchoring then moved a restored 720px to 3076px
        // (1 run in 3). Re-placed each frame until the layout stops moving,
        // for at most ~2s, and never once the reader scrolls themselves.
        const el = scroller();
        let userMoved = false;
        const stop = () => { userMoved = true; };
        ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach((t) => el.addEventListener(t, stop, { once: true, passive: true }));
        const place = () => {
          const card = saved.href && [...container.querySelectorAll('a.docs-card')].find((a) => a.getAttribute('href') === saved.href);
          if (!card) { el.scrollTop = saved.scroll || 0; return; }
          el.scrollTop += card.getBoundingClientRect().top - el.getBoundingClientRect().top - (saved.offset || 0);
        };
        // The behavior sections above the list build asynchronously and add
        // ~2,350px about a second later, so placement waits for them
        // (data-built) before it can call the layout settled.
        // Waited on as an EVENT, not a frame count: the old loop gave up after
        // 300 frames (~5s), and on a loaded machine the sections finished after
        // that -- 2,350px landed above an already-placed list and the reader
        // came back 230px off (the 1.0 release gate, under full-suite load).
        const sections = document.getElementById('behaviors-sections');
        let frames = 0, still = 0, last = -1;
        const settle = () => {
          if (userMoved || frames++ > 300) return;
          place();
          still = el.scrollTop === last ? still + 1 : 0;
          last = el.scrollTop;
          if (still < 5) requestAnimationFrame(settle);
        };
        const whenSectionsBuilt = (then) => {
          if (!sections || sections.dataset.built) return then();
          place();
          const mo = new MutationObserver(() => {
            if (!sections.dataset.built) return;
            mo.disconnect();
            then();
          });
          mo.observe(sections, { attributes: true, attributeFilter: ['data-built'] });
        };
        whenSectionsBuilt(() => requestAnimationFrame(settle));
      }

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const filtered = filterManifest(e.target.value);
          renderDocs(filtered);
          const url = new URL(window.location.href);
          if (e.target.value) url.searchParams.set('q', e.target.value);
          else url.searchParams.delete('q');
          history.replaceState(history.state, '', url);
        });
      }

      if (sortSelect) {
        sortSelect.addEventListener('change', () => {
          renderDocs(filterManifest(searchInput ? searchInput.value : ''));
          try { localStorage.setItem(SORT_KEY, currentSort()); } catch { /* blocked storage: the pick lasts this visit */ }
          const url = new URL(window.location.href);
          url.searchParams.set('sort', currentSort());
          history.replaceState(history.state, '', url);
        });
      }

      container.addEventListener('click', (e) => {
        const card = e.target.closest && e.target.closest('a.docs-card');
        if (!card) return;
        const el = scroller();
        try {
          sessionStorage.setItem(STATE_KEY, JSON.stringify({
            q: searchInput ? searchInput.value : '',
            sort: currentSort(),
            scroll: el.scrollTop,
            href: card.getAttribute('href'),
            offset: card.getBoundingClientRect().top - el.getBoundingClientRect().top,
          }));
        } catch { /* blocked storage: Back still opens the filtered list */ }
      });
      
    } catch (err) {
      console.error('Failed to load docs manifest:', err);
      container.innerHTML = '<div class="docs-empty docs-empty--error">' +
        '<p>⚠️ Could not load documentation index.</p>' +
        '<p class="docs-empty__detail">Error: ' + err.message + '</p>' +
        '</div>';
    }
  })();
</script>

<script>
  /**
   * #1098 -- the behaviour sections.
   *
   * John: "I want to see every x-behavior -- we have many [that] don't have a
   * x-prefix", and "move the semantic and x-behaviors into 2 sections".
   *
   * SOURCE. tag-map.js merged with wb-lazy.js, exactly as pages/behaviors.html
   * does since #1056. tag-map ALONE reports 120 x- behaviours; the union
   * reports 159, because WB_LAZY_ONLY_ATTRIBUTES holds 39 that resolve at
   * runtime and appear nowhere in tag-map -- breadcrumb, notify, copybutton,
   * typewriter, and every animation effect. wb-lazy.js says so itself:
   * "anything reading tag-map alone reports an incomplete behavior list."
   *
   * NOT from docs/behavior-cross-reference.md (covers 50 of 185, #1099) and
   * NOT from docs/behaviors/*.md (6 behaviours have no file, and 14 files --
   * aside, blockquote, ol, ul, time ... -- describe nothing that is a
   * behaviour, so a list built from the folder renders phantom rows).
   *
   * The lazy import may fail on its own: an incomplete list is bad, an empty
   * one is worse.
   */
  (async function () {
    const wrap = document.getElementById('behaviors-sections');
    if (!wrap) return;

    function siteRootFor() {
      const stripped = location.pathname.replace(/(?:public|demos|pages|articles|tests\/fixtures)\/.*$/, '');
      return stripped.replace(/[^/]*$/, '');
    }

    const mods = await Promise.all([
      import(siteRootFor() + 'src/core/tag-map.js'),
      import(siteRootFor() + 'src/core/wb-lazy.js').catch(function () { return {}; }),
    ]).catch(function () { return [null, null]; });

    const tagMod = mods[0];
    const lazyMod = mods[1] || {};
    if (!tagMod) { wrap.dataset.built = '1'; return; }

    // Keep the attribute -> BEHAVIOUR mapping, not just the attribute names.
    // A doc is named after the behaviour, which need not match the attribute:
    // x-drawer-layout maps to `drawerLayout`. Looking a doc up by ATTRIBUTE
    // name reported it as undocumented when drawerLayout.md was right there.
    const extMap = Object.assign(
      {},
      lazyMod.WB_LAZY_ONLY_ATTRIBUTES || {},
      tagMod.extensionMap || {}
    );
    const natMap = tagMod.nativeMap || {};
    const extension = Object.keys(extMap).sort();
    const semantic = Object.keys(natMap).sort();
    const behaviourOf = function (name) {
      const v = Object.prototype.hasOwnProperty.call(extMap, name) ? extMap[name] : natMap[name];
      return typeof v === 'string' ? v : null;
    };

    // Which behaviours have a doc. A miss is MARKED, never hidden -- absence
    // used to be invisible, so a missing doc read as a missing behaviour.
    const documented = new Set();
    try {
      const res = await fetch(siteRootFor() + 'data/docs-manifest.json');
      if (res.ok) {
        const man = await res.json();
        for (const f of man.files || []) {
          const m = String(f.path || f.file || '').match(/behaviors\/([^/]+)\.md$/);
          if (m) { documented.add(m[1]); }
        }
      }
    } catch (e) { /* no manifest -- chips simply render without a doc link */ }

    function docHref(name) {
      // Behaviour name first, then the attribute, then the attribute without its
      // x- prefix. With behaviour-name resolution all 185 behaviours have a doc;
      // attribute-name-only resolution wrongly reported 2 as missing.
      const candidates = [behaviourOf(name), name, name.replace(/^x-/, '')];
      for (const base of candidates) {
        if (base && documented.has(base)) {
          return siteRootFor() + 'public/doc-viewer.html?file='
            + encodeURIComponent('docs/behaviors/' + base + '.md');
        }
      }
      return null;
    }

    function chip(name) {
      const href = docHref(name);
      const li = document.createElement('li');
      li.className = 'behaviors-grid__item';

      const el = document.createElement(href ? 'a' : 'span');
      el.className = 'behavior-chip' + (href ? '' : ' behavior-chip--undocumented');
      if (href) { el.href = href; el.target = '_blank'; el.rel = 'noopener'; }

      const n = document.createElement('span');
      n.className = 'behavior-chip__name';
      n.textContent = name;
      el.appendChild(n);

      if (!href) {
        const note = document.createElement('span');
        note.className = 'behavior-chip__note';
        note.textContent = 'no doc yet';
        el.appendChild(note);
      }

      li.appendChild(el);
      li.dataset.search = name.toLowerCase();
      return li;
    }

    function section(host, title, lede, names) {
      host.textContent = '';

      const head = document.createElement('div');
      head.className = 'behaviors-section__head';
      const h2 = document.createElement('h2');
      h2.textContent = title;
      const count = document.createElement('span');
      count.className = 'behaviors-section__count';
      count.textContent = names.length + ' behaviors';
      head.appendChild(h2);
      head.appendChild(count);

      const p = document.createElement('p');
      p.className = 'behaviors-section__lede';
      p.textContent = lede;

      const ul = document.createElement('ul');
      ul.className = 'behaviors-grid';
      for (const n of names) { ul.appendChild(chip(n)); }

      host.appendChild(head);
      host.appendChild(p);
      host.appendChild(ul);
      return ul;
    }

    const semanticList = section(
      document.getElementById('behaviors-semantic'),
      'Semantic behaviors',
      'No prefix - the tag is the behavior. An <article> IS a card; you add nothing.',
      semantic
    );

    const extensionList = section(
      document.getElementById('behaviors-extension'),
      'x- behaviors',
      'Added as an attribute on any element.',
      extension
    );

    wrap.hidden = false;

    // Share the page's existing search box rather than adding a second one.
    const search = document.getElementById('docs-search');
    if (search) {
      const applyFilter = function () {
        const term = search.value.trim().toLowerCase();
        for (const list of [semanticList, extensionList]) {
          let shown = 0;
          for (const li of list.children) {
            const hit = !term || li.dataset.search.indexOf(term) !== -1;
            li.hidden = !hit;
            if (hit) { shown++; }
          }
          list.closest('.behaviors-section').hidden = shown === 0;
        }
      };
      search.addEventListener('input', applyFilter);
      // #1184: a filter already in the box (?q=, or Back to Docs) applies to
      // these sections too. They only listened for typing, so returning to a
      // filtered list showed every behavior chip unfiltered above it.
      applyFilter();
    }
    wrap.dataset.built = '1';
  })();
</script>
