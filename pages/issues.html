
<script>
  /* A page fragment opened on its own resolves its CSS and modules relative to
     /pages/ instead of the site root, so it renders unstyled and never
     finishes loading. These files are fetched and injected by index.html;
     opened directly they are simply the wrong URL. Redirect to the route that
     works. server.js wraps them automatically, so this only fires on a static
     host. */
  (function () {
    var m = location.pathname.match(/\/pages\/([a-z0-9-]+)\.html$/i);
    if (!m) return;                       // injected by the SPA: nothing to do
    var root = location.pathname.slice(0, m.index + 1);
    location.replace(root + '?page=' + m[1] + location.search.replace(/^\?/, '&') + location.hash);
  })();
</script>
<link rel="stylesheet" href="src/styles/pages/issues.css?v=4.0.2">


<div class="page__hero">
  <h1>🐛 Issues</h1>
  <p>Live from <a href="https://github.com/CieloVistaSoftware/wb-starter/issues" target="_blank" rel="noopener">GitHub</a> — open and closed, including the full issue body.</p>
</div>

<h2 class="sr-only">Filter and search</h2>
<div class="issues-toolbar">
  <div class="issues-tabs" role="tablist" aria-label="Filter issues by state">
    <button type="button" class="issues-tab issues-tab--active" data-state="open" x-ripple>Open</button>
    <button type="button" class="issues-tab" data-state="closed" x-ripple>Closed</button>
    <button type="button" class="issues-tab" data-state="all" x-ripple>All</button>
    <button type="button" class="issues-tab" data-state="in-progress" x-ripple>In Progress</button>
  </div>
  <!-- #1046 — John: "add a button work completed when pressed i can see what
       your done". The panel below is collapsed until this is pressed, so the
       page opens on the issues themselves and the account of work is one
       click away rather than always taking up the top of the screen. -->
  <button type="button" id="activity-toggle" class="issues-workdone"
          aria-expanded="false" aria-controls="activity" x-ripple>Work completed</button>
  <span id="issues-summary" class="issues-summary"></span>
  <span id="issues-active" class="issues-summary" aria-live="polite">Current Active: 0</span>
  <!-- John: "add a count in header of the numbers of each severity". Counts
       follow the CURRENT filter, so switching to Closed answers "how many P1s
       have we actually finished" rather than restating the same totals. -->
  <span id="issues-severity" class="issues-severity" aria-live="polite"></span>
  <input type="search" id="issues-search" class="issues-search" placeholder="Filter by title or number…">
</div>

<!-- #1046 — John: "I want an account of all work done within last 24hrs with links."
     The table below answers "what state is everything in". It cannot answer
     "what happened today": closing an issue moves it OUT of the open list
     rather than into a record of the work, so a day with 15 closures renders
     the same as a day with none. This is that record. -->
<details id="activity" class="activity">
  <!-- The x-details behavior REBUILDS this summary, replacing its children with
       its own label/icon spans — so an id placed in here is destroyed and any
       later update silently no-ops. Counts therefore live in the BODY, whose
       ids it leaves alone, and the headline lives on the button. -->
  <summary class="activity__summary">Work done</summary>
  <div class="activity__body">
    <p id="activity-counts" class="activity__counts">loading…</p>
    <p id="activity-empty" class="activity__empty" hidden>Nothing recorded in this window.</p>
    <div class="activity__cols">
      <section class="activity__col">
        <h3 class="activity__heading">Closed <span id="activity-closed-n" class="activity__n"></span></h3>
        <ul id="activity-closed" class="activity__list"></ul>
      </section>
      <section class="activity__col">
        <h3 class="activity__heading">Opened <span id="activity-opened-n" class="activity__n"></span></h3>
        <ul id="activity-opened" class="activity__list"></ul>
      </section>
      <section class="activity__col">
        <h3 class="activity__heading">Commits <span id="activity-commits-n" class="activity__n"></span></h3>
        <ul id="activity-commits" class="activity__list"></ul>
      </section>
    </div>
  </div>
</details>

<h2 class="sr-only">Issues</h2>
<p id="issues-status" class="issues-status">Loading issues…</p>

<!-- John: "list the items by priority, make it a table, add columns for fields
     in the issue, all sortable... when issue viewer fills in data it should all
     be listed in severity order."

     A plain <table sortable>: <table> auto-injects the table behavior
     (tag-map.js nativeMap), and `sortable` is its own attribute, so the column
     sorting is the framework's — the same code #1011 taught to sort dates and
     versions properly. Writing a private sort here would mean this page could
     disagree with every other table on the site.

     Rows are rebuilt by render(); the behavior sorts whatever rows it finds, so
     filtering and sorting do not fight. The default order is set in the DATA,
     not by the behavior: severity first, newest first within a severity. -->
<table id="issues-table" class="issues-table" sortable striped hoverable>
  <thead>
    <tr>
      <th scope="col">Priority</th>
      <th scope="col">#</th>
      <th scope="col">Title</th>
      <th scope="col">Kind</th>
      <th scope="col">State</th>
      <th scope="col">Labels</th>
      <th scope="col">Updated</th>
    </tr>
  </thead>
  <tbody id="issues-tbody"></tbody>
</table>




<script>
(function () {
  const REPO = 'CieloVistaSoftware/wb-starter';
  const tbodyEl = document.getElementById('issues-tbody');
  const tableEl = document.getElementById('issues-table');
  const statusEl = document.getElementById('issues-status');
  const summaryEl = document.getElementById('issues-summary');
  const activeEl = document.getElementById('issues-active');
  const searchEl = document.getElementById('issues-search');
  const tabs = Array.from(document.querySelectorAll('.issues-tab'));
  let allIssues = [];
  let currentState = 'open';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

  // John: "When these buttons are clicked add a count of those issues and
  // the date ranges here." Uses createdAt for open issues (when they were
  // opened) and closedAt for closed ones (when they were resolved) -- for
  // "all", spans the full createdAt range since that's the one date every
  // issue has.
  const severityEl = document.getElementById('issues-severity');

  /**
   * Per-severity counts for whatever is currently on screen (#1046 follow-up).
   *
   * priorityOf() returns 9 for an unlabelled issue, which is deliberate — it
   * sorts them last — so they are reported as "unrated" rather than silently
   * folded into P5 or dropped, since an unrated issue is a real gap.
   */
  function updateSeverity(filtered) {
    if (!severityEl) return;
    if (!filtered.length) { severityEl.textContent = ''; return; }
    const counts = new Map();
    for (const issue of filtered) {
      const p = priorityOf(issue);
      counts.set(p, (counts.get(p) || 0) + 1);
    }
    const parts = [];
    for (let p = 1; p <= 5; p++) {
      const n = counts.get(p) || 0;
      if (!n) continue;
      parts.push(`<span class="sev sev--${p}"><b>P${p}</b> ${n}</span>`);
    }
    const unrated = counts.get(9) || 0;
    if (unrated) parts.push(`<span class="sev sev--none"><b>unrated</b> ${unrated}</span>`);
    severityEl.innerHTML = parts.join('');
  }

  function updateSummary(filtered) {
    if (!filtered.length) {
      summaryEl.textContent = '';
      return;
    }
    const dateField = currentState === 'closed' ? 'closed_at' : 'created_at';
    const dates = filtered.map((i) => new Date(i[dateField] || i.created_at).getTime()).sort((a, b) => a - b);
    const oldest = fmtDate(dates[0]);
    const newest = fmtDate(dates[dates.length - 1]);
    const range = oldest === newest ? oldest : `${oldest} – ${newest}`;
    const noun = filtered.length === 1 ? 'issue' : 'issues';
    summaryEl.textContent = `${filtered.length} ${noun} · ${range}`;
  }

  // An issue counts as "being worked on" when it carries the explicit
  // status:in-progress label OR priority:1 (John's convention for flagging
  // active work) -- same detection the VS Code Issue Viewer uses
  // (src/shared/github-issues-view.ts), so both surfaces agree.
  function isInProgress(issue) {
    return (issue.labels || []).some((label) => {
      const name = String(label.name || '').trim().toLowerCase();
      return name === 'status:in-progress' || name === 'priority:1';
    });
  }

  function updateActiveCount() {
    const activeCount = allIssues.filter((issue) => issue.state === 'open' && isInProgress(issue)).length;
    activeEl.textContent = `Current Active: ${activeCount}`;
  }

  // ── fields read off the issue ─────────────────────────────────────────────
  const PRIORITY = /^priority:([1-5])$/;

  /** 1-5 from the label; 9 for unrated, so "no rating" sorts last, visibly. */
  function priorityOf(issue) {
    for (const l of issue.labels || []) {
      const m = PRIORITY.exec(l.name || '');
      if (m) return Number(m[1]);
    }
    return 9;
  }

  /**
   * One field out of the issue's Signature block.
   *
   * [^\S\n], not \s: \s matches the newline, so an EMPTY `test:` swallows the
   * `fix:` line under it and reports THAT as the value. Same trap that made 11
   * of 13 priority-1 issues look covered when 3 were.
   */
  function signatureField(body, field) {
    const m = (body || '').match(new RegExp('^' + field + ':[^\\S\\n]*(\\S.*?)[^\\S\\n]*$', 'm'));
    if (!m) return '';
    const v = m[1].replace(/^["']|["']$/g, '').trim();
    return v === 'null' ? '' : v;
  }

  // The verification state lives ON the issue now — a state:* label written by
  // scripts/mark-issue-verification.mjs, alongside a `verified:` line in the
  // Signature block. The label is what this reads (it is already in the payload);
  // the line supplies the detail for the tooltip.
  //
  //   ready / stale / committed / pushed      the fix exists and is travelling
  //   failing / regressed                      its test says otherwise
  //   needs-test / test-missing / unproven     nothing can prove it
  //   triaged / no-signature                   not started
  //   closed-verified / closed-unverified      how it ended
  // Written onto each issue by scripts/issue-state.mjs, all thirteen derived
  // from evidence: the Signature block, the last test run, git history and this
  // working tree.
  // Lifecycle order, most actionable first. The rank is what the column sorts
  // by, so ordering follows the lifecycle rather than the alphabet.
  const STATE_RANK = {
    ready: 1, stale: 2, committed: 3, pushed: 4,
    failing: 5, regressed: 6, 'needs-test': 7, 'test-missing': 8, unproven: 9,
    triaged: 10, 'no-signature': 11,
    'closed-verified': 12, 'closed-unverified': 13,
  };
  const STATE_GLYPH = {
    ready: '✓ ready', stale: '~ stale', committed: '⬆ committed', pushed: '⇧ pushed',
    failing: '✗ failing', regressed: '✗ regressed', 'needs-test': '! needs test',
    'test-missing': '! test missing', unproven: '? unproven',
    triaged: '· triaged', 'no-signature': '· no signature',
    'closed-verified': '✓ closed', 'closed-unverified': '· closed',
  };

  function verifyStateOf(issue) {
    // The `verified:` line in the Signature block first: the marker writes the
    // body and the label in the same pass, but the body arrives with the issue
    // payload while a label can lag, so this shows the true state soonest.
    const fromBody = /^([a-z-]+)/.exec(signatureField(issue.body, 'verified') || '');
    if (fromBody && STATE_RANK[fromBody[1]]) return fromBody[1];

    for (const l of issue.labels || []) {
      const m = /^state:(.+)$/.exec(l.name || '');
      if (m && STATE_RANK[m[1]]) return m[1];
    }
    // No state label yet (the marker has not reached it): say so rather than
    // guessing a lifecycle position from the body alone.
    return issue.state === 'closed' ? 'closed-unverified' : 'triaged';
  }

  const stateOf = (issue) =>
    issue.state === 'open' && isInProgress(issue) ? 'in-progress' : issue.state;

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    const filtered = allIssues.filter((issue) => {
      // "in-progress" isn't a real GitHub issue.state (only open/closed exist
      // there) -- it's the same derived state as updateActiveCount()'s
      // "Current Active" number, so this tab and that count always agree.
      if (currentState === 'in-progress') {
        if (!(issue.state === 'open' && isInProgress(issue))) return false;
      } else if (currentState !== 'all' && issue.state !== currentState) {
        return false;
      }
      if (!q) return true;
      return issue.title.toLowerCase().includes(q) || String(issue.number).includes(q);
    });

    // READY FIRST, then severity, then newest. John: "all issues that are ready
    // should show at the top" — what is finished and provable is what a reader
    // acts on now; severity orders everything behind it. The sortable columns
    // let them re-order at will; this is only what they see on arrival.
    filtered.sort((a, b) =>
      (STATE_RANK[verifyStateOf(a)] === 1 ? 0 : 1) - (STATE_RANK[verifyStateOf(b)] === 1 ? 0 : 1)
      || priorityOf(a) - priorityOf(b)
      || b.number - a.number);

    updateSummary(filtered);
    updateSeverity(filtered);
    updateActiveCount();

    if (!filtered.length) {
      tbodyEl.innerHTML = '';
      tableEl.hidden = true;
      statusEl.textContent = allIssues.length ? 'No issues match this filter.' : 'No issues found.';
      statusEl.style.display = '';
      return;
    }
    statusEl.style.display = 'none';
    tableEl.hidden = false;

    tbodyEl.innerHTML = filtered.map((issue) => {
      const p = priorityOf(issue);
      const rowState = stateOf(issue);
      const kind = signatureField(issue.body, 'kind');
      // One state column, not two. The open/closed column said nothing the
      // derived state does not: closed-verified and closed-unverified already
      // carry "closed", and everything else is open by definition. The tabs
      // still filter on the GitHub state; it just no longer needs a column.
      const vstate = verifyStateOf(issue);
      const vdetail = signatureField(issue.body, 'verified') || signatureField(issue.body, 'test') || 'no test named';
      const labels = (issue.labels || [])
        .map((l) => l.name)
        .filter((n) => !PRIORITY.test(n) && !n.startsWith('state:'))
        .map((n) => `<span class="issue-label">${escapeHtml(n)}</span>`)
        .join(' ');
      return `
        <tr class="issues-row issues-row--p${p}" data-number="${issue.number}" tabindex="0">
          <td class="issues-cell--priority" sort-value="${p}"><span class="issue-priority issue-priority--${p}">${p === 9 ? '—' : p}</span></td>
          <td>#${issue.number}</td>
          <td class="issues-cell--title">${escapeHtml(issue.title)}</td>
          <td>${escapeHtml(kind) || '—'}</td>
          <td class="issues-cell--state" sort-value="${STATE_RANK[vstate]}" title="${escapeHtml(vdetail)}"><span class="issue-verify issue-verify--${vstate}">${STATE_GLYPH[vstate]}</span></td>
          <td class="issues-cell--labels">${labels}</td>
          <td>${fmtDate(issue.updated_at || issue.created_at)}</td>
        </tr>`;
    }).join('');

    const byNumber = new Map(filtered.map((i) => [String(i.number), i]));

    const COLUMNS = tableEl.querySelectorAll('thead th').length;

    /** Close every open expander. Returns how many were open. */
    function collapseAll() {
      const open = tbodyEl.querySelectorAll('.issues-expander');
      for (const el of open) el.remove();
      for (const r of tbodyEl.querySelectorAll('.issues-row--open')) r.classList.remove('issues-row--open');
      return open.length;
    }

    /**
     * John: "when clicking on an issue use an expander open to show it right there."
     *
     * The body opens in a row directly beneath the one clicked rather than in a
     * panel elsewhere, so the reader's eye does not travel and the issue stays
     * next to its own priority and state.
     */
    async function toggle(row) {
      const issue = byNumber.get(row.dataset.number);
      if (!issue) return;

      const wasOpen = row.classList.contains('issues-row--open');
      collapseAll();
      if (wasOpen) return;                    // clicking the open row closes it

      row.classList.add('issues-row--open');

      const tr = document.createElement('tr');
      tr.className = 'issues-expander';
      const td = document.createElement('td');
      td.colSpan = COLUMNS;
      const body = document.createElement('div');
      body.className = 'issues-expander__body';
      td.appendChild(body);
      tr.appendChild(td);
      row.after(tr);

      // .textContent, not innerHTML: mdhtml.js decodes-then-parses (its "code
      // samples are frequently written HTML-escaped" handling), so raw markdown
      // assigned as HTML would come out double-escaped.
      body.textContent = issue.body || '_No description provided._';

      if (window.WB) {
        // autoLiveRender: false -- issue bodies are arbitrary author text, not
        // curated docs. Without it, a body that merely ILLUSTRATES an x-*
        // example (like #527, describing this exact bug) gets promoted into a
        // real, live, fetching element on this page.
        await window.WB.inject(body, 'mdhtml', { autoLiveRender: false });
      }
    }

    tbodyEl.querySelectorAll('.issues-row').forEach((row) => {
      row.addEventListener('click', () => toggle(row));
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(row); }
      });
    });

    // Sorting walks every <tr> in the tbody, so an open expander would be sorted
    // as though it were an issue and torn away from the row it belongs to.
    // Capture phase, so it collapses BEFORE the table behavior's own handler.
    tableEl.querySelectorAll('thead th').forEach((th) => {
      th.addEventListener('click', collapseAll, true);
    });

    // Re-apply the table behavior to the rebuilt rows. Guarded on the class the
    // behavior itself adds, so a rebuild does not stack a second sort handler
    // on the same table -- the defect #1022 documents for codecontrol.
    if (window.WB && !tableEl.classList.contains('x-table')) {
      window.WB.inject(tableEl, 'table', {});
    }
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      tabs.forEach((t) => t.classList.remove('issues-tab--active'));
      tab.classList.add('issues-tab--active');
      currentState = tab.dataset.state;
      render();
    });
  });
  searchEl.addEventListener('input', render);

  // ── cache ─────────────────────────────────────────────────────────────────
  //
  // John: "always keep the last issues list in cache to avoid this: Could not
  // load issues: GitHub API responded 403... if that message is seen then just
  // show the cache for the next hour."
  //
  // Unauthenticated GitHub allows 60 requests an hour per IP, and this page
  // spends 3-4 of them per load (100 issues a page). A few reloads, or any other
  // tool on the same IP, and the page went blank with an error — throwing away a
  // list it had successfully fetched minutes earlier.
  //
  // So: every successful load is cached, a 403 shows the cache instead of an
  // error, and the API is not touched again until the limit resets. Never
  // silently: the banner says the list is cached and how old it is, because a
  // stale list presented as live is worse than an error.
  const CACHE_KEY = 'wb-issues-cache-v1';
  const LIMIT_KEY = 'wb-issues-ratelimited-until';

  function saveCache(issues) {
    const payload = { fetchedAt: Date.now(), issues };
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
    } catch (err) {
      // Bodies are most of the weight and the table does not need them; a
      // truncated cache still beats an error page. The expander says so when it
      // has nothing to show.
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          fetchedAt: Date.now(),
          bodiesDropped: true,
          issues: issues.map(({ body, ...rest }) => rest),
        }));
      } catch (err2) {
        console.warn('[issues] could not cache the list:', err2.message);
      }
    }
  }

  function loadCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); }
    catch { return null; }
  }

  const rateLimitedUntil = () => Number(localStorage.getItem(LIMIT_KEY) || 0);

  function noteRateLimit(res) {
    // GitHub says exactly when the window resets; use that rather than guessing
    // an hour, and fall back to an hour when the header is absent.
    const reset = Number(res && res.headers && res.headers.get('x-ratelimit-reset'));
    const until = Number.isFinite(reset) && reset > 0 ? reset * 1000 : Date.now() + 60 * 60 * 1000;
    try { localStorage.setItem(LIMIT_KEY, String(until)); } catch { /* private mode */ }
    return until;
  }

  const fmtTime = (ms) => new Date(ms).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

  function showCached(cache, until) {
    allIssues = cache.issues || [];
    const age = Math.round((Date.now() - cache.fetchedAt) / 60000);
    render();
    statusEl.textContent =
      `Showing the cached list — fetched ${age} minute${age === 1 ? '' : 's'} ago`
      + (until ? `. GitHub's rate limit resets at ${fmtTime(until)}; live data resumes then.` : '.')
      + (cache.bodiesDropped ? ' Issue bodies were too large to cache, so expanders are empty until the next live load.' : '');
    statusEl.style.display = '';
  }

  async function load() {
    // Inside a known rate-limit window there is no point spending a request to
    // be told so again.
    const until = rateLimitedUntil();
    const cache = loadCache();
    if (until > Date.now() && cache) {
      showCached(cache, until);
      return;
    }

    try {
      // #1045: try the SERVER first. The dev server proxies through an
      // authenticated `gh` (5,000/hour, not 60) and keeps a disk cache, so a
      // first-ever visit works even when this IP has already spent its
      // unauthenticated budget -- which is precisely when localStorage is empty
      // and the old code had nothing to fall back to.
      //
      // Silent, deliberate fallback: the deployed GitHub Pages site is STATIC
      // and has no server, so /api/issues 404s there and the direct call below
      // is the only route. A missing proxy is not an error condition.
      try {
        statusEl.textContent = 'Loading issues…';
        statusEl.style.display = '';
        const proxied = await fetch('/api/issues');
        if (proxied.ok) {
          const payload = await proxied.json();
          if (Array.isArray(payload.issues) && payload.issues.length) {
            allIssues = payload.issues.filter((i) => !i.pull_request);
            try { localStorage.removeItem(LIMIT_KEY); } catch { /* private mode */ }
            saveCache(allIssues);
            render();
            if (payload.source === 'stale-cache') {
              const mins = Math.round((payload.ageMs || 0) / 60000);
              statusEl.textContent = `Showing a cached list from the server — ${mins} minute${mins === 1 ? '' : 's'} old (live fetch failed).`;
              statusEl.style.display = '';
            }
            return;
          }
        }
      } catch { /* no server here — fall through to the public API */ }

      // Public, unauthenticated GitHub REST API -- works identically on the
      // deployed GitHub Pages site (static hosting, no server-side proxy
      // possible) and in local dev. A single per_page=100 request silently
      // truncated once the repo passed 100 issues (John: "why does issue
      // viewer counts differ from ?page=issues" -- this page was missing
      // every issue older than the 100 most recent). Page through until a
      // response comes back short of per_page, the standard "last page"
      // signal -- capped at 10 pages (1000 issues) as a runaway backstop.
      const perPage = 100;
      let page = 1;
      let all = [];
      while (page <= 10) {
        statusEl.textContent = `Loading issues… (${all.length} so far)`;
        statusEl.style.display = '';
        const res = await fetch(`https://api.github.com/repos/${REPO}/issues?state=all&per_page=${perPage}&page=${page}&sort=created&direction=desc`);
        if (res.status === 403 || res.status === 429) {
          const resetAt = noteRateLimit(res);
          if (cache) { showCached(cache, resetAt); return; }
          throw new Error(`GitHub API responded ${res.status} and nothing is cached yet`);
        }
        if (!res.ok) throw new Error(`GitHub API responded ${res.status}`);
        const batch = await res.json();
        all = all.concat(batch);
        if (batch.length < perPage) break; // last page
        page++;
      }
      // The /issues endpoint also returns pull requests -- exclude them.
      allIssues = all.filter((i) => !i.pull_request);
      try { localStorage.removeItem(LIMIT_KEY); } catch { /* private mode */ }
      saveCache(allIssues);
      render();
    } catch (err) {
      // Any other failure (offline, DNS, a 5xx) falls back to the cache too —
      // the reason for showing it is that the live list is unavailable, not
      // which particular way it was unavailable.
      if (cache) { showCached(cache, rateLimitedUntil() || 0); return; }
      statusEl.textContent = 'Could not load issues: ' + err.message
        + ' (GitHub API rate limits unauthenticated requests to 60/hour per IP), and nothing is cached yet.';
      statusEl.style.display = '';
    }
  }

  // ── #1046: the account of work done ────────────────────────────────────────
  //
  // Served by /api/activity, which reads git log and an AUTHENTICATED gh — so it
  // costs nothing against the 60/hour unauthenticated budget the list itself
  // used to burn (#1045). On the static Pages deploy there is no server, so the
  // panel simply stays hidden rather than erroring: an absent proxy is not a
  // failure, it is a different deployment.
  async function loadActivity(hours = 24) {
    const panel = document.getElementById('activity');
    const countsEl = document.getElementById('activity-counts');
    if (!panel || !countsEl) return;

    let data;
    try {
      const res = await fetch(`/api/activity?hours=${hours}`);
      if (!res.ok) throw new Error(String(res.status));
      data = await res.json();
    } catch {
      panel.hidden = true;
      return;
    }

    const c = data.counts || { closed: 0, opened: 0, commits: 0 };

    // The net, stated rather than left to arithmetic. An issue opened AND closed
    // inside the window shows in both columns without ever having sat in the
    // backlog, so `closed - opened` is right only by coincidence — say what
    // actually moved instead.
    const net = c.netOpen;
    let netText = '';
    if (typeof net === 'number') {
      const same = (c.openedAndClosedSameWindow || []).length;
      netText = net < 0
        ? ` · net ${Math.abs(net)} fewer open`
        : net > 0 ? ` · net ${net} more open` : ' · net unchanged';
      if (same) netText += ` (${same} opened and closed within the window)`;
    }

    countsEl.textContent =
      `${c.closed} closed · ${c.opened} opened · ${c.commits} commits · last ${data.hours}h${netText}`;

    // Headline on the button itself, so the number is readable while collapsed —
    // the summary cannot hold it (see the markup note above).
    const toggle = document.getElementById('activity-toggle');
    if (toggle) {
      const net = typeof c.netOpen === 'number'
        ? (c.netOpen < 0 ? `, net ${Math.abs(c.netOpen)} fewer open` : c.netOpen > 0 ? `, net ${c.netOpen} more open` : '')
        : '';
      toggle.dataset.headline = `${c.closed} closed${net}`;
      if (!document.getElementById('activity').open) {
        toggle.textContent = `Work completed · ${c.closed} closed${net}`;
      }
    }

    const when = (iso) => {
      const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 60) return `${mins}m ago`;
      const h = Math.round(mins / 60);
      return h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
    };

    const issueItems = (rows) => rows.map((r) => {
      // The evidence, inline: which commits in this window name this issue.
      const shas = (r.commits || []).map((sha) =>
        `<a class="activity__sha" href="https://github.com/${REPO}/commit/${escapeHtml(sha)}"`
        + ` target="_blank" rel="noopener">${escapeHtml(sha)}</a>`).join(' ');
      const pri = r.priority ? `<span class="activity__pri">${escapeHtml(r.priority.replace('priority:', 'P'))}</span>` : '';
      return `<li class="activity__item">`
        + `<a class="activity__num" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">#${escapeHtml(r.number)}</a>`
        + `${pri} <span class="activity__text">${escapeHtml(r.title)}</span>`
        + `<span class="activity__meta">${escapeHtml(when(r.at))}${shas ? ' · ' + shas : ''}</span>`
        + `</li>`;
    }).join('');

    const commitItems = (rows) => rows.map((r) => {
      const cited = (r.issues || []).map((n) =>
        `<a href="https://github.com/${REPO}/issues/${n}" target="_blank" rel="noopener">#${n}</a>`).join(' ');
      return `<li class="activity__item">`
        + `<a class="activity__sha" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.sha)}</a> `
        + `<span class="activity__text">${escapeHtml(r.subject)}</span>`
        + `<span class="activity__meta">${escapeHtml(when(r.when))}${cited ? ' · ' + cited : ''}</span>`
        + `</li>`;
    }).join('');

    document.getElementById('activity-closed').innerHTML = issueItems(data.closed || []);
    document.getElementById('activity-opened').innerHTML = issueItems(data.opened || []);
    document.getElementById('activity-commits').innerHTML = commitItems(data.commits || []);
    document.getElementById('activity-closed-n').textContent = c.closed;
    document.getElementById('activity-opened-n').textContent = c.opened;
    document.getElementById('activity-commits-n').textContent = c.commits;

    const empty = document.getElementById('activity-empty');
    if (empty) empty.hidden = (c.closed + c.opened + c.commits) > 0;
  }

  // The button owns the panel's open state, and the panel reports back when it
  // is toggled by its own <summary> — otherwise aria-expanded would drift out of
  // step with what the reader can actually see.
  {
    const btn = document.getElementById('activity-toggle');
    const panel = document.getElementById('activity');
    if (btn && panel) {
      const sync = () => {
        btn.setAttribute('aria-expanded', String(panel.open));
        btn.textContent = panel.open
          ? 'Hide work completed'
          : `Work completed${btn.dataset.headline ? ' · ' + btn.dataset.headline : ''}`;
      };
      btn.addEventListener('click', () => {
        panel.open = !panel.open;
        sync();
        if (panel.open) panel.scrollIntoView({ block: 'nearest' });
      });
      panel.addEventListener('toggle', sync);
      sync();
    }
  }

  loadActivity();
  load();
})();
</script>
