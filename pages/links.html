<script>
  /* A page fragment opened on its own resolves its CSS and modules relative to
     /pages/ instead of the site root, so it renders unstyled and never
     finishes loading. These files are fetched and injected by index.html;
     opened directly they are simply the wrong URL. Redirect to the route that
     works. server.js wraps them automatically, so this only fires on a static
     host. */
  (function () {
    var m = location.pathname.match(/\/pages\/([a-z0-9-]+)\.html$/i);
    if (!m) return;                       // injected by the SPA: nothing to do
    var root = location.pathname.slice(0, m.index + 1);
    location.replace(root + '?page=' + m[1] + location.search.replace(/^\?/, '&') + location.hash);
  })();
</script>
<link rel="stylesheet" href="src/styles/pages/links.css?v=1.0.89">

<div class="x-hero">
  <div class="x-hero__content">
    <div class="page__hero">
  <h1>Interesting <span class="x-gradient-text">Links</span></h1>
  <p class="x-hero__subtitle">A curated list of interesting resources.</p>
</div>

<div class="page__section">
  <h2>Content</h2>

  </div>
</div>

<section class="links-content-area">
  <div class="links-container">
    
    <!-- Add Form -->
    <div class="x-glass-card links-add-form-card">
      <h3>Add New Link</h3>
      <form id="add-link-form" class="links-add-form">
        <input type="text" id="link-url" placeholder="URL (e.g. https://github.com/...)" class="x-input-glass" required>
        <input type="text" id="link-title" placeholder="Title" class="x-input-glass" required>
        <input type="text" id="link-desc" placeholder="Description" class="x-input-glass">
        <button type="submit" class="x-btn-gradient">Add Link</button>
      </form>
    </div>

    <!-- Links List -->
    <div id="links-list" class="links-list">
      <!-- Links will be injected here -->
    </div>

  </div>
</section>

<script>
  const DATA_FILE = 'data/interesting-links.json';
  let links = [];

  async function loadLinks() {
    try {
      const response = await fetch(DATA_FILE);
      if (response.ok) {
        links = await response.json();
        renderLinks();
      }
    } catch (error) {
      console.error('Error loading links:', error);
    }
  }

  async function saveLinks() {
    try {
      const response = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          location: DATA_FILE,
          data: links
        })
      });
      if (response.ok) {
        renderLinks();
      }
    } catch (error) {
      console.error('Error saving links:', error);
    }
  }

  function renderLinks() {
    const container = document.getElementById('links-list');
    container.innerHTML = '';
    
    links.forEach(link => {
      const item = document.createElement('div');
      // Layout lives in links.css under .links-item (#779: no inline styles).
      item.className = 'x-glass-card links-item';
      
      item.innerHTML = `
        <div class="links-item__body">
          <h3 class="links-item__title">
            <a href="${link.url}" target="_blank">${link.title}</a>
          </h3>
          <p class="links-item__desc">${link.description || ''}</p>
          <a class="links-item__url" href="${link.url}" target="_blank">${link.url}</a>
        </div>
        <div class="links-item__actions">
          <button class="x-btn-glass links-item__action" onclick="editLink(${link.id})" title="Edit">✏️</button>
          <button class="x-btn-glass links-item__action links-item__action--delete" onclick="deleteLink(${link.id})" title="Delete">🗑️</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  document.getElementById('add-link-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const url = document.getElementById('link-url').value;
    const title = document.getElementById('link-title').value;
    const desc = document.getElementById('link-desc').value;
    
    const newLink = {
      id: Date.now(),
      url,
      title,
      description: desc
    };
    
    links.unshift(newLink);
    saveLinks();
    e.target.reset();
  });

  window.deleteLink = (id) => {
    if(confirm('Are you sure you want to delete this link?')) {
      links = links.filter(l => l.id !== id);
      saveLinks();
    }
  };

  window.editLink = (id) => {
    const link = links.find(l => l.id === id);
    if (link) {
      const newTitle = prompt('Edit Title:', link.title);
      if (newTitle === null) return;
      
      const newDesc = prompt('Edit Description:', link.description);
      if (newDesc === null) return;
      
      const newUrl = prompt('Edit URL:', link.url);
      if (newUrl === null) return;

      link.title = newTitle;
      link.description = newDesc;
      link.url = newUrl;
      saveLinks();
    }
  };

  loadLinks();
</script>

</div>
